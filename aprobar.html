<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Secret FC · Aprobaciones</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A07; --card:#16130B; --card2:#1D1910;
  --gold:#C8A84B; --gold2:#E0C979;
  --text:#F2EEE0; --text2:rgba(242,238,224,.66); --mid:rgba(242,238,224,.44); --border:rgba(242,238,224,.08);
  --rival:#E0645A; --ok:#3ECF8E; --warn:#F5C518;
  --gutter:clamp(16px,3vw,40px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,sans-serif;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:96px var(--gutter) 80px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(40px,6vw,68px);letter-spacing:.02em;margin:0;line-height:.95}
.lead{color:var(--text2);margin:10px 0 28px;max-width:720px}
.vacio{padding:48px;border:1px dashed var(--border);border-radius:14px;text-align:center;color:var(--mid)}

.lote-cab{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px}
.lote-cab h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;margin:0;letter-spacing:.01em}
.lote-cab .meta{color:var(--mid);font-size:14px;margin-top:4px}
.lote-cab .fecha{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:var(--mid);font-size:14px}
.lote-cab .fecha input{font:600 14px Barlow,sans-serif;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;color-scheme:dark}
.generar{display:flex;justify-content:flex-end;margin:4px 0 8px}
.lote-cab .acciones{display:flex;gap:10px;flex-wrap:wrap}

.lote{margin-bottom:34px}
.lote.cerrado{margin-bottom:14px}
.lote.cerrado .lote-cab{margin-bottom:0}
.lote.cerrado .fila{display:none}
.lote-cab .meta .mal{color:var(--rival)}
/* Una fila horizontal por lote: la página no se estira con cada red */
.fila{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,350px);gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.celda{scroll-snap-align:start;display:flex;flex-direction:column;min-width:0}
.celda>.pieza{flex:1}
.red-tag{display:flex;align-items:center;gap:8px;margin:0 0 8px 2px;font:700 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--text2)}
.red-tag .punto{width:9px;height:9px;border-radius:50%}
button.plegar{background:none}

.pieza{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pieza.aprobada{border-color:rgba(62,207,142,.55)}
.pieza.descartada{opacity:.45}
.pieza-cab{padding:14px 16px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.formato{font-weight:700;font-size:15px}
.desc{color:var(--mid);font-size:13px;margin-top:2px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--card2);color:var(--text2)}
.chip.aprobada,.chip.publicado{background:rgba(62,207,142,.15);color:var(--ok)}
.chip.descartada,.chip.error{background:rgba(224,100,90,.15);color:var(--rival)}
.chip.publicando{background:rgba(245,197,24,.15);color:var(--warn)}

.medio{background:#000;position:relative}
.medio img,.medio video{display:block;width:100%;height:auto}
.medio.vertical{display:flex;justify-content:center}
.medio.vertical video,.medio.vertical img{width:auto;max-width:100%;max-height:560px}
.medio.con-portada{display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:10px}
.medio.con-portada > video{max-width:62%}
.portada{margin:0;flex:0 0 32%;position:relative}
.portada img{width:100%!important;height:auto;max-height:none!important;border-radius:8px;border:2px solid var(--gold)}
.portada figcaption{position:absolute;left:6px;top:6px;padding:3px 8px;border-radius:999px;background:var(--gold);color:#0B0A07;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase}
.carrusel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.carrusel>*{flex:0 0 100%;scroll-snap-align:start}
.carrusel.vertical img{max-height:560px;object-fit:contain}
.contador{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}

.texto{padding:12px 16px 0}
.texto label{font-size:12px;color:var(--mid);text-transform:uppercase;letter-spacing:.08em}
input.titulo{width:100%;margin-top:6px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:700 15px Barlow,sans-serif}
input.titulo:focus{outline:2px solid var(--gold);outline-offset:-1px}
textarea{width:100%;min-height:110px;margin-top:6px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:15px/1.45 Barlow,sans-serif;resize:vertical}
textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.cuenta{font-size:12px;color:var(--mid);text-align:right;margin-top:4px}
.cuenta.pasado{color:var(--rival)}
.extra{padding:4px 16px 0;font-size:13px;color:var(--text2)}
.extra b{color:var(--text)}
.link{padding:10px 16px 0;font-size:14px}
.link a{color:var(--gold2)}
.error-txt{padding:10px 16px 0;color:var(--rival);font-size:13px}
.prod{margin:10px 16px 0;padding:8px 12px;border-radius:8px;font-size:13px;background:var(--card2);color:var(--text2)}
.prod.lista{color:var(--ok)}
.prod.esperando,.prod.produciendo{color:var(--warn)}
.prod.error{color:var(--rival)}
.avisos{list-style:none;margin:6px 0 0;padding:0 16px;font-size:13px;line-height:1.35}
.avisos:empty{display:none}
.avisos li{padding:3px 0 3px 14px;position:relative;color:var(--warn)}
.avisos li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:currentColor}
.avisos li.error{color:var(--rival)}
.botones{margin-top:auto;display:flex;gap:8px;padding:14px 16px 16px}

button{font:700 14px Barlow,sans-serif;border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text);transition:background-color .15s,border-color .15s,opacity .15s}
button:hover{border-color:var(--gold)}
button.si{background:var(--gold);color:#0B0A07;border-color:var(--gold)}
button.si:hover{background:var(--gold2)}
button.no:hover{border-color:var(--rival);color:var(--rival)}
button:disabled{opacity:.4;cursor:default}
.botones button{flex:1}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin:0 0 30px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:14px 18px;font:700 17px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);white-space:nowrap}
.tab:hover{color:var(--text);border-color:transparent;border-bottom-color:var(--border)}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.tab i{font-style:normal;margin-left:8px;background:var(--gold);color:#0B0A07;border-radius:999px;padding:1px 8px;font-size:13px}
.seccion{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:34px;letter-spacing:.03em;margin:8px 0 4px}
.seccion-sub{color:var(--mid);font-size:14px;margin:0 0 18px}
.seccion+.vacio,.seccion-sub+.vacio{margin-bottom:40px}
/* Discards (aprobar-discards.js): igual que un álbum de /music */
.dz-album{border-top:1px solid var(--border);padding-top:28px;margin-top:36px}
.dz-cab{display:grid;grid-template-columns:clamp(140px,22vw,220px) 1fr;gap:clamp(18px,3vw,34px);align-items:end}
.dz-tapa{aspect-ratio:1;width:100%;border:0;padding:0;border-radius:14px;background:var(--card2) center/cover no-repeat;box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:zoom-in;transition:transform .2s ease}
.dz-tapa:hover{transform:scale(1.02)}
.dz-toggle{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.dz-toggle > span:first-child > span{display:block}
.dz-toggle:focus-visible,.dz-tapa:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:14px}
.dz-tipo{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.dz-nombre{font-weight:900;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:.95;letter-spacing:-.035em;margin-top:8px}
.dz-desc{margin-top:12px;color:var(--text2);line-height:1.5;max-width:560px}
.dz-cuenta{margin-top:10px;font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.dz-flecha{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--text2);align-self:center;transition:transform .25s ease,border-color .2s ease,color .2s ease}
.dz-flecha svg{width:18px;height:18px}
.dz-toggle:hover .dz-flecha{border-color:var(--gold);color:var(--gold)}
.dz-album.abierto .dz-flecha{transform:rotate(180deg)}
.dz-temas{display:none;flex-direction:column;gap:12px}
.dz-album.abierto .dz-temas{display:flex;margin-top:22px}
.dz-tema{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;transition:border-color .2s ease,background-color .2s ease}
.dz-tema.sonando{border-color:rgba(201,168,76,.55);background:var(--card2)}
.dz-play{width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);color:#0B0A07;display:grid;place-items:center;cursor:pointer;transition:transform .15s ease}
.dz-play:hover{transform:scale(1.06)}
.dz-play[disabled]{opacity:.3;cursor:default;transform:none}
.dz-play svg{width:24px;height:24px}
.dz-info{min-width:0}
.dz-titulo{font-weight:900;font-size:1.6rem;letter-spacing:-.02em;line-height:1.05}
.dz-pista{font:700 15px 'Barlow Condensed',sans-serif;color:var(--mid);margin-right:10px}
.dz-meta{margin-top:6px;font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.dz-meta b{color:var(--gold2);font-weight:700}
.dz-acciones{display:flex;gap:8px;justify-content:flex-end}
.dz-chip{border:1px solid var(--border);background:transparent;color:var(--text2);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.16em;padding:9px 14px;border-radius:999px;cursor:pointer;text-transform:uppercase;transition:border-color .2s ease,color .2s ease}
.dz-chip:hover,.dz-chip.on{border-color:var(--gold);color:var(--gold)}
.dz-barra{grid-column:1/-1;height:4px;border-radius:4px;background:rgba(242,238,224,.08);overflow:hidden;cursor:pointer;display:none}
.dz-tema.sonando .dz-barra{display:block}
.dz-barra i{display:block;height:100%;width:0;background:var(--gold)}
.dz-letra{grid-column:1/-1;display:none;white-space:pre-line;font-size:1.02rem;line-height:1.7;color:var(--text);padding:6px 0 4px 84px;columns:2 300px;column-gap:40px}
.dz-letra .sec{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.22em;color:var(--gold);display:block;margin-top:14px;break-after:avoid;text-transform:uppercase}
.dz-tema.con-letra .dz-letra{display:block}
@media (max-width:700px){
  .dz-tema{grid-template-columns:52px 1fr;gap:14px;padding:18px}
  .dz-play{width:52px;height:52px}
  .dz-acciones{grid-column:1/-1;justify-content:flex-start}
  .dz-letra{padding-left:0;columns:1}
  .dz-titulo{font-size:1.35rem}
  .dz-cab{grid-template-columns:96px 1fr;gap:14px;align-items:center}
  .dz-toggle{align-items:center}
  .dz-desc{display:none}
  .dz-flecha{width:36px;height:36px}
}
/* portada en grande (igual que /music) */
.visor{position:fixed;inset:0;z-index:2000;background:rgba(5,4,2,.92);display:none;place-items:center;padding:24px;cursor:zoom-out}
.visor.on{display:grid}
.visor figure{margin:0}
.visor img{max-width:min(92vw,1400px);max-height:84vh;width:auto;height:auto;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.visor figcaption{margin-top:14px;text-align:center;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.2em;color:var(--text2);text-transform:uppercase}
.visor button{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:22px;cursor:pointer}
.discards-cab .seccion-sub{margin-bottom:0}
.discards-cab+.d-tema{margin-top:18px}
.d-tema{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-bottom:12px}
.d-cab{display:flex;align-items:center;justify-content:space-between;gap:14px}
.d-titulo{font-weight:900;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.d-pista{color:var(--mid);font-weight:700;font-size:14px;margin-right:12px}
.d-tema audio{display:block;width:100%;height:40px;margin-top:12px}
.d-meta{margin-top:8px;font-size:13px;color:var(--mid)}
.d-chip{border:1px solid var(--border);background:transparent;color:var(--text2);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer;flex:none}
.d-chip:hover,.d-chip.on{border-color:var(--gold);color:var(--gold)}
.d-letra{display:none;white-space:pre-line;font-size:15px;line-height:1.7;color:var(--text);margin-top:14px;columns:2 280px;column-gap:36px}
.d-letra .sec{display:block;margin-top:12px;font:800 11px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);break-after:avoid}
.d-tema.con-letra .d-letra{display:block}
.cuando{font:800 13px 'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.redes-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.redes-chips span{font-size:12px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--text2)}
.g-gancho{margin:4px 16px 0;padding:14px 16px;border-left:3px solid var(--gold);background:var(--card2);font:700 18px/1.35 Barlow,sans-serif}
.g-escenas{margin:14px 16px 0;padding-left:20px;color:var(--text2);font-size:15px;line-height:1.5}
.g-escenas li{margin-bottom:6px}
.g-bloque{margin:12px 16px 0;font-size:14px;line-height:1.5;color:var(--text2);white-space:pre-line}
.g-bloque b{display:block;color:var(--text);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.vista{margin:12px 16px 0;border:1px solid var(--border);border-radius:10px;background:var(--card2)}
.vista summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;color:var(--gold2)}
.nota{padding:4px 18px 18px;font-size:15px;line-height:1.55;color:var(--text2)}
.nota-cat{font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.nota h3{font-family:'Barlow Condensed',sans-serif;font-size:26px;line-height:1.05;color:var(--text);margin:6px 0 8px}
.nota .bajada{color:var(--text);font-weight:600}
.nota h4{font-family:'Barlow Condensed',sans-serif;font-size:19px;color:var(--text);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.nota dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.nota dl div{background:var(--card);border-radius:8px;padding:8px 10px}
.nota dt{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mid)}
.nota dd{margin:2px 0 0;color:var(--text);font-weight:700}
.nota blockquote{margin:14px 0;padding-left:14px;border-left:3px solid var(--gold);color:var(--text);font-style:italic}
.nota cite{display:block;font-style:normal;font-size:13px;color:var(--mid);margin-top:4px}
.nota figure{margin:12px 0}
.nota figure img{width:100%;border-radius:8px;display:block}
.nota figure.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nota figure.par figcaption{grid-column:1/-1}
.nota figcaption{font-size:12px;color:var(--mid);margin-top:4px}
.nota a{color:var(--gold2)}
/* Música: demos de Thrive (una tarjeta por parte) */
.m-audio{display:block;width:min(520px,100%);margin-top:12px;height:40px}
.m-detalle{margin:4px 16px 0;padding:12px 14px;border-radius:10px;background:var(--card2);font-size:14px;line-height:1.5;color:var(--text2);white-space:pre-line;max-height:320px;overflow-y:auto}
.m-detalle.letra{font-size:14.5px;color:var(--text)}
.m-detalle .sec{display:block;margin-top:8px;font:800 11px 'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pieza.musica.descartada{opacity:1;border-color:rgba(245,197,24,.55)}
.chip.descartada.m{background:rgba(245,197,24,.15);color:var(--warn)}
#pin{display:none;max-width:360px;margin:40px auto;text-align:center}
#pin input{width:100%;font:600 22px Barlow,sans-serif;text-align:center;letter-spacing:.3em;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);margin:14px 0}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.aviso.ver{opacity:1}
@media (max-width:520px){.fila{grid-auto-columns:86%}.lote-cab .acciones{width:100%}.lote-cab .acciones button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Aprobaciones</h1>
  <p class="lead">Todo lo que está por publicarse: las piezas de las redes del club y las demos de música de Tacet Sin. Revisá cada una, corregí o comentá lo que haga falta y aprobala. Solo sale lo aprobado.</p>
  <div id="pin">
    <div>PIN de administrador</div>
    <input type="password" inputmode="numeric" autocomplete="off" id="pin-in">
    <button class="si" id="pin-ok">Entrar</button>
  </div>
  <div id="lotes"></div>
</div>
<div class="aviso" id="aviso"></div>
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Portada"><figure><img id="visor-img" alt="Portada de Discards"><figcaption>Tacet Sin · Discards</figcaption></figure><button type="button" aria-label="Cerrar">×</button></div>
<script src="aprobar-discards.js?v=1"></script>
<script src="aprobar.js?v=20"></script>
<script src="layout.js?v=26"></script>
</body>
</html>
