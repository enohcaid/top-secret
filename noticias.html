<meta name="twitter:image" content="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/og/og-noticias-v2.jpg">
  <link rel="icon" type="image/png" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/favicon-64.png">
<link rel="apple-touch-icon" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #111111;
      --white:  #FFFFFF;
      --gray:   #1C1C1C;
      --gold:   #C9A84C;
      --gold2:  #E8C97A;
      --mid:    rgba(255,255,255,.4);
      --border: rgba(255,255,255,.09);
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--black);
      color: var(--text, #F0F2F8);
      padding-left: 64px;
      padding-right: 48px;
      padding-top: 64px;
      min-height: 100vh;
    }

    /* ── Page wrapper ── */
    .page-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 48px var(--ts-g) 80px;
    }

    /* ── Page header ── */
    .page-header {
      margin-bottom: 40px;
    }
    .page-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      line-height: 1;
    }
    .page-header h1 span { color: var(--gold); }
    .page-header p {
      margin-top: 8px;
      color: var(--mid);
      font-size: .9rem;
    }

    /* ── Featured card ── */
    .featured-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: linear-gradient(160deg, var(--card, #16130B), var(--bg, #0B0A07) 85%);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      min-height: 480px;
      margin-bottom: 64px;
      position: relative;
    }
    @media (max-width: 760px) {
      .featured-card { grid-template-columns: 1fr; }
      .featured-photo { min-height: 260px; order: -1; }
    }
    /* Noticia con video: apilado a todo el ancho (video arriba, texto abajo)
       en vez del grid 2 columnas, para que el video se vea grande sin
       necesidad de pantalla completa. */
    .featured-card.has-video {
      display: flex;
      flex-direction: column;
      min-height: unset;
    }
    .featured-card.has-video .featured-text {
      padding: 32px 40px 40px;
    }
    .featured-text {
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }
    .featured-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .pill-pinned {
      background: var(--gold);
      color: var(--text, #F0F2F8);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 999px;
    }
    .pill-cat {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }
    .featured-title {
      font-family: 'Barlow', sans-serif;
      font-size: clamp(2rem, 3.6vw, 3.3rem);
      font-weight: 900;
      letter-spacing: -.035em;
      color: var(--text, #F2EEE0);
      line-height: 1;
      margin-bottom: 16px;
    }
    .featured-date {
      font-size: .8rem;
      color: rgba(255,255,255,.35);
      margin-bottom: 20px;
    }
    .featured-excerpt {
      font-size: .95rem;
      line-height: 1.6;
      color: rgba(255,255,255,.7);
      margin-bottom: 32px;
    }
    .featured-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--gold);
      color: var(--text, #F0F2F8);
      border: none;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 999px;
      transition: background .15s;
    }
    .btn-primary:hover { background: var(--gold2); }
    .btn-secondary {
      background: transparent;
      color: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.2);
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 999px;
      transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

    .featured-photo {
      position: relative;
      overflow: hidden;
    }
    .featured-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .featured-photo-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--card, #16130B) 0%, transparent 35%);
      pointer-events: none;
    }
    .featured-video {
      position: relative;
      overflow: hidden;
      background: #000;
      order: -1;
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .featured-video.tiktok {
      max-width: 325px;
      aspect-ratio: 325 / 780;
      align-self: center;
    }
    .featured-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── Section heading ── */
    .section-heading {
      font-family: 'Barlow', sans-serif;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--text, #F0F2F8);
      margin-bottom: 28px;
    }
    .section-heading span { color: inherit; }

    /* ── News grid ── */
    /* Tarjetas con la imagen a sangre (4:5, formato del post diario) y el texto encima */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .news-card {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--card, #16130B);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      isolation: isolate;
      transition: border-color .2s ease;
    }
    .news-card:hover { border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
    .news-card::after {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to top, rgba(5,4,3,.94) 0%, rgba(5,4,3,.4) 42%, transparent 68%);
    }
    .news-card-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 0;
      display: block;
      background: var(--card, #16130B);
      transition: transform .6s cubic-bezier(.22,1,.36,1);
    }
    .news-card:hover .news-card-img { transform: scale(1.05); }
    .news-card-body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 20px 22px; color: #fff; }
    .news-card-cat {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .news-card-title {
      font-family: 'Barlow', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -.015em;
      line-height: 1.15;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 8px;
    }
    .news-card-date {
      font-size: .75rem;
      color: var(--mid);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--mid);
    }
    .empty-state p { font-size: .95rem; }

    /* ── Modal overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 40px 20px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

    /* ── Article modal ── */
    .article-modal {
      background: var(--gray);
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
      max-width: 1000px;
      max-height: 92vh;
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    .article-modal-img-col {
      flex: 0 0 52%;
      background: #111;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
    }
    .article-modal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .article-modal-body {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 32px 36px 44px;
    }
    .article-modal-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .article-modal-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
      line-height: 1.05;
      margin-bottom: 8px;
    }
    .article-modal-date {
      font-size: .8rem;
      color: var(--mid);
      margin-bottom: 28px;
    }
    .article-modal-content p {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--text, #F0F2F8);
      margin-bottom: 16px;
    }
    .article-modal-content img {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 4px auto 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .article-modal-content .video-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin: 4px 0 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }
    .article-modal-content .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .article-modal-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 10;
    }

    .article-modal.landscape { flex-direction: column; max-width: 680px; }
    .article-modal.landscape .article-modal-img-col { flex: none; width: 100%; height: 340px; }

    @media (max-width: 700px) {
      .article-modal { flex-direction: column; max-height: none; }
      .article-modal-img-col { flex: none; width: 100%; height: 55vw; min-height: 200px; }
      .article-modal-img { object-fit: cover; }
    }

    /* ── Share modal: placas generadas (share-cards.js) ── */
    .share-modal { max-width: 720px !important; }
    .sc-previews { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: end; margin-bottom: 20px; }
    .sc-prev { margin: 0; }
    .sc-prev .canvas-wrap { margin: 0; border-radius: 12px; }
    .sc-post .canvas-wrap { aspect-ratio: 4 / 5; }
    .sc-story .canvas-wrap { aspect-ratio: 9 / 16; }
    .sc-prev figcaption { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: rgba(242,238,224,.45); margin-top: 8px; }
    .share-footer-row { flex-wrap: wrap; }
    @media (max-width: 560px) { .sc-previews { grid-template-columns: 1fr 1fr; gap: 10px; } }

    /* ── Share modal ── */
    .share-modal {
      background: var(--gray);
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
      max-width: 560px;
      position: relative;
    }
    .share-modal-header {
      background: var(--black);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .share-modal-header h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #fff;
    }
    .share-modal-header h2 span { color: var(--gold); }
    .share-modal-body { padding: 24px; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .canvas-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .canvas-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: var(--gold);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .share-caption-label {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 8px;
    }
    .share-caption {
      width: 100%;
      min-height: 100px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      font-family: 'Barlow', sans-serif;
      font-size: .88rem;
      line-height: 1.5;
      color: var(--text, #F0F2F8);
      background: rgba(242,238,224,.05);
      resize: vertical;
      margin-bottom: 16px;
    }
    .share-caption:focus { outline: none; border-color: var(--gold); }

    .share-platforms {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .share-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: var(--gray);
      border-radius: 4px;
      padding: 10px 6px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text, #F0F2F8);
    }
    .share-btn:hover { border-color: var(--gold); background: #fffdf5; }
    .share-btn svg { width: 22px; height: 22px; }
    .share-btn-download { grid-column: span 2; flex-direction: row; gap: 8px; padding: 12px; }
    .share-btn-copy { flex-direction: row; gap: 6px; }
    .share-footer-row { display: flex; gap: 8px; }
    .share-footer-row .share-btn { flex: 1; }
    html.light-mode .btn-secondary {
      color: rgba(0,0,0,.6);
      border-color: rgba(0,0,0,.2);
    }
    html.light-mode .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Draft banner ── */
    .draft-banner {
      background: var(--gray);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 24px 28px;
      margin-bottom: 32px;
    }
    .draft-banner-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .draft-banner-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      background: var(--gold);
      color: #000;
      padding: 3px 9px;
      border-radius: 2px;
    }
    .draft-banner-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .draft-banner-meta {
      font-size: .78rem;
      color: var(--mid);
      margin-bottom: 10px;
    }
    .draft-banner-excerpt {
      font-size: .88rem;
      line-height: 1.6;
      color: rgba(255,255,255,.7);
      margin-bottom: 18px;
    }
    .draft-images {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .draft-img-wrap {
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
    }
    .draft-img-wrap img { display: block; height: 150px; width: auto; object-fit: contain; }
    .draft-img-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--mid);
      padding: 4px 8px;
      text-align: center;
    }
    .draft-img-label a {
      color: var(--gold);
      text-decoration: underline;
      cursor: pointer;
    }
    .draft-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-danger {
      background: transparent;
      color: #e8502e;
      border: 1px solid #e8502e;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 3px;
      transition: background .15s, color .15s;
    }
    .btn-danger:hover { background: #e8502e; color: #fff; }
    .pin-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pin-input {
      width: 88px;
      background: var(--black);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .2em;
      padding: 8px 10px;
      text-align: center;
    }
    .pin-input:focus { outline: none; border-color: var(--gold); }
    .pin-error { color: #e8502e; font-size: .78rem; font-weight: 600; display: none; }
    .draft-edit-wrap { display: none; margin-top: 16px; }
    .draft-edit-title-input, .draft-edit-body-input {
      width: 100%;
      background: var(--black);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      font-size: .88rem;
      line-height: 1.5;
      padding: 10px 12px;
      resize: vertical;
      margin-bottom: 8px;
    }
    .draft-edit-title-input:focus, .draft-edit-body-input:focus { outline: none; border-color: var(--gold); }
    .draft-edit-actions { display: flex; gap: 8px; margin-top: 4px; }

    /* ── Regen overlay ── */
    .regen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .regen-overlay.open { display: flex; }
    .regen-panel {
      background: var(--gray);
      border: 1px solid rgba(201,168,76,.5);
      border-radius: 6px;
      padding: 44px 40px;
      max-width: 480px;
      width: 92%;
      text-align: center;
    }
    .regen-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .regen-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(201,168,76,.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: regen-spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes regen-spin { to { transform: rotate(360deg); } }
    .regen-phase-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;

:root{--mono:'JetBrains Mono',ui-monospace,monospace;--xg:#C8A84B;--xok:#3ECF8E;}
body{padding-left:0;padding-right:0;}
.page-wrap{padding-top:28px;}
.xp-head{margin:0 0 clamp(28px,4vw,48px);}
.xp-path{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.78rem;color:rgba(242,238,224,.55);letter-spacing:.02em;}
.xp-dot{width:8px;height:8px;border-radius:50%;background:var(--xok);box-shadow:0 0 10px var(--xok);}
.xp-caret{color:var(--xg);animation:xpBlink 1s steps(1) infinite;}
@keyframes xpBlink{50%{opacity:0;}}
.xp-title{font-family:'Barlow',sans-serif;font-size:clamp(3rem,8vw,6.4rem);font-weight:900;letter-spacing:-.05em;line-height:.9;margin:14px 0 10px;text-transform:none;}
.xp-sub{font-family:var(--mono);font-size:.82rem;color:rgba(242,238,224,.5);}
.xp-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:22px;}
.xp-search{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:rgba(242,238,224,.05);font-family:var(--mono);font-size:.85rem;color:var(--xg);min-width:min(100%,300px);}
.xp-search input{flex:1;background:none;border:0;outline:none;color:#F2EEE0;font-family:var(--mono);font-size:.85rem;}
.xp-search input::placeholder{color:rgba(242,238,224,.35);}
.xp-cats{display:flex;flex-wrap:wrap;gap:6px;}
.xp-cat{padding:8px 14px;border:0;border-radius:999px;background:rgba(242,238,224,.05);color:rgba(242,238,224,.6);font-family:var(--mono);font-size:.74rem;cursor:pointer;}
.xp-cat:hover{color:#F2EEE0;}
.xp-cat.on{background:var(--xg);color:#0B0A07;}
.xp-mono{font-family:var(--mono);font-size:.8em;color:var(--xg);font-weight:500;letter-spacing:0;}

/* Ventana del destacado */
.xp-win{margin-bottom:clamp(48px,7vw,80px);}
.xp-bar{display:flex;align-items:center;gap:8px;padding:0 4px 14px;font-family:var(--mono);font-size:.76rem;color:rgba(242,238,224,.5);}
.xp-bar i{width:10px;height:10px;border-radius:50%;background:rgba(242,238,224,.14);}
.xp-bar i:first-child{background:#e0645a;}.xp-bar i:nth-child(2){background:#e0c979;}.xp-bar i:nth-child(3){background:#3ecf8e;}
.xp-bar span{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xp-bar b{margin-left:auto;font-weight:700;color:var(--xg);letter-spacing:.14em;}
.featured-card{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) !important;min-height:0 !important;margin:0 !important;align-items:center;}
.featured-card .featured-photo{order:0;aspect-ratio:4/3;min-height:0;}
.featured-card.has-video{display:grid !important;}
.featured-title{font-family:'Barlow',sans-serif !important;font-size:clamp(1.8rem,3.4vw,3rem) !important;font-weight:900 !important;letter-spacing:-.035em !important;text-transform:none !important;line-height:1 !important;margin:18px 0 14px !important;}
.featured-excerpt{color:rgba(242,238,224,.7) !important;}
.xp-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;font-family:var(--mono);font-size:.74rem;}
.xp-meta div{border-top:1px solid rgba(242,238,224,.1);padding-top:8px;}
.xp-meta dt{color:rgba(242,238,224,.4);text-transform:uppercase;letter-spacing:.12em;font-size:.66rem;}
.xp-meta dd{color:#F2EEE0;margin-top:2px;}
.xp-meta dd.ok{color:var(--xok);}
.btn-primary{background:var(--xg) !important;color:#0B0A07 !important;font-family:'Barlow',sans-serif !important;text-transform:none !important;letter-spacing:0 !important;font-size:.92rem !important;font-weight:800 !important;border-radius:999px !important;}
.btn-secondary{font-family:'Barlow',sans-serif !important;text-transform:none !important;letter-spacing:0 !important;font-size:.92rem !important;font-weight:700 !important;border:0 !important;background:rgba(242,238,224,.08) !important;color:#F2EEE0 !important;border-radius:999px !important;}
@media(max-width:760px){.featured-card{grid-template-columns:1fr !important;}}

/* Grilla de expedientes */
.section-heading{font-family:'Barlow',sans-serif !important;font-size:clamp(1.8rem,3.6vw,2.8rem) !important;}
.news-card .xp-tag{position:absolute;top:12px;left:12px;z-index:3;padding:4px 9px;border-radius:6px;background:rgba(11,10,7,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-family:var(--mono);font-size:.66rem;color:var(--xg);letter-spacing:.04em;}
.news-card-cat{font-family:var(--mono) !important;font-size:.66rem !important;font-weight:500 !important;letter-spacing:.08em !important;}
.news-card-date{font-family:var(--mono);font-size:.7rem !important;}

/* Visor de documento */
.xv.modal-overlay{padding:0 !important;background:#0B0A07 !important;-webkit-backdrop-filter:none;backdrop-filter:none;display:none;}
.xv.modal-overlay.open{display:block !important;}
.xv-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 clamp(16px,3vw,40px);background:rgba(11,10,7,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:var(--mono);font-size:.76rem;color:rgba(242,238,224,.55);}
.xv-bar i{width:10px;height:10px;border-radius:50%;}
.xv-bar i:first-child{background:#e0645a;}.xv-bar i:nth-child(2){background:#e0c979;}.xv-bar i:nth-child(3){background:#3ecf8e;}
.xv-bar span{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xv-close{margin-left:auto;border:0;background:rgba(242,238,224,.08);color:#F2EEE0;font-family:var(--mono);font-size:.74rem;padding:8px 14px;border-radius:999px;cursor:pointer;}
.xv-close:hover{background:var(--xg);color:#0B0A07;}
.xv .article-modal,.xv .article-modal.landscape{display:block !important;max-width:1040px !important;max-height:none !important;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,3vw,40px) 90px;background:none !important;border-radius:0 !important;overflow:visible !important;}
.xv-top{max-width:820px;}
.xv .article-modal-title{font-family:'Barlow',sans-serif !important;font-size:clamp(2.2rem,5.4vw,4.4rem) !important;font-weight:900 !important;letter-spacing:-.045em !important;text-transform:none !important;line-height:.95 !important;margin:22px 0 12px !important;}
.xv .article-modal-date{font-family:var(--mono);font-size:.78rem !important;}
.xv .article-modal-eyebrow{display:block !important;}
.xv .xp-meta{grid-template-columns:repeat(4,minmax(0,1fr));}
.xv .article-modal-img-col{width:100% !important;height:auto !important;margin:clamp(24px,4vw,44px) 0;border-radius:22px;overflow:hidden;background:#111;display:block !important;}
.xv .article-modal-img{width:100%;height:auto !important;max-height:78vh;object-fit:cover;}
.xv .article-modal-body{max-width:760px;margin:0 auto;padding:0 !important;overflow:visible !important;}
.xv .article-modal-content p{font-size:1.1rem !important;line-height:1.75 !important;color:rgba(242,238,224,.82) !important;margin-bottom:20px !important;}
.xv .article-modal-content p strong{color:#F2EEE0;}
.xv .article-modal-content a{color:var(--xg);text-decoration:underline;text-underline-offset:3px;}
.xb-h{font-family:'Barlow',sans-serif;font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:900;letter-spacing:-.035em;line-height:1;margin:56px 0 18px;color:#F2EEE0;}
.xb-fig{margin:34px 0;}
.xb-fig img,.xb-pair img{display:block;width:100% !important;max-width:none !important;margin:0 !important;border:0 !important;border-radius:18px !important;}
.xb-fig.wide{width:min(1040px,calc(100vw - 32px));margin-left:50%;transform:translateX(-50%);}
.xb-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:34px 0;}
.xb-pair img{aspect-ratio:var(--r,4/5);object-fit:cover;object-position:50% 0;}
.xb-pair figcaption,.xb-fig figcaption{grid-column:1/-1;font-family:var(--mono);font-size:.74rem;color:rgba(242,238,224,.45);margin-top:10px;}
.xb-ig{margin:34px 0;}.xb-ig iframe{display:block;width:min(100%,400px);height:720px;margin:0 auto;border:0;border-radius:18px;background:#fff;}.xb-ig figcaption{font-family:var(--mono);font-size:.74rem;color:rgba(242,238,224,.45);margin-top:10px;text-align:center;}
.xb-yt{margin:34px 0;}.xb-yt iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000;}.xb-yt.v iframe{width:min(100%,420px);aspect-ratio:9/16;margin:0 auto;}.xb-yt figcaption{font-family:var(--mono);font-size:.74rem;color:rgba(242,238,224,.45);margin-top:10px;text-align:center;}
.xb-quote{margin:40px 0;padding-left:24px;border-left:2px solid var(--xg);font-size:clamp(1.3rem,2.4vw,1.8rem);font-weight:300;line-height:1.35;color:#F2EEE0;}
.xb-quote cite{display:block;margin-top:12px;font-family:var(--mono);font-style:normal;font-size:.74rem;color:var(--xg);}
.xb-specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px;margin:26px 0 34px;font-family:var(--mono);font-size:.8rem;}
.xb-specs div{border-top:1px solid rgba(242,238,224,.12);padding-top:10px;}
.xb-specs dt{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--xg);}
.xb-specs dd{color:#F2EEE0;margin-top:4px;font-family:'Barlow',sans-serif;font-size:.95rem;}
.xv-close{white-space:nowrap;flex-shrink:0;}
@media(max-width:700px){.xp-cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;}.xp-cats::-webkit-scrollbar{display:none;}.xp-cat{flex-shrink:0;}}
@media(max-width:700px){.xv .xp-meta{grid-template-columns:1fr 1fr;}.xb-specs{grid-template-columns:1fr;}.xb-pair{grid-template-columns:1fr;}}

/* ── LIBRE: el destacado sin caja; la imagen se redondea sola ── */

<div class="page-wrap">

  <!-- Trigger admin: siempre visible pero discreto -->

      <div class="draft-banner-header">
        <span class="draft-banner-label">Borrador de hoy</span>
        <button onclick="collapseDraftBanner()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px" title="Plegar">╌</button>

        <div class="draft-banner-excerpt" id="draft-excerpt"></div>
        <div class="draft-images" id="draft-images"></div>

      <div class="draft-actions" id="draft-unlock-row">

                 onkeydown="if(event.key==='Enter')unlockDraft()">
          <button class="btn-secondary" onclick="unlockDraft()">Desbloquear</button>
        </div>
        <span class="pin-error" id="pin-error">PIN incorrecto</span>
      </div>
      <!-- Acciones: visibles sólo después de desbloquear -->
      <div class="draft-actions" id="draft-actions" style="display:none">
        <div class="pin-row">
          <button class="btn-primary" onclick="publishDraft()">Publicar</button>
          <button class="btn-secondary" onclick="editDraft()">Editar</button>
          <button class="btn-secondary" onclick="regenDraft()" title="Borrar esta noticia y generar una nueva">Regenerar</button>
          <button class="btn-danger" onclick="discardDraft()">Descartar</button>
        </div>
      </div>
      <!-- Formulario de edición -->
      <div class="draft-edit-wrap" id="draft-edit-wrap">
        <input class="draft-edit-title-input" id="draft-edit-title" type="text" placeholder="Título">

          <button class="btn-secondary" onclick="cancelDraftEdit()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="featured-slot"></div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Más redes
        </button>
      </div>
      <div class="share-footer-row">
        <button class="share-btn share-btn-download" onclick="downloadImg()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar post
        </button>
        <button class="share-btn share-btn-download" onclick="downloadStoryCard()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><polyline points="9 11 12 14 15 11"/><line x1="12" y1="14" x2="12" y2="6"/></svg>
          Descargar historia
        </button>
        <button class="share-btn share-btn-copy" onclick="copyOgLink()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          Copiar link
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// NOTICIAS data is loaded from noticias-data.js
// Auto-generated result news populated by the module script below
window._AUTO_NEWS = [];
window._KV_NEWS   = [];

// ── SHARE STATE ──────────────────────────────────────────────────────────────
let _shareNews = null;
const BASE_URL = 'https://enohcaid.github.io/top-secret/noticias.html';

// ── RENDER ───────────────────────────────────────────────────────────────────
function allNews() {
  return [...NOTICIAS, ...(window._AUTO_NEWS || []), ...(window._KV_NEWS || [])];
}

function findNews(id) {
  return allNews().find(x => x.id === id);
}

// Las imágenes de R2 tienen una versión .webp liviana al lado del PNG original
// (~150 KB vs ~2.5 MB). Se pide primero el webp; si no existe, cae al original.
function webp(url) {
  return /\/media\/.+\.(png|jpe?g)$/i.test(url || '') ? url.replace(/\.(png|jpe?g)$/i, '.webp') : url;
}
function webpFallback(url) {
  return `if(!this.dataset.f&&this.src!=='${url}'){this.dataset.f=1;this.src='${url}';return;}`;
}

function expId(n) {
  let h = 0; for (const c of n.id || '') h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return 'EXP-' + (n.date || '').replace(/-/g, '').slice(2) + '-' + (h % 1296).toString(36).toUpperCase().padStart(2, '0');
}
function fileName(n) { return (n.id || 'expediente').slice(0, 40) + '.dossier'; }

function applyFilters() {
  const q = (document.getElementById('xp-q').value || '').trim().toLowerCase();
  const cat = window._xpCat || '';
  const norm = x => catKey(x);
  let shown = 0;
  document.querySelectorAll('#news-grid .news-card').forEach(c => {
    const ok = (!cat || norm(c.dataset.cat) === cat) && (!q || c.dataset.q.includes(q));
    c.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  const sub = document.getElementById('xp-sub');
  if (sub) sub.textContent = `> ${shown} expediente${shown === 1 ? '' : 's'}${cat ? ' · ' + cat : ''}${q ? ' · "' + q + '"' : ''} · acceso público`;
}
function catKey(c) {
  const k = String(c || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  return ({ institucional: 'institucion', resultados: 'resultado', destacados: 'destacado' })[k] || k;
}
function buildCats() {
  const count = {}, label = { Todos: 'Todos' };
  allNews().forEach(n => {
    const k = catKey(n.category); if (!k) return;
    count[k] = (count[k] || 0) + 1;
    if (!label[k] || /[^\x00-\x7f]/.test(n.category)) label[k] = n.category;
  });
  const cats = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 7);
  const el = document.getElementById('xp-cats'); if (!el) return;
  el.innerHTML = ['Todos', ...cats].map(c => `<button type="button" class="xp-cat${(window._xpCat || '') === (c === 'Todos' ? '' : c) ? ' on' : ''}" onclick="window._xpCat='${c === 'Todos' ? '' : c}';buildCats();applyFilters()">${label[c]}</button>`).join('');
}
function refreshTools() { buildCats(); applyFilters(); }

/* Cuerpo enriquecido: además de párrafos (string) acepta bloques
   {h}, {img, caption, wide}, {pair:[img, img], caption}, {quote, by}, {specs:[[clave, valor]]}. */
function bodyHtml(body) {
  return (body || []).map(b => {
    if (typeof b === 'string') return `<p>${b}</p>`;
    if (b.h) return `<h3 class="xb-h">${b.h}</h3>`;
    if (b.img) return `<figure class="xb-fig${b.wide ? ' wide' : ''}"><img src="${webp(b.img)}" alt="" loading="lazy" onerror="${webpFallback(b.img)}"><figcaption>${b.caption || ''}</figcaption></figure>`;
    if (b.pair) return `<figure class="xb-pair"${b.ratio ? ` style="--r:${b.ratio}"` : ""}>${b.pair.map(u => `<img src="${webp(u)}" alt="" loading="lazy" onerror="${webpFallback(u)}">`).join('')}<figcaption>${b.caption || ''}</figcaption></figure>`;
    if (b.youtube) return `<figure class="xb-yt${b.vertical ? ' v' : ''}"><iframe src="https://www.youtube.com/embed/${b.youtube}" title="Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><figcaption>${b.caption || ''}</figcaption></figure>`;
    // Reel de Instagram (id de instagram.com/reel/<id>/): embed oficial en iframe, sin scripts de terceros
    if (b.instagram) return `<figure class="xb-ig"><iframe src="https://www.instagram.com/reel/${b.instagram}/embed/" title="Reel de Instagram" frameborder="0" scrolling="no" allowtransparency="true" allow="encrypted-media; picture-in-picture; web-share" loading="lazy"></iframe><figcaption>${b.caption || ''}</figcaption></figure>`;
    if (b.quote) return `<blockquote class="xb-quote">${b.quote}${b.by ? `<cite>${b.by}</cite>` : ''}</blockquote>`;
    if (b.specs) return `<dl class="xb-specs">${b.specs.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
    return '';
  }).join('');
}

function formatDate(iso) {
  const n = allNews().find(x => x.date === iso);
  if (n && n.dateLabel) return n.dateLabel;
  const [y, m, d] = iso.split('-').map(Number);
  const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${d} de ${months[m - 1]} de ${y}`;
}

function videoEmbedFragment(n, cls) {
  if (n.videoProvider === 'tiktok' && n.videoId) {
    const base = `https://www.tiktok.com/embed/v2/${n.videoId}?autoplay=1`;
    return `<div class="${cls} tiktok"><iframe class="tiktok-embed-frame" data-base-src="${base}" src="${base}" title="${n.title}" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
  }
  if (n.videoId) {
    return `<div class="${cls}"><iframe src="https://www.youtube.com/embed/${n.videoId}" title="${n.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
  }
  return null;
}

// El player embebido de TikTok no repite el video solo al terminar (a diferencia
// de la app) — lo forzamos reasignando el src cada 43s (el video dura 41s; el
// margen extra evita que se corte el final) para que se vea en loop.
const TIKTOK_LOOP_MS = 43000;
function bindTiktokLoop(root) {
  (root || document).querySelectorAll('iframe.tiktok-embed-frame:not([data-loop-bound])').forEach(f => {
    f.dataset.loopBound = '1';
    const base = f.dataset.baseSrc || f.src;
    setInterval(() => {
      f.src = base + (base.includes('?') ? '&' : '?') + '_r=' + Date.now();
    }, TIKTOK_LOOP_MS);
  });
}

function renderFeatured(n) {
  const slot = document.getElementById('featured-slot');
  const videoHtml = videoEmbedFragment(n, 'featured-video');
  const media = videoHtml || `<div class="featured-photo">
         <img src="${webp(n.image)}" alt="${n.title}" onerror="${webpFallback(n.image)}this.parentElement.style.background='#1a1a1a'">
         <div class="featured-photo-gradient"></div>
       </div>`;
  slot.innerHTML = `
    <div class="xp-win">
      <div class="xp-bar"><i></i><i></i><i></i><span>${expId(n)} · ${fileName(n)}</span><b>FIJADO</b></div>
      <div class="featured-card${videoHtml ? ' has-video' : ''}">
        ${media}
        <div class="featured-text">
          <dl class="xp-meta">
            <div><dt>ID</dt><dd>${expId(n)}</dd></div>
            <div><dt>Fecha</dt><dd>${n.dateLabel || formatDate(n.date)}</dd></div>
            <div><dt>Tipo</dt><dd>${n.category}</dd></div>
            <div><dt>Estado</dt><dd class="ok">Desclasificado</dd></div>
          </dl>
          <h2 class="featured-title">${n.title}</h2>
          <p class="featured-excerpt">${n.excerpt}</p>
          <div class="featured-actions">
            <button class="btn-primary" onclick="openArticle('${n.id}')">Abrir expediente →</button>
            <button class="btn-secondary" onclick="openShare('${n.id}')">Compartir</button>
          </div>
        </div>
      </div>
    </div>
  `;
  bindTiktokLoop(slot);
}

function renderGrid(items) {
  if (!items.length) return;
  const wrap = document.getElementById('other-news-wrap');
  const grid = document.getElementById('news-grid');
  wrap.style.display = 'block';
  grid.innerHTML = items.map(n => `
    <div class="news-card" data-cat="${n.category}" data-q="${(n.title + ' ' + (n.excerpt || '')).toLowerCase().replace(/"/g, '')}" onclick="openArticle('${n.id}')">
      <span class="xp-tag">${expId(n)}</span>
      <img class="news-card-img" src="${webp(n.image)}" alt="${n.title}" loading="lazy" onerror="${webpFallback(n.image)}this.style.background='var(--gray)'">
      <div class="news-card-body">
        <div class="news-card-cat">${n.category}</div>
        <div class="news-card-title">${n.title}</div>
        <div class="news-card-date">${n.dateLabel || formatDate(n.date)}</div>
      </div>
    </div>
  `).join('');
}

function init() {
  const pinned = NOTICIAS.find(n => n.pinned);
  if (pinned) renderFeatured(pinned);
  const rest = NOTICIAS.filter(n => n !== pinned);
  renderGrid(rest);
  refreshTools();
}

function renderAutoSection() {
  // Siempre combinar ambas fuentes para que un re-render no borre a la otra
  const allAuto = [...(window._KV_NEWS || []), ...(window._AUTO_NEWS || [])];
  const existingIds = new Set(NOTICIAS.map(n => n.id));
  const autoItems = allAuto.filter(n => !existingIds.has(n.id));
  // Deduplicar por id (KV tiene prioridad por estar primero)
  const seen = new Set();
  const unique = autoItems.filter(n => { if (seen.has(n.id)) return false; seen.add(n.id); return true; });
  if (!unique.length) return;

  const pinned = NOTICIAS.find(n => n.pinned);
  const nonPinned = NOTICIAS.filter(n => n !== pinned);
  const merged = [...nonPinned, ...unique].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const wrap = document.getElementById('other-news-wrap');
  const grid = document.getElementById('news-grid');
  wrap.style.display = 'block';
  grid.innerHTML = merged.map(n => `
    <div class="news-card" data-cat="${n.category}" data-q="${(n.title + ' ' + (n.excerpt || '')).toLowerCase().replace(/"/g, '')}" onclick="openArticle('${n.id}')">
      <span class="xp-tag">${expId(n)}</span>
      ${n.image ? `<img class="news-card-img" src="${webp(n.image)}" alt="${n.title}" loading="lazy" onerror="${webpFallback(n.image)}this.style.background='var(--gray)';this.style.display='none'">` : '<div class="news-card-img" style="background:var(--black);display:flex;align-items:center;justify-content:center;font-family:\'Barlow Condensed\',sans-serif;font-size:1.1rem;font-weight:900;color:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.1em;">Resultados</div>'}
      <div class="news-card-body">
        <div class="news-card-cat">${n.category}</div>
        <div class="news-card-title">${n.title}</div>
        <div class="news-card-date">${n.dateLabel || formatDate(n.date)}</div>
      </div>
    </div>
  `).join('');
  refreshTools();
}

// ── ARTICLE MODAL ─────────────────────────────────────────────────────────────
function openArticle(id) {
  const n = findNews(id);
  if (!n) return;
  if (location.hash !== '#' + id) history.pushState({ articleId: id }, '', '#' + id);
  const amModal = document.getElementById('article-modal');
  const amImg   = document.getElementById('am-img');
  amModal.classList.remove('landscape');
  amImg.onload = function() {
    if (this.naturalWidth > this.naturalHeight) amModal.classList.add('landscape');
  };
  amImg.src = webp(n.image); amImg.onerror = function () { if (!this.dataset.f) { this.dataset.f = 1; this.src = n.image; } };
  amImg.alt = n.title;
  document.getElementById('am-file').textContent = expId(n) + ' · ' + fileName(n);
  document.getElementById('am-eyebrow').innerHTML = `<dl class="xp-meta">
      <div><dt>ID</dt><dd>${expId(n)}</dd></div><div><dt>Tipo</dt><dd>${n.category}</dd></div>
      <div><dt>Estado</dt><dd class="ok">Desclasificado</dd></div>${n.pinned ? '<div><dt>Prioridad</dt><dd>Fijado</dd></div>' : ''}</dl>`;
  document.getElementById('am-title').textContent = n.title;
  document.getElementById('am-date').textContent = n.dateLabel || formatDate(n.date);
  const amContent = document.getElementById('am-content');
  amContent.innerHTML = bodyHtml(n.body);
  document.getElementById('article-overlay').scrollTop = 0;
  bindTiktokLoop(amContent);
  document.getElementById('am-actions').innerHTML = `
    <button class="btn-primary" onclick="closeArticle(); openShare('${n.id}')">Compartir</button>
    <button class="btn-secondary" onclick="copyLink('${n.id}')">Copiar link</button>
    <button class="btn-secondary" onclick="downloadStoryCard(findNews('${n.id}'))">Descargar historia</button>
  `;
  document.getElementById('article-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeArticle() {
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  document.getElementById('article-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Descarga una imagen del sitio (misma origin en GitHub Pages) como archivo.
// Fallback: si el fetch falla (p. ej. URL externa), abre la imagen en otra pestaña.
async function downloadImage(src, baseName) {
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const ext  = (src.split('.').pop() || 'png').split('?')[0].toLowerCase();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${baseName}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    window.open(src, '_blank');
  }
}

function copyLink(id) {
  const url = 'https://top-secret-proxy.juan-c-m-1985.workers.dev/og/' + id;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.currentTarget;
    const orig = btn.textContent;
    btn.textContent = '¡Link copiado!';
    setTimeout(() => { btn.textContent = orig; }, 1800);
  });
}

window.addEventListener('popstate', function () {
  const id = location.hash.slice(1);
  if (id) {
    const n = findNews(id);
    if (n) openArticle(id);
  } else {
    document.getElementById('article-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});

// ── SHARE MODAL ──────────────────────────────────────────────────────────────
function openShare(id) {
  const n = findNews(id);
  if (!n) return;
  _shareNews = n;
  document.getElementById('share-caption').value = n.shareCaption || `${n.title}\n\n${BASE_URL}`;
  document.getElementById('canvas-loading').style.display = 'flex';
  document.getElementById('share-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  buildShareCanvas(n);
}

function closeShare() {
  document.getElementById('share-overlay').classList.remove('open');
  document.body.style.overflow = '';
  _shareNews = null;
}

// ── IMAGE PREVIEW + DESCARGA DIRECTA ─────────────────────────────────────────
// Placas con estética de expediente (share-cards.js): post 4:5 para compartir
// e historia 9:16 para descargar. Se arman una vez por noticia y se cachean.
const _cards = {};
function cardMeta(n) { return { id: expId(n), file: fileName(n) }; }
function getCard(n, kind) {
  const key = n.id + ':' + kind;
  if (!_cards[key]) _cards[key] = TSCards[kind](n, cardMeta(n))
    .then(cv => TSCards.toBlob(cv))
    .catch(() => null);
  return _cards[key];
}
async function buildShareCanvas(n) {
  const preview = document.getElementById('share-preview');
  const previewStory = document.getElementById('share-preview-story');
  const loading = document.getElementById('canvas-loading');
  loading.style.display = 'flex';
  preview.removeAttribute('src'); previewStory.removeAttribute('src');
  const [post, story] = await Promise.all([getCard(n, 'post'), getCard(n, 'story')]);
  if (_shareNews !== n) return;
  preview.src = post ? URL.createObjectURL(post) : (n.image || '');
  if (story) previewStory.src = URL.createObjectURL(story);
  loading.style.display = 'none';
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// "Original" = la placa de post; si el canvas falla, la imagen tal cual.
async function downloadOriginalImage(n) {
  if (!n) return;
  const post = await getCard(n, 'post');
  if (post) return saveBlob(post, `top-secret-fc-${n.id}-post.jpg`);
  if (!n.image) return;
  const resp = await fetch(n.image);
  const blob = await resp.blob();
  const ext  = (n.image.split('.').pop() || 'png').toLowerCase();
  saveBlob(blob, `top-secret-fc-${n.id}.${ext}`);
}

async function downloadStoryCard(n) {
  n = n || _shareNews;
  if (!n) return;
  const story = await getCard(n, 'story');
  if (story) return saveBlob(story, `top-secret-fc-${n.id}-historia.jpg`);
  if (n.imageStory) downloadImage(n.imageStory, n.id + '_story');
}

// ── SHARE ACTIONS ────────────────────────────────────────────────────────────
function getCaption() {
  return document.getElementById('share-caption').value;
}

// Límite real de Instagram para el texto de una publicación (caption).
const IG_CAPTION_LIMIT = 2200;

function fullArticleText(n) {
  if (!n.body || !n.body.length) return '';
  const bodyText = n.body.map(p => typeof p === 'string' ? p : (p.h || p.quote || '')).filter(Boolean).map(p => String(p).replace(/<[^>]+>/g, '').trim()).join('\n\n');
  return `${n.title}\n\n${bodyText}`;
}

function platformCaption(key) {
  if (!_shareNews) return '';
  const url = BASE_URL + '#' + _shareNews.id;
  // Instagram: si la nota completa entra en el límite de caption, se comparte
  // entera en vez del resumen corto — así no hace falta abrir el link.
  if (key === 'ig') {
    const full = fullArticleText(_shareNews);
    const withLink = full && (full + '\n\n🔗 ' + url);
    if (withLink && withLink.length <= IG_CAPTION_LIMIT) return withLink;
  }
  const base = (_shareNews.shareCaptions || {})[key] || _shareNews.shareCaption || '';
  return base + '\n\n🔗 ' + url;
}

function copyAndFlash(btn, text, label) {
  navigator.clipboard.writeText(text).catch(() => {});
  document.getElementById('share-caption').value = text;
  const orig = btn.innerHTML;
  btn.innerHTML = orig.replace(label, '✓ Copiado');
  setTimeout(() => { btn.innerHTML = orig; }, 2000);
}

async function shareIG() {
  const btn = event.currentTarget;
  copyAndFlash(btn, platformCaption('ig'), 'Instagram');
  await downloadOriginalImage(_shareNews);
}

async function shareX() {
  const btn = event.currentTarget;
  const cap = platformCaption('x');
  copyAndFlash(btn, cap, 'X / Twitter');
  await downloadOriginalImage(_shareNews);
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(cap), '_blank');
}

async function shareFB() {
  const btn = event.currentTarget;
  copyAndFlash(btn, platformCaption('fb'), 'Facebook · imagen descargada');
  await downloadOriginalImage(_shareNews);
  window.open('https://www.facebook.com/', '_blank');
}

async function shareAll() {
  await webShareAction();
}

function downloadImg() {
  downloadOriginalImage(_shareNews);
}

async function webShareAction() {
  if (!_shareNews) return;
  try {
    let blob = await getCard(_shareNews, 'post'), ext = 'jpg';
    if (!blob) {
      const resp = await fetch(_shareNews.image);
      blob = await resp.blob();
      ext  = (_shareNews.image.split('.').pop() || 'png').toLowerCase();
    }
    const file = new File([blob], `top-secret-fc.${ext}`, { type: blob.type });
    await navigator.share({ title: _shareNews.title, text: getCaption(), files: [file] });
  } catch(e) {
    if (e.name !== 'AbortError') await downloadOriginalImage(_shareNews);
  }
}

function copyCaption() {
  const txt = getCaption();
  navigator.clipboard.writeText(txt).then(() => {
    const btn = event.currentTarget;
    const orig = btn.innerHTML;
    btn.innerHTML = btn.innerHTML.replace('Copiar texto', '¡Copiado!');
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

function copyOgLink() {
  if (!_shareNews) return;
  const btn = event.currentTarget;
  const ogUrl = 'https://top-secret-proxy.juan-c-m-1985.workers.dev/og/' + _shareNews.id;
  navigator.clipboard.writeText(ogUrl).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = btn.innerHTML.replace('Copiar link', '¡Copiado!');
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

// ── CLOSE ON BACKDROP ────────────────────────────────────────────────────────
document.getElementById('article-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeArticle();
});
document.getElementById('share-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeShare();
});

// ── INIT ─────────────────────────────────────────────────────────────────────
init();
const _initHash = location.hash.slice(1);
if (_initHash && findNews(_initHash)) openArticle(_initHash);

// ── KV DRAFT BANNER ──────────────────────────────────────────────────────────
const _WORKER = 'https://top-secret-proxy.juan-c-m-1985.workers.dev';
let _currentDraft = null;

async function loadKvContent() {
  // Load published KV articles and merge into grid
  try {
    const r = await fetch(_WORKER + '/published-noticias');
    if (r.ok) {
      const { articles } = await r.json();
      if (articles && articles.length) {
        window._KV_NEWS = articles.map(a => ({ ...a, pinned: false }));
        renderAutoSection();
      }
    }
  } catch(e) {}

  // Load pending draft
  try {
    const r = await fetch(_WORKER + '/draft-noticia');
    if (!r.ok) return;
    const { draft } = await r.json();
    if (!draft) return;
    _currentDraft = draft;
    _renderDraftBanner(draft);
  } catch(e) {}
}

function _renderDraftBanner(draft) {
  document.getElementById('draft-title').textContent   = draft.title   || '';
  document.getElementById('draft-meta').textContent    = (draft.dateLabel || draft.date) + (draft.category ? ' · ' + draft.category : '');
  document.getElementById('draft-excerpt').textContent = draft.excerpt  || '';
  const imagesEl = document.getElementById('draft-images');
  imagesEl.innerHTML = '';
  const _cacheBust = Date.now();
  if (draft.imagePost)  imagesEl.innerHTML += `<div><div class="draft-img-wrap"><img src="${draft.imagePost}?t=${_cacheBust}" alt="Post"></div><div class="draft-img-label">Post (1086×1448) · <a href="#" onclick="event.preventDefault(); downloadImage('${draft.imagePost.replace(/'/g, "\\'")}', '${(draft.id || 'draft')}_post')">Descargar</a></div></div>`;
  if (draft.imageStory) imagesEl.innerHTML += `<div><div class="draft-img-wrap"><img src="${draft.imageStory}?t=${_cacheBust}" alt="Story"></div><div class="draft-img-label">Story (941×1672) · <a href="#" onclick="event.preventDefault(); downloadImage('${draft.imageStory.replace(/'/g, "\\'")}', '${(draft.id || 'draft')}_story')">Descargar</a></div></div>`;
}

function expandDraftBanner() {
  document.getElementById('draft-trigger').style.display = 'none';
  document.getElementById('draft-banner').style.display  = 'block';
  document.getElementById('draft-unlock-row').style.display = 'block';
  document.getElementById('draft-content').style.display    = 'none';
  document.getElementById('draft-actions').style.display    = 'none';
  document.getElementById('draft-edit-wrap').style.display  = 'none';
  _sessionPin = '';
  document.getElementById('draft-pin').focus();
}

function collapseDraftBanner() {
  document.getElementById('draft-banner').style.display  = 'none';
  document.getElementById('draft-trigger').style.display = 'block';
  _sessionPin = '';
}

function _showPinErr(show) { document.getElementById('pin-error').style.display = show ? 'inline' : 'none'; }
let _sessionPin = '';

async function unlockDraft() {
  const pin = (document.getElementById('draft-pin').value || '').trim();
  if (!pin) { _showPinErr(true); return; }
  const r = await fetch(_WORKER + '/draft-noticia', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + pin, 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  });
  if (r.status === 401) { _showPinErr(true); return; }
  _sessionPin = pin;
  _showPinErr(false);
  // Si el draft no estaba precargado (no había KV al cargar la página), lo cargamos ahora
  if (!_currentDraft) {
    try {
      const gr = await fetch(_WORKER + '/draft-noticia');
      if (gr.ok) {
        const { draft } = await gr.json();
        if (draft) { _currentDraft = draft; _renderDraftBanner(draft); }
      }
    } catch(e) {}
  }
  document.getElementById('draft-unlock-row').style.display = 'none';
  if (_currentDraft) {
    document.getElementById('draft-content').style.display = 'block';
    document.getElementById('draft-actions').style.display = 'flex';
  } else {
    document.getElementById('draft-content').innerHTML = '<p style="color:var(--mid);font-size:.88rem">No hay borrador pendiente.</p>';
    document.getElementById('draft-content').style.display = 'block';
  }
}

async function publishDraft() {
  const r = await fetch(_WORKER + '/publish-noticia', { method: 'POST', headers: { 'Authorization': 'Bearer ' + _sessionPin } });
  if (!r.ok) { alert('Error al publicar. Intentá de nuevo.'); return; }
  window._KV_NEWS = [{ ..._currentDraft, status: 'published', pinned: false }, ...window._KV_NEWS.filter(n => n.id !== _currentDraft.id)];
  renderAutoSection();
  document.getElementById('draft-banner').style.display  = 'none';
  document.getElementById('draft-trigger').style.display = 'none';
  _currentDraft = null; _sessionPin = '';
}

async function discardDraft() {
  if (!confirm('¿Descartar el borrador de hoy?')) return;
  const r = await fetch(_WORKER + '/draft-noticia', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + _sessionPin } });
  if (!r.ok) { alert('Error al descartar.'); return; }
  document.getElementById('draft-banner').style.display  = 'none';
  document.getElementById('draft-trigger').style.display = 'none';
  _currentDraft = null; _sessionPin = '';
}

function editDraft() {
  if (!_currentDraft) return;
  document.getElementById('draft-edit-title').value       = _currentDraft.title || '';
  document.getElementById('draft-edit-body').value        = (_currentDraft.body || []).join('\n');
  document.getElementById('draft-edit-wrap').style.display = 'block';
  document.getElementById('draft-actions').style.display  = 'none';
}

function cancelDraftEdit() {
  document.getElementById('draft-edit-wrap').style.display = 'none';
  document.getElementById('draft-actions').style.display   = 'flex';
}

async function saveDraftEdit() {
  const newTitle = document.getElementById('draft-edit-title').value.trim();
  const newBody  = document.getElementById('draft-edit-body').value.split('\n').filter(s => s.trim());
  const r = await fetch(_WORKER + '/draft-noticia', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + _sessionPin, 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: newTitle, body: newBody }),
  });
  if (!r.ok) { alert('Error al guardar.'); return; }
  _currentDraft = { ..._currentDraft, title: newTitle, body: newBody };
  _renderDraftBanner(_currentDraft);
  cancelDraftEdit();
}

loadKvContent();

// ── REGEN PIPELINE ────────────────────────────────────────────────────────────
let _regenInterval = null;
let _regenStart    = 0;

async function regenDraft() {
  // Close any open confirm state, reset UI to processing
  _showRegenPhase('processing');
  document.getElementById('regen-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const r = await fetch(_WORKER + '/request-regen', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + _sessionPin },
    });
    if (!r.ok) {
      _showRegenError(r.status === 401 ? 'PIN incorrecto.' : 'Error al disparar la regeneración.');
      return;
    }
  } catch(e) {
    _showRegenError('Sin conexión con el servidor.');
    return;
  }

  _currentDraft = null;
  _regenStart   = Date.now();
  if (_regenInterval) clearInterval(_regenInterval);

  _regenInterval = setInterval(_regenTick, 5000);
  _regenElapsedTick();
}

async function _regenTick() {
  const elapsed = Math.round((Date.now() - _regenStart) / 1000);

  // Timeout after 20 minutes
  if (elapsed > 1200) {
    clearInterval(_regenInterval);
    _regenInterval = null;
    _showRegenError('El proceso tardó demasiado. Revisá el log local y reintentá.');
    return;
  }

  try {
    const r = await fetch(_WORKER + '/draft-noticia');
    if (!r.ok) return;
    const { draft } = await r.json();

    if (!draft) {
      // Still generating article
      document.getElementById('regen-phase-title').textContent = 'Generando artículo...';
      document.getElementById('regen-detail').textContent = 'El agente está recopilando datos del club';
      return;
    }

    _currentDraft = draft;

    if (!draft.imagePost) {
      // Article ready, waiting for images
      document.getElementById('regen-phase-title').textContent = 'Generando imágenes...';
      document.getElementById('regen-detail').textContent = `"${draft.title}"`;
    } else {
      // Everything ready → confirmation
      clearInterval(_regenInterval);
      _regenInterval = null;
      _showRegenConfirm(draft);
    }
  } catch(e) {}
}

function _regenElapsedTick() {
  const el = document.getElementById('regen-elapsed');
  if (!el) return;
  const tick = () => {
    if (!document.getElementById('regen-overlay').classList.contains('open')) return;
    const s = Math.round((Date.now() - _regenStart) / 1000);
    el.textContent = s > 0 ? `${s}s` : '';
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
}

function _showRegenPhase(phase) {
  document.getElementById('regen-processing').style.display = phase === 'processing' ? 'block' : 'none';
  document.getElementById('regen-error').style.display      = phase === 'error'      ? 'block' : 'none';
  document.getElementById('regen-confirm').style.display    = phase === 'confirm'    ? 'block' : 'none';
}

function _showRegenError(msg) {
  _showRegenPhase('error');
  document.getElementById('regen-error-msg').textContent = msg;
}

function _showRegenConfirm(draft) {
  _showRegenPhase('confirm');
  document.getElementById('regen-confirm-title').textContent   = draft.title   || '';
  document.getElementById('regen-confirm-excerpt').textContent = draft.excerpt || '';
  const imgs = document.getElementById('regen-confirm-imgs');
  imgs.innerHTML = '';
  const _cacheBust2 = Date.now();
  if (draft.imagePost)  imgs.innerHTML += `<img src="${draft.imagePost}?t=${_cacheBust2}"  alt="Post">`;
  if (draft.imageStory) imgs.innerHTML += `<img src="${draft.imageStory}?t=${_cacheBust2}" alt="Story">`;
  _renderDraftBanner(draft);
}

async function acceptRegen() {
  await publishDraft();
  closeRegenOverlay();
}

function closeRegenOverlay() {
  if (_regenInterval) { clearInterval(_regenInterval); _regenInterval = null; }
  document.getElementById('regen-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('regen-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeRegenOverlay();
});
</script>

renderAutoSection();
