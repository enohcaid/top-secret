<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- "Antes y después" v2 (motion design, pedido de Juan 2026-10-10: "se tiene que ver de otro nivel").
     Una sola línea de tiempo continua: mostrar(0, t) dibuja el cuadro del segundo t (determinístico: mismo t, mismo
     cuadro), así el render a 60 fps + desenfoque de movimiento es exacto. Todo se sincroniza al pulso (D.bpm) y la
     revelación cae en D.revela (el drop del tema se alinea desde render.mjs con musicaDesde).
     Capas: cámara (temblor/zoom) › fondo con grano › número gigante en contorno (parallax) › jugador (efecto por
     época: VHS, digital, HD) › franjas de glitch › rayos, halo, onda, partículas › tipografía cinética. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#070605;--gold:#C9A84C;--gold2:#F1DC97;--text:#F4EFE0;--text2:rgba(244,239,224,.62)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text)}
#cam{position:absolute;inset:-60px;transform-origin:50% 55%}
.capa{position:absolute;inset:0}
#fondo{background:radial-gradient(80% 50% at 50% 45%,#1a1610 0%,var(--bg) 70%)}
#grano{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay}
#numero{position:absolute;left:50%;top:44%;font:400 1350px/.8 'Bebas Neue';color:transparent;-webkit-text-stroke:3px rgba(201,168,76,.22);white-space:nowrap;transform:translate(-50%,-50%)}
.jug{position:absolute;left:50%;bottom:330px;height:1180px;transform-origin:50% 100%;display:none}
.jug img{height:100%;display:block}
#franjas{position:absolute;inset:0;display:none}
#franjas div{position:absolute;left:0;right:0;overflow:hidden}
#franjas img{position:absolute;left:50%;height:1180px}
#vhs{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px);display:none}
#tint{position:absolute;inset:0;pointer-events:none}
#rayos{position:absolute;left:50%;top:44%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;background:repeating-conic-gradient(from 0deg,rgba(241,220,151,.16) 0deg 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 15%,transparent 68%);opacity:0}
#halo{position:absolute;left:50%;top:44%;width:1500px;height:1500px;margin:-750px 0 0 -750px;background:radial-gradient(closest-side,rgba(201,168,76,.55),rgba(201,168,76,.12) 50%,transparent 72%);opacity:0}
#onda{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:14px solid rgba(255,240,200,.9);opacity:0}
#brillo{position:absolute;bottom:330px;left:50%;height:1180px;display:none;transform-origin:50% 100%;-webkit-mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mix-blend-mode:screen}
#particulas{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FFF7E0;opacity:0;pointer-events:none}
#vineta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 60% at 50% 48%,transparent 55%,rgba(0,0,0,.75))}
.barra{position:absolute;left:0;right:0;height:0;background:#000;z-index:5}
#barra1{top:0} #barra2{bottom:0}
/* tipografía */
.txt{position:absolute;left:0;right:0;text-align:center;z-index:6;will-change:transform}
.palabra{display:inline-block;font:400 172px/.95 'Bebas Neue';letter-spacing:.01em;margin:0 .14em}
.oro{color:var(--gold)}
.brilla{background:linear-gradient(100deg,var(--gold) 0%,var(--gold) 40%,#FFF6D8 50%,var(--gold) 60%,var(--gold) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#etq{top:200px}
#etq b{display:block;font:400 150px/.9 'Bebas Neue'}
#etq span{display:inline-block;font:800 32px 'Barlow Condensed';letter-spacing:.34em;text-transform:uppercase;color:var(--text2);margin-top:12px}
#placa{bottom:120px}
#placa div{display:inline-block;padding:18px 34px;border:2px solid var(--gold);font:800 46px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;background:rgba(7,6,5,.6)}
#escudo{position:absolute;right:70px;top:70px;height:84px;z-index:6}
#pregunta{top:42%}
</style>
</head>
<body>
<div id="lienzo">
  <div id="cam">
    <div class="capa" id="fondo"></div>
    <canvas id="grano" width="540" height="1020"></canvas>
    <div id="rayos"></div><div id="halo"></div>
    <div id="numero"></div>
    <div id="jugs"></div>
    <div id="brillo"></div>
    <div id="franjas"></div>
    <div id="onda"></div>
    <canvas id="particulas" width="1200" height="2040"></canvas>
    <div id="vhs"></div><div id="tint"></div>
  </div>
  <div id="vineta"></div>
  <div class="barra" id="barra1"></div><div class="barra" id="barra2"></div>
  <div class="txt" id="gancho"></div>
  <div class="txt" id="etq"><b></b><span></span></div>
  <div class="txt" id="placa"><div></div></div>
  <div class="txt" id="pregunta"></div>
  <img id="escudo">
  <div id="flash"></div>
</div>
<script>
const $ = s => document.querySelector(s);
let D, B, T;   // datos, duración de un pulso, marcas de tiempo
const N_FRANJAS = 14;

function pintar(datos) {
  D = datos;
  B = 60 / (D.bpm || 130);
  // Línea de tiempo en pulsos, anclada a la revelación (D.revela, en segundos).
  const R = D.revela;
  T = { gancho: 0, v: [R - 10 * B, R - 7 * B, R - 5 * B], build: R - 3 * B, revela: R, placa: R + 2 * B, pregunta: R + 9 * B, fin: R + 11 * B };
  $('#gancho').innerHTML = D.gancho.map((w, i) => `${w.salto ? '<br>' : ''}<span class="palabra ${w.oro ? 'oro' : ''}" data-i="${i}">${w.t}</span>`).join('');
  $('#jugs').innerHTML = D.versiones.map((v, i) => `<div class="jug" id="j${i}"><img src="${v.img}"></div>`).join('');
  $('#franjas').innerHTML = Array.from({ length: N_FRANJAS }, (_, k) => `<div style="top:${k * 100 / N_FRANJAS}%;height:${100 / N_FRANJAS + .2}%"><img></div>`).join('');
  $('#escudo').src = D.escudo;
  $('#placa div').textContent = D.final;
  $('#pregunta').innerHTML = `<span class="palabra" style="font-size:120px">${D.pregunta}</span>`;
  const ult = D.versiones[D.versiones.length - 1].img;
  const br = $('#brillo');
  br.style.webkitMaskImage = `url("${ult}")`;
  return 1;
}

// ── utilidades ──
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eOut = p => 1 - Math.pow(1 - clamp(p), 3);
const eOutBack = p => { p = clamp(p); const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eIn = p => Math.pow(clamp(p), 3);
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // pseudoazar fijo
function grano(t) {
  const c = $('#grano'), g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
  let s = Math.floor(t * 24) * 9973 + 1;
  for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}
function particulas(t) {
  const c = $('#particulas'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const dt = t - T.revela;
  if (dt < 0) return;
  const cx = c.width / 2, cy = c.height * .44;
  // Explosión: 160 chispas que salen del centro con gravedad y se apagan.
  for (let k = 0; k < 160; k++) {
    const ang = rnd(k) * Math.PI * 2, vel = 700 + rnd(k + 500) * 1500, vida = 0.9 + rnd(k + 900) * 1.3;
    if (dt > vida) continue;
    const x = cx + Math.cos(ang) * vel * dt * (1 - dt / (vida * 2));
    const y = cy + Math.sin(ang) * vel * dt * (1 - dt / (vida * 2)) + 420 * dt * dt;
    const a = 1 - dt / vida, r = 2 + rnd(k + 77) * 5;
    g.fillStyle = `rgba(${241},${200 + rnd(k) * 40 | 0},${120 + rnd(k + 3) * 60 | 0},${a})`;
    g.beginPath(); g.ellipse(x, y, r * 2.4, r, ang, 0, Math.PI * 2); g.fill();
  }
  // Polvo dorado que flota durante todo el plano final.
  for (let k = 0; k < 70; k++) {
    const x = rnd(k + 2000) * c.width, base = rnd(k + 3000) * c.height;
    const y = (base - dt * (40 + rnd(k + 4000) * 80)) % c.height;
    const a = clamp(dt / 1.2) * (0.25 + 0.5 * rnd(k + 5000)) * (0.6 + 0.4 * Math.sin(dt * 2 + k));
    g.fillStyle = `rgba(241,220,151,${a})`;
    g.beginPath(); g.arc(x, (y + c.height) % c.height, 1.5 + rnd(k + 6000) * 2.5, 0, Math.PI * 2); g.fill();
  }
}
function franjas(src, fuerza, semilla) {
  const f = $('#franjas');
  if (fuerza <= 0) { f.style.display = 'none'; return; }
  f.style.display = 'block';
  [...f.children].forEach((d, k) => {
    const img = d.firstChild;
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    const off = (rnd(k * 13 + semilla) - .5) * 2 * fuerza * 260;
    img.style.transform = `translateX(calc(-50% + ${off}px))`;
    // la cámara mide 2040 de alto (lienzo + 60 por lado); el jugador arranca en 2040 - 330 - 1180 = 530
    img.style.top = `${-k * 2040 / N_FRANJAS + (2040 - 330 - 1180)}px`;
  });
}
function cromatico(el, px) {
  el.style.filter = px > 0.3 ? `drop-shadow(${px}px 0 0 rgba(255,40,60,.75)) drop-shadow(${-px}px 0 0 rgba(40,220,255,.75))` : 'none';
}

// ── cuadro del segundo t ──
function mostrar(n, t = 0) {
  grano(t);
  const jugs = [...document.querySelectorAll('.jug')];
  jugs.forEach(j => { j.style.display = 'none'; });
  let cam = { s: 1, x: 0, y: 0, r: 0 }, flash = 0, numero = '', numX = 0, vhs = false, tint = 'transparent';
  const beatIdx = Math.floor(t / B), enBeat = (t % B) / B;

  // 1) GANCHO: cada palabra entra de golpe (escala 3 → 1) con temblor de cámara.
  const palabras = [...document.querySelectorAll('#gancho .palabra')];
  const finGancho = T.v[0];
  $('#gancho').style.top = '640px';
  $('#gancho').style.display = t < finGancho ? 'block' : 'none';
  palabras.forEach((p, i) => {
    const t0 = 0.05 + i * B * 0.5, q = (t - t0) / 0.22;
    p.style.opacity = q < 0 ? 0 : 1;
    p.style.transform = `scale(${q < 0 ? 3 : 3 - 2 * eOut(q)})`;
    p.style.filter = q < 1 ? `blur(${(1 - clamp(q)) * 14}px)` : 'none';
    if (q >= 0 && q < 1.4) { const k = (1 - clamp(q / 1.4)) * 14; cam.x += (rnd(Math.floor(t * 60) + i) - .5) * k; cam.y += (rnd(Math.floor(t * 60) + i + 9) - .5) * k; }
  });
  if (t < finGancho) {
    const sal = (t - (finGancho - 0.12)) / 0.12;
    if (sal > 0) franjas(D.versiones[0].img, 0, 0);
    $('#gancho').style.transform = sal > 0 ? `scaleX(${1 + sal * .4})` : 'none';
    $('#gancho').style.opacity = sal > 0 ? 1 - sal : 1;
  }

  // 2) TEMPORADAS 1-3: un plano por época, cada uno con su transición y su textura.
  const etq = $('#etq');
  etq.style.display = 'none'; etq.style.top = '';
  for (let i = 0; i < 3; i++) {
    const t0 = T.v[i], t1 = i < 2 ? T.v[i + 1] : T.build;
    if (t < t0 || t >= t1) continue;
    const lt = t - t0, j = jugs[i];
    j.style.display = 'block';
    // entrada: golpe de escala + leve giro 3D
    const e = eOutBack(lt / 0.32);
    const lat = (1 - eOut(lt / 0.4)) * (i % 2 ? -1 : 1) * 240;
    j.style.transform = `translateX(calc(-50% + ${lat}px)) perspective(1400px) rotateY(${(1 - eOut(lt / 0.5)) * (i % 2 ? 18 : -18)}deg) scale(${0.86 + 0.14 * e + lt * 0.03})`;
    // textura de la época
    if (i === 0) { vhs = true; tint = 'rgba(70,40,10,.18)'; cromatico(j, 7 + Math.sin(t * 40) * 3); j.style.opacity = .92; }
    else if (i === 1) { tint = 'rgba(20,40,70,.12)'; cromatico(j, Math.max(0, 6 - lt * 20)); j.style.opacity = 1; }
    else { cromatico(j, Math.max(0, 4 - lt * 16)); j.style.opacity = 1; }
    // transición de entrada
    if (i === 0) franjas(D.versiones[0].img, Math.max(0, 1 - lt / 0.18), Math.floor(t * 30));
    else if (i === 1) franjas(D.versiones[1].img, Math.max(0, 1 - lt / 0.22), 7);
    else { franjas('', 0); cam.s *= 1 + Math.max(0, 0.25 - lt * 1.2); }
    if (lt < 0.06) flash = Math.max(flash, 0.35);
    numero = `T${i + 1}`; numX = (i % 2 ? 1 : -1) * (60 - lt * 120);
    etq.style.display = 'block';
    etq.querySelector('b').textContent = D.versiones[i].titulo;
    const sp = etq.querySelector('span'), ps = eOut((lt - 0.1) / 0.45);
    sp.textContent = D.versiones[i].sub;
    sp.style.opacity = ps; sp.style.letterSpacing = `${0.9 - 0.56 * ps}em`;
    etq.style.transform = `translateY(${(1 - eOut(lt / 0.3)) * -60}px)`;
    etq.style.opacity = eOut(lt / 0.2);
    etq.querySelector('b').style.color = '';
  }

  // 3) BUILD: estroboscopio que acelera entre las tres épocas + zoom de cámara antes del drop.
  if (t >= T.build && t < T.revela) {
    const lt = t - T.build, dur = T.revela - T.build, p = lt / dur;
    const periodo = 0.16 - 0.12 * p;                       // cada vez más rápido
    const k = Math.floor(lt / periodo) % 3;
    const negro = p > 0.9;                                  // un instante de negro antes del golpe
    if (!negro) {
      const j = jugs[k]; j.style.display = 'block';
      j.style.transform = `translateX(-50%) scale(${1 + p * 0.25})`;
      cromatico(j, 4 + p * 14); j.style.opacity = 1;
    }
    cam.s *= 1 + p * 0.12;
    cam.x += (rnd(Math.floor(t * 60)) - .5) * p * 26; cam.y += (rnd(Math.floor(t * 60) + 3) - .5) * p * 26;
    franjas(negro ? '' : D.versiones[k].img, p > 0.5 ? (p - 0.5) * 0.6 : 0, Math.floor(t * 60));
    numero = 'T4'; numX = 0;
    $('#rayos').style.opacity = p * 0.35;
  }

  // 4) REVELACIÓN: destello, onda, chispas, rayos que giran, barrido de luz sobre el jugador, título con brillo.
  const dt = t - T.revela, ult = jugs[jugs.length - 1], br = $('#brillo');
  if (dt >= 0) {
    ult.style.display = 'block'; cromatico(ult, Math.max(0, 12 - dt * 40)); ult.style.opacity = 1;
    const pulso = Math.pow(1 - ((dt % B) / B), 4) * 0.018;        // late con el pulso
    ult.style.transform = `translateX(-50%) scale(${1.26 - 0.18 * eOut(dt / 0.6) + dt * 0.008 + pulso})`;
    ult.querySelector('img').style.filter = 'drop-shadow(0 0 60px rgba(201,168,76,.5)) drop-shadow(0 40px 60px rgba(0,0,0,.8))';
    flash = Math.max(flash, 1 - dt / 0.35);
    cam.s *= 1 + Math.max(0, 0.1 - dt * 0.25);
    if (dt < 0.4) { const k = (1 - dt / 0.4) * 34; cam.x += (rnd(Math.floor(t * 60)) - .5) * k; cam.y += (rnd(Math.floor(t * 60) + 5) - .5) * k; }
    const o = $('#onda'); o.style.opacity = clamp(1 - dt / 0.7); o.style.transform = `scale(${1 + eOut(dt / 0.7) * 9})`; o.style.borderWidth = `${14 * (1 - clamp(dt / 0.7)) + 1}px`;
    $('#rayos').style.opacity = 0.9; $('#rayos').style.transform = `rotate(${dt * 12}deg) scale(${1 + Math.sin(dt * 2) * .03})`;
    $('#halo').style.opacity = 0.75 + pulso * 12; $('#halo').style.transform = `scale(${1 + pulso * 4})`;
    // barrido de luz (máscara con la silueta del jugador): cruza a los 0.5 s y vuelve a pasar cada 4 pulsos
    br.style.display = 'block';
    br.style.transform = ult.style.transform;
    br.style.width = ult.querySelector('img').offsetWidth + 'px';
    const fase = ((dt - 0.5) % (4 * B)) / 0.7;
    br.style.background = `linear-gradient(105deg,transparent ${fase * 140 - 40}%,rgba(255,240,200,.75) ${fase * 140 - 25}%,transparent ${fase * 140 - 10}%)`;
    numero = '';
    etq.style.display = 'block';
    etq.querySelector('b').textContent = D.versiones[D.versiones.length - 1].titulo;
    etq.querySelector('b').className = 'brilla';
    etq.querySelector('b').style.backgroundPosition = `${100 - ((dt * 40) % 200)}% 0`;
    const sp4 = etq.querySelector('span');
    sp4.textContent = D.versiones[D.versiones.length - 1].sub; sp4.style.opacity = eOut((dt - 0.3) / 0.4); sp4.style.letterSpacing = `${0.9 - 0.56 * eOut((dt - 0.3) / 0.5)}em`;
    etq.style.top = '96px';
    etq.style.transform = `scale(${1.4 - 0.4 * eOutBack(dt / 0.45)})`;
    etq.style.opacity = eOut(dt / 0.15);
    // barras de cine que entran
    const barra = eOut((dt - 0.2) / 0.6) * 150;
    $('#barra1').style.height = $('#barra2').style.height = barra + 'px';
  } else {
    br.style.display = 'none'; $('#onda').style.opacity = 0; $('#halo').style.opacity = 0;
    $('#barra1').style.height = $('#barra2').style.height = '0px';
    etq.querySelector('b').className = '';
  }
  particulas(t);

  // placa con el nombre y escudo
  const pl = $('#placa'), pp = (t - T.placa) / 0.4;
  pl.style.display = pp > 0 && t < T.pregunta ? 'block' : 'none';
  pl.style.transform = `translateY(${(1 - eOutBack(pp)) * 140}px)`; pl.style.opacity = eOut(pp);
  const es = $('#escudo'), pe = (t - T.placa - B) / 0.35;
  es.style.opacity = eOut(pe); es.style.transform = `scale(${pe < 0 ? 0 : 2 - eOutBack(pe)}) rotate(${(1 - eOut(pe)) * -25}deg)`;

  // 5) CIERRE: pregunta en pantalla con glitch y vuelta al negro del principio (loop).
  const pq = $('#pregunta'), pr = (t - T.pregunta) / 0.25;
  pq.style.display = pr > 0 ? 'block' : 'none';
  if (pr > 0) {
    pq.style.transform = `scale(${2 - eOut(pr)})`; pq.style.filter = pr < 1 ? `blur(${(1 - clamp(pr)) * 10}px)` : 'none';
    const fin = clamp((t - (T.fin - 0.35)) / 0.35);
    $('#lienzo').style.filter = fin > 0 ? `brightness(${1 - fin})` : 'none';
    etq.style.opacity = 1 - eOut(pr); pl.style.display = 'none';
    franjas(D.versiones[D.versiones.length - 1].img, pr < 0.6 ? 0.5 * (1 - pr / 0.6) : 0, Math.floor(t * 60));
  } else $('#lienzo').style.filter = 'none';

  // número gigante en contorno (parallax lento detrás del jugador)
  const nu = $('#numero'); nu.textContent = numero;
  nu.style.transform = `translate(calc(-50% + ${numX}px), -50%)`;

  $('#vhs').style.display = vhs ? 'block' : 'none';
  $('#tint').style.background = tint;
  $('#flash').style.opacity = clamp(flash);
  $('#cam').style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s}) rotate(${cam.r}deg)`;
}
</script>
</body>
</html>
