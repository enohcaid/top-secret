<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Resumen de varias noches de partidos (scripts/social/piezas/quincena-eg.mjs). Una sola línea de tiempo en dos
     formatos: pintar(D, 'story') = vertical 1080x1920 (Reel/TikTok/Short) y pintar(D, 'yt') = horizontal 1920x1080
     (video de YouTube). mostrar(0, t) dibuja el segundo t (determinístico; espera a que el cuadro esté decodificado).
     Tramos en D.tramos: gancho · jornada (separador de cada noche con sus resultados) · gol · repe · ia (foto nueva
     animada, rotulada como recreación) · tabla (posición + goleadores) · cierre (lo que viene + transmisiones).
     Mismo lenguaje que noche.html. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070605;--gold:#C9A84C;--gold2:#F1DC97;--text:#F4EFE0;--text2:rgba(244,239,224,.66);--rojo:#E5484D;--verde:#5BC88A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Barlow,sans-serif}
#lienzo.h{width:1920px;height:1080px}
.capa{position:absolute;inset:0;display:none}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fondoBlur{filter:blur(46px) brightness(.26) saturate(.55);transform:scale(1.25)}
#vignette{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%);pointer-events:none}
#grano{position:absolute;inset:0;width:100%;height:100%;opacity:.10;mix-blend-mode:overlay;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none}
#rayos{position:absolute;left:50%;top:50%;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(241,220,151,.16) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(closest-side,#000 10%,transparent 68%)}
.k{font:700 26px 'JetBrains Mono';letter-spacing:.24em;color:var(--gold)}
b.o,.oro{color:var(--gold)}

/* rótulo de sección */
#rotulo{position:absolute;left:60px;top:150px;display:flex;align-items:center;gap:16px;padding:16px 26px;border-radius:999px;
  font:700 26px 'JetBrains Mono';letter-spacing:.2em;z-index:20;white-space:nowrap;background:rgba(11,10,7,.82);border:2px solid rgba(201,168,76,.55)}
#rotulo i{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold)}
#rotulo.repe{background:var(--gold);color:#0B0A07;border-color:var(--gold)}
#rotulo.repe i{border-radius:4px;background:#0B0A07;box-shadow:none;width:16px;height:16px;transform:rotate(45deg)}
#rotulo.recre{background:rgba(255,246,216,.92);color:#0B0A07;border-color:transparent}
#rotulo.recre i{background:var(--gold);border-radius:3px;box-shadow:none}
/* en horizontal la tarjeta de la música ocupa arriba a la izquierda: el rótulo va abajo a la derecha */
.h #rotulo{top:auto;bottom:120px;left:auto;right:70px;font-size:22px;padding:12px 22px}

/* gancho y foto animada (ia) */
.clipIA{filter:contrast(1.05) saturate(1.05)}
#gancho .clipIA{filter:brightness(.42) saturate(.85)}
#gancho .k{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:30px;letter-spacing:.32em}
#gancho .big{position:absolute;left:0;right:0;top:550px;text-align:center;font:400 300px/1 'Bebas Neue';
  background:linear-gradient(100deg,var(--gold) 0%,var(--gold) 40%,#FFF6D8 50%,var(--gold) 60%,var(--gold) 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 20px 60px rgba(201,168,76,.35))}
#gancho .t{position:absolute;left:60px;right:60px;top:1130px;text-align:center;font:900 84px/1.04 Barlow;letter-spacing:-.01em}
.h #gancho .k{top:250px}
.h #gancho .big{top:320px;font-size:330px}
.h #gancho .t{top:640px;left:200px;right:200px;font-size:76px}
#ia .tono{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,5,.55) 0%,transparent 26%,transparent 55%,rgba(7,6,5,.94) 100%)}
#ia .marco{position:absolute;inset:26px;border:2px solid rgba(241,220,151,.4);border-radius:30px;pointer-events:none}
#ia .k{position:absolute;left:66px;top:1290px;font-size:28px;letter-spacing:.3em}
#ia .t{position:absolute;left:62px;right:62px;top:1340px;font:900 96px/1 Barlow;letter-spacing:-.02em}
.h #ia .tono{background:linear-gradient(90deg,rgba(7,6,5,.88) 0%,rgba(7,6,5,.35) 45%,transparent 70%),linear-gradient(0deg,rgba(7,6,5,.7) 0%,transparent 40%)}
.h #ia .k{left:90px;top:auto;bottom:330px}
.h #ia .t{left:86px;right:auto;width:1050px;top:auto;bottom:150px;font-size:96px}

/* jornada: separador de cada noche */
#jornada .bgIA{filter:brightness(.34) saturate(.7) blur(2px);transform:scale(1.06)}
#jornada .cab{position:absolute;left:60px;right:60px;top:300px}
#jornada .num{font:400 230px/.8 'Bebas Neue';color:var(--gold);letter-spacing:.01em}
#jornada .tit{font:900 92px/1 Barlow;letter-spacing:-.02em;margin-top:22px}
#jornada .filas{position:absolute;left:60px;right:60px;top:1010px;display:flex;flex-direction:column;gap:20px}
.fila{display:flex;align-items:center;gap:24px;padding:20px 28px;border-radius:24px;background:rgba(11,10,7,.82);border:2px solid rgba(201,168,76,.25)}
.fila img{width:96px;height:96px;object-fit:contain;flex:none}
.fila .n{flex:1;min-width:0;font:800 46px/1.05 Barlow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .n span{display:block;font:700 20px 'JetBrains Mono';letter-spacing:.2em;color:var(--text2);margin-bottom:6px}
.fila .m{font:400 100px/.8 'Bebas Neue'}
.fila .r{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 26px Barlow;color:#0B0A07}
.fila.V .r{background:var(--verde)}.fila.E .r{background:var(--gold2)}.fila.D .r{background:var(--rojo)}
.fila.V .m{color:var(--gold)}
.h #jornada .cab{left:110px;right:auto;width:760px;top:250px}
.h #jornada .num{font-size:250px}
.h #jornada .tit{font-size:80px}
.h #jornada .filas{left:auto;right:110px;width:860px;top:50%;transform:translateY(-50%)}

/* gol */
#cab{position:absolute;left:60px;right:60px;top:250px;display:flex;align-items:center;gap:24px}
#cab .esc{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
#cab .txt{flex:1;min-width:0}
#cab .k{font-size:24px;letter-spacing:.22em}
#cab .r{font:900 64px/1 Barlow;letter-spacing:-.01em;margin-top:8px;white-space:nowrap}
#chip{position:absolute;left:60px;top:410px;display:flex;align-items:stretch;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);font:400 78px/1 'Bebas Neue';transform-origin:left center}
#chip .eq{background:#F2EEE0;color:#0B0A07;padding:14px 26px}
#chip .gl{background:#0B0A07;color:var(--text);padding:14px 24px;min-width:80px;text-align:center}
#chip .gl.top{color:var(--gold2)}
#chip .min{background:#17140d;color:var(--gold);padding:14px 24px;font-size:64px;display:flex;align-items:center}
#banda{position:absolute;left:0;right:0;top:570px;height:840px;overflow:hidden;box-shadow:0 0 0 3px rgba(201,168,76,.45),0 40px 120px rgba(0,0,0,.8)}
#banda img{position:absolute;top:0;height:100%;width:auto}
#banda .tag{position:absolute;right:28px;top:24px;font:700 22px 'JetBrains Mono';letter-spacing:.25em;color:var(--gold);
  padding:8px 14px;border:2px solid var(--gold);border-radius:10px;background:rgba(0,0,0,.5)}
#ficha{position:absolute;left:60px;right:60px;top:1440px;height:290px;display:flex;align-items:flex-end;gap:30px}
#ficha .foto{width:240px;height:290px;overflow:hidden;flex:none;border-radius:24px;border:2px solid rgba(201,168,76,.45);box-shadow:0 20px 60px rgba(0,0,0,.6);background:#14110b}
#ficha .foto img{width:100%;height:auto;display:block}
#ficha .datos{padding-bottom:26px;min-width:0}
#ficha .k{font-size:24px}
#ficha .gt{font:900 76px/1 Barlow;letter-spacing:-.02em;margin-top:10px;white-space:nowrap}
#ficha .como{font:800 44px/1.1 Barlow;color:var(--gold2);margin-top:10px}
/* horizontal: la jugada a pantalla completa, los datos encima */
.h #banda{top:0;height:1080px;box-shadow:none}
.h #banda::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,5,.75) 0%,transparent 30%,transparent 62%,rgba(7,6,5,.85) 100%)}
.h #banda .tag{top:auto;bottom:40px;right:60px;z-index:2}
.h #cab{left:70px;right:auto;top:210px;gap:20px}
.h #cab .esc{width:96px;height:96px}
.h #cab .r{font-size:54px}
.h #chip{left:auto;right:70px;top:120px;font-size:68px}
.h #chip .min{font-size:56px}
.h #ficha{left:70px;right:auto;top:auto;bottom:150px;height:250px;gap:26px}
.h #ficha .foto{width:200px;height:250px}
.h #ficha .gt{font-size:68px}
.h #ficha .como{font-size:38px}

/* tabla */
#tabla .izq{position:absolute;left:60px;right:60px;top:290px}
#tabla .pos{display:flex;align-items:flex-end;gap:30px;margin-top:16px}
#tabla .pos .p{font:400 300px/.78 'Bebas Neue';color:var(--gold)}
#tabla .pos .pt{font:900 64px/1 Barlow;padding-bottom:20px}
#tabla .pos .pt span{display:block;font:700 22px 'JetBrains Mono';letter-spacing:.2em;color:var(--text2);margin-top:10px}
#tabla .rec{display:flex;gap:16px;margin-top:34px}
#tabla .rec div{flex:1;padding:18px 0;border-radius:18px;background:rgba(11,10,7,.82);border:2px solid rgba(201,168,76,.25);text-align:center;font:400 72px/1 'Bebas Neue'}
#tabla .rec div span{display:block;font:700 18px 'JetBrains Mono';letter-spacing:.18em;color:var(--text2);margin-top:6px}
#tabla .gols{position:absolute;left:60px;right:60px;top:1060px}
#tabla .gol{display:flex;align-items:center;gap:22px;padding:14px 0;border-top:1px solid rgba(201,168,76,.2)}
#tabla .gol img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid rgba(201,168,76,.5);background:#14110b;flex:none}
#tabla .gol .g{flex:1;font:800 46px Barlow;white-space:nowrap}
#tabla .gol .c{font:400 84px/.8 'Bebas Neue';color:var(--gold)}
.h #tabla .izq{left:110px;right:auto;width:760px;top:270px}
.h #tabla .gols{left:auto;right:110px;width:820px;top:270px}

/* cierre */
#cierre .bgIA{filter:brightness(.38) saturate(.8)}
#cierre .cab{position:absolute;left:60px;right:60px;top:290px}
#cierre .tit{font:900 92px/1 Barlow;letter-spacing:-.02em;margin-top:16px}
#cierre .filas{position:absolute;left:60px;right:60px;top:640px;display:flex;flex-direction:column;gap:20px}
#cierre .fila .hora{font:400 76px/.8 'Bebas Neue';color:var(--gold)}
#cierre .cta{position:absolute;left:60px;right:60px;top:1100px;text-align:center}
#cierre .cta .t{font:900 66px/1 Barlow;letter-spacing:-.01em}
#plats{display:flex;justify-content:center;gap:22px;margin-top:30px}
#plats div{width:200px;padding:22px 0;border-radius:24px;background:rgba(20,18,13,.9);border:2px solid rgba(201,168,76,.3);display:flex;flex-direction:column;align-items:center;gap:12px;
  font:400 34px/1 'Bebas Neue';letter-spacing:.06em}
#plats svg{width:70px;height:70px}
#cierre .marca{position:absolute;left:0;right:0;top:1520px;text-align:center}
#cierre .marca img{width:150px;height:auto;display:block;margin:0 auto 18px}
#cierre .marca span{font:700 26px 'JetBrains Mono';letter-spacing:.3em;color:var(--gold)}
.h #cierre .cab{left:110px;right:auto;width:820px;top:220px}
.h #cierre .filas{left:110px;right:auto;width:820px;top:470px}
.h #cierre .cta{left:auto;right:110px;width:860px;top:300px}
.h #plats{flex-wrap:wrap;gap:20px}
.h #cierre .marca{left:auto;right:110px;width:860px;top:720px}

/* subtítulos de la voz */
#subs{position:absolute;left:70px;right:70px;top:1745px;text-align:center;font:800 44px/1.15 Barlow;z-index:22;text-shadow:0 4px 18px rgba(0,0,0,.9)}
#subs .w{opacity:.35}#subs .w.on{opacity:1}#subs .w.oro{color:var(--gold2)}
.h #subs{top:auto;bottom:54px;left:300px;right:300px;font-size:40px}
</style>
</head>
<body>
<div id="lienzo">
  <img id="fondoBlur" class="full" alt="">
  <div id="rayos"></div>

  <div id="gancho" class="capa"><img class="full clipIA" alt=""><div class="k" id="gK"></div><div class="big" id="gBig"></div><div class="t" id="gT"></div></div>

  <div id="ia" class="capa"><img class="full clipIA" alt=""><div class="tono"></div><div class="marco"></div><div class="k" id="iaK"></div><div class="t" id="iaT"></div></div>

  <div id="jornada" class="capa"><img class="full bgIA" alt="">
    <div class="cab"><div class="k" id="jK"></div><div class="num" id="jNum"></div><div class="tit" id="jTit"></div></div>
    <div class="filas" id="jFilas"></div>
  </div>

  <div id="gol" class="capa">
    <div id="banda"><img id="bandaImg" alt=""><div class="tag" id="bandaTag"></div></div>
    <div id="cab"><img class="esc" id="cabEsc" alt=""><div class="txt"><div class="k" id="cabK"></div><div class="r" id="cabR"></div></div></div>
    <div id="chip"><div class="eq">TOP</div><div class="gl top" id="chTop">0</div><div class="gl" id="chRiv">0</div><div class="eq" id="chSig">RIV</div><div class="min" id="chMin"></div></div>
    <div id="ficha"><div class="foto"><img id="fichaFoto" alt=""></div><div class="datos"><div class="k" id="fichaK">GOL DE TOP SECRET</div><div class="gt" id="fichaGt"></div><div class="como" id="fichaComo"></div></div></div>
  </div>

  <div id="tabla" class="capa">
    <div class="izq"><div class="k" id="tK"></div><div class="pos"><div class="p" id="tPos"></div><div class="pt" id="tPts"></div></div><div class="rec" id="tRec"></div></div>
    <div class="gols"><div class="k" id="tGK">GOLEADORES</div><div id="tGols"></div></div>
  </div>

  <div id="cierre" class="capa"><img class="full bgIA" alt="">
    <div class="cab"><div class="k" id="ciK"></div><div class="tit" id="ciTit"></div></div>
    <div class="filas" id="ciFilas"></div>
    <div class="cta"><div class="t">Todos los partidos, <b class="o">en vivo</b></div><div id="plats"></div></div>
    <div class="marca"><img id="ciEsc" alt=""><span>#TOPSECRETFC</span></div>
  </div>

  <div id="vignette"></div>
  <canvas id="grano" width="540" height="960"></canvas>
  <div id="flash"></div>
  <div id="rotulo"><i></i><span></span></div>
  <div id="subs"></div>
</div>
<script>
const ICON = {
  twitch: { n: 'TWITCH', p: '<path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>' },
  kick: { n: 'KICK', p: '<path fill="#53FC18" d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/>' },
  youtube: { n: 'YOUTUBE', p: '<path fill="#FF0033" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>' },
  instagram: { n: 'INSTAGRAM', p: '<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58529"/><stop offset=".5" stop-color="#dd2a7b"/><stop offset="1" stop-color="#515bd4"/></linearGradient></defs><path fill="url(#ig)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>' },
};
const $ = s => document.querySelector(s);
let D, H = false, W = 1080;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => (x = cl(x)) < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// clip = { dir, n, fps? } (cuadros JPG numerados) o { imagen } (foto fija)
const cuadroDe = (clip, lt, fps) => clip.imagen || `${clip.dir}/${String(cl(Math.floor(lt * (fps || clip.fps || 30)) + 1, 1, clip.n)).padStart(4, '0')}.jpg`;
async function poner(img, src) { if (img.getAttribute('src') !== src) { img.src = src; try { await img.decode(); } catch {} } }
function mostrarCapa(id) { for (const c of document.querySelectorAll('.capa')) c.style.display = c.id === id ? 'block' : 'none'; }
function rotulo(clase, texto) { const r = $('#rotulo'); r.style.display = texto ? 'flex' : 'none'; r.className = clase || ''; r.querySelector('span').textContent = texto || ''; }
const filaHtml = f => `<div class="fila ${f.res || ''}"><img src="${f.escudo}" alt=""><div class="n"><span>${f.etiqueta}</span>${f.rival}</div>${f.hora ? `<div class="hora">${f.hora}</div>` : `<div class="m">${f.marcador}</div><div class="r">${f.res}</div>`}</div>`;

function pintar(datos, formato) {
  D = datos; H = formato === 'yt'; W = H ? 1920 : 1080;
  $('#lienzo').className = H ? 'h' : '';
  $('#plats').innerHTML = ['twitch', 'kick', 'youtube', 'instagram'].map(k => `<div><svg viewBox="0 0 24 24">${ICON[k].p}</svg>${ICON[k].n}</div>`).join('');
  $('#ciEsc').src = D.escudo;
  const g = $('#grano').getContext('2d'), im = g.createImageData(540, 960); let s = 7;
  for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s % 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  return 1;
}

function subs(t) {
  const f = (D.voz || []).find(v => t >= v.en - 0.05 && t <= v.en + v.dur + 0.4);
  const el = $('#subs');
  if (!f) { el.innerHTML = ''; return; }
  el.innerHTML = f.palabras.map(w => `<span class="w${t - f.en >= w.t ? ' on' : ''}${new RegExp(D.oro || '^$', 'i').test(w.w) ? ' oro' : ''}">${w.w}</span>`).join(' ');
}
const entrar = (el, q, dy = 40) => { el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * dy}px)`; };

// Gol: en vertical, banda de 840 px con paneo hacia el arco (foco 0..1); en horizontal, la jugada a pantalla completa
// con un acercamiento al arco. Marcador que cambia en golEn (segundos del tramo); ficha del goleador que entra con el gol.
async function tramoGol(tr, lt, cadencia) {
  mostrarCapa('gol');
  const src = cuadroDe(tr.clip, lt + (tr.desdeClip || 0), cadencia);
  await Promise.all([poner($('#bandaImg'), src), poner($('#fondoBlur'), src)]);
  const dg = lt - tr.golEn;
  $('#cabEsc').src = tr.escudo; $('#cabK').textContent = tr.kicker; $('#cabR').textContent = `vs ${tr.rival}`;
  $('#chSig').textContent = tr.sigla; $('#chMin').textContent = tr.minuto;
  const [a, b] = (dg >= 0 ? tr.despues : tr.antes).split('-');
  $('#chTop').textContent = a; $('#chRiv').textContent = b;
  $('#chip').style.transform = `scale(${dg >= 0 ? 1 + .14 * Math.exp(-dg * 4) : 1})`;
  const ent = eo(lt * 3); $('#cab').style.opacity = ent; $('#chip').style.opacity = ent;
  const img = $('#bandaImg');
  if (H) {
    img.style.left = '0px'; img.style.width = '1920px'; img.style.height = '1080px';
    const zoom = 1.02 + .14 * eio((lt - tr.golEn + 1.8) / 2.4);
    img.style.transformOrigin = `${tr.foco * 100}% 45%`; img.style.transform = `scale(${zoom})`;
  } else {
    const anchoV = 840 * 16 / 9;
    img.style.width = 'auto'; img.style.height = '100%';
    const c = .5 + (tr.foco - .5) * eio(lt / (tr.golEn + .4));
    img.style.left = `${cl(540 - anchoV * c, 1080 - anchoV, 0)}px`;
    img.style.transformOrigin = `${c * 100}% 50%`; img.style.transform = `scale(${1 + .16 * eio((lt - tr.golEn + 1.6) / 2.2)})`;
  }
  $('#bandaTag').textContent = tr.tag || ''; $('#bandaTag').style.display = tr.tag ? 'block' : 'none';
  $('#fichaK').textContent = tr.etiqueta || 'GOL DE TOP SECRET'; $('#fichaFoto').src = tr.foto; $('#fichaGt').textContent = tr.goleador; $('#fichaComo').textContent = tr.como;
  const q = eo((dg + .1) * 2.4); $('#ficha').style.opacity = q; $('#ficha').style.transform = `translateY(${(1 - q) * 60}px)`;
  if (dg >= 0 && !tr.lento) { $('#flash').style.opacity = .8 * Math.exp(-dg * 6); $('#rayos').style.opacity = .8 * Math.exp(-dg * 1.2); $('#rayos').style.transform = `rotate(${dg * 20}deg)`; }
  if (lt < .3) { $('#flash').style.background = '#C9A84C'; $('#flash').style.opacity = .9 * (1 - lt / .3); } else $('#flash').style.background = '#fff';
}

async function mostrar(n, t = 0) {
  $('#flash').style.opacity = 0; $('#flash').style.background = '#fff'; $('#rayos').style.opacity = 0; $('#fondoBlur').style.display = 'block';
  const tr = D.tramos.find(x => t >= x.desde && t < x.hasta) || D.tramos[D.tramos.length - 1];
  const lt = t - tr.desde, dur = tr.hasta - tr.desde, p = lt / dur;
  if (tr.tipo === 'gancho') {
    mostrarCapa('gancho'); rotulo(null); $('#fondoBlur').style.display = 'none';
    const im = $('#gancho .clipIA'); await poner(im, cuadroDe(tr.clip, lt)); im.style.transform = `scale(${1.04 + .06 * p})`;
    $('#gK').textContent = tr.kicker; $('#gBig').innerHTML = tr.grande; $('#gT').innerHTML = tr.texto;
    const m = $('#gBig'); m.style.transform = `scale(${1.45 - .45 * eo(p * 2.4)})`; m.style.opacity = eo(p * 3); m.style.backgroundPosition = `${100 - p * 300}% 0`;
    $('#gK').style.opacity = eo((p - .08) * 4);
    entrar($('#gT'), eo((p - .32) * 4));
  } else if (tr.tipo === 'ia') {
    mostrarCapa('ia'); rotulo('recre', tr.rotulo || 'RECREACIÓN'); $('#fondoBlur').style.display = 'none';
    const im = $('#ia .clipIA'); await poner(im, cuadroDe(tr.clip, lt));
    im.style.transformOrigin = tr.origen || '50% 50%'; im.style.transform = `scale(${1.02 + (tr.zoom ?? .08) * eio(p)})`;
    $('#iaK').textContent = tr.kicker || ''; $('#iaT').innerHTML = tr.texto || '';
    entrar($('#iaK'), eo((lt - .2) * 3), 20); entrar($('#iaT'), eo((lt - .35) * 2.5));
    if (lt < .3) $('#flash').style.opacity = .6 * (1 - lt / .3);
  } else if (tr.tipo === 'jornada') {
    mostrarCapa('jornada'); rotulo(null); $('#fondoBlur').style.display = 'none';
    const im = $('#jornada .bgIA'); await poner(im, cuadroDe(tr.clip, tr.cuadro ?? lt)); im.style.transform = `scale(${1.06 + .05 * p})`;
    $('#jK').textContent = tr.kicker; $('#jNum').textContent = tr.numero; $('#jTit').innerHTML = tr.titulo;
    if ($('#jFilas').dataset.id !== tr.desde + '') { $('#jFilas').innerHTML = tr.filas.map(filaHtml).join(''); $('#jFilas').dataset.id = tr.desde; }
    entrar($('#jornada .cab'), eo(lt * 3), 30);
    $('#jNum').style.transform = `scale(${1.25 - .25 * eo(lt * 2.5)})`; $('#jNum').style.transformOrigin = 'left bottom';
    [...document.querySelectorAll('#jFilas .fila')].forEach((f, k) => { const q = eo((lt - .45 - k * .3) * 3); f.style.opacity = q; f.style.transform = `translateX(${(1 - q) * 70}px)`; });
    if (lt < .25) { $('#flash').style.background = '#C9A84C'; $('#flash').style.opacity = .7 * (1 - lt / .25); }
  } else if (tr.tipo === 'gol') {
    rotulo(tr.rotuloClase || null, tr.rotulo || '');
    await tramoGol(tr, lt);
  } else if (tr.tipo === 'repe') {
    rotulo('repe', 'REPETICIÓN');
    await tramoGol({ ...tr, lento: true }, lt * (tr.velocidad || .5), 60);   // cuadros a 60 fps: tiempo del clip = lt × velocidad
  } else if (tr.tipo === 'tabla') {
    mostrarCapa('tabla'); rotulo(null);
    await poner($('#fondoBlur'), cuadroDe(tr.clip, tr.cuadro || 0));
    $('#tK').textContent = tr.kicker; $('#tPos').textContent = tr.posicion; $('#tPts').innerHTML = tr.puntos;
    if ($('#tRec').dataset.ok !== '1') {
      $('#tRec').innerHTML = tr.record.map(r => `<div>${r.n}<span>${r.t}</span></div>`).join(''); $('#tRec').dataset.ok = '1';
      $('#tGols').innerHTML = tr.goleadores.map(g => `<div class="gol"><img src="${g.foto}" alt=""><div class="g">${g.gt}</div><div class="c">${g.goles}</div></div>`).join('');
    }
    entrar($('#tabla .izq'), eo(lt * 3), 30);
    $('#tPos').style.transform = `scale(${1.3 - .3 * eo(lt * 2.5)})`; $('#tPos').style.transformOrigin = 'left bottom';
    [...document.querySelectorAll('#tRec div')].forEach((d, k) => entrar(d, eo((lt - .5 - k * .15) * 3), 30));
    entrar($('#tGK'), eo((lt - 1.2) * 3), 20);
    [...document.querySelectorAll('#tGols .gol')].forEach((d, k) => { const q = eo((lt - 1.4 - k * .3) * 3); d.style.opacity = q; d.style.transform = `translateX(${(1 - q) * 60}px)`; });
    $('#rayos').style.opacity = .18; $('#rayos').style.transform = `rotate(${t * 5}deg)`;
  } else {
    mostrarCapa('cierre'); rotulo(null); $('#fondoBlur').style.display = 'none';
    const im = $('#cierre .bgIA'); await poner(im, cuadroDe(tr.clip, lt)); im.style.transform = `scale(${1.04 + .05 * p})`;
    $('#ciK').textContent = tr.kicker; $('#ciTit').innerHTML = tr.titulo;
    if ($('#ciFilas').dataset.ok !== '1') { $('#ciFilas').innerHTML = tr.filas.map(filaHtml).join(''); $('#ciFilas').dataset.ok = '1'; }
    entrar($('#cierre .cab'), eo(lt * 3), 30);
    [...document.querySelectorAll('#ciFilas .fila')].forEach((f, k) => { const q = eo((lt - .5 - k * .35) * 3); f.style.opacity = q; f.style.transform = `translateX(${(1 - q) * -50}px)`; });
    const c = $('#cierre .cta'); entrar(c, eo((lt - 1.8) * 2.5));
    [...document.querySelectorAll('#plats div')].forEach((d, k) => entrar(d, eo((lt - 2.2 - k * .2) * 3), 30));
    entrar($('#cierre .marca'), eo((lt - 3.2) * 3), 20);
  }
  subs(t);
}
</script>
