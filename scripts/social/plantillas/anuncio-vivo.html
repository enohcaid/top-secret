<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Anuncio de las nuevas transmisiones (2026-10-15): pieza vertical con metraje REAL de la transmisión nueva (salida de
     OBS + overlay, scripts/stream/) y motion design encima, sobre el piso de calidad de antes-despues.html.
     Una línea de tiempo continua: mostrar(0, t) dibuja el cuadro del segundo t (determinístico) → render a 60 fps con
     desenfoque. Todo anclado al pulso (D.bpm) y a los dos drops del tema (D.drop1, D.drop2).
     El metraje llega como secuencias de cuadros (D.clips[k] = { dir, n }), igual que los clips de Canva en las otras
     plantillas. Subtítulos palabra por palabra con los tiempos de la voz (D.voz = [{ en, palabras: [{ t, d, w }] }]). -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070605;--gold:#C9A84C;--gold2:#F1DC97;--text:#F4EFE0;--text2:rgba(244,239,224,.62);--rojo:#E5484D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text)}
#cam{position:absolute;inset:-60px;transform-origin:50% 50%}
#fondo{position:absolute;inset:0;background:radial-gradient(80% 45% at 50% 42%,#1d1810 0%,var(--bg) 72%)}
#grano{position:absolute;inset:0;width:100%;height:100%;opacity:.12;mix-blend-mode:overlay}
#numero{position:absolute;left:50%;top:47%;font:400 900px/.8 'Bebas Neue';color:transparent;-webkit-text-stroke:3px rgba(201,168,76,.18);white-space:nowrap;transform:translate(-50%,-50%)}
#rayos{position:absolute;left:50%;top:46%;width:2800px;height:2800px;margin:-1400px 0 0 -1400px;background:repeating-conic-gradient(from 0deg,rgba(241,220,151,.15) 0deg 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 15%,transparent 68%);opacity:0}
#halo{position:absolute;left:50%;top:46%;width:1500px;height:1500px;margin:-750px 0 0 -750px;background:radial-gradient(closest-side,rgba(201,168,76,.5),rgba(201,168,76,.1) 50%,transparent 72%);opacity:0}
#onda{position:absolute;left:50%;top:46%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:14px solid rgba(255,240,200,.9);opacity:0}
#particulas{position:absolute;inset:0;width:100%;height:100%}
/* metraje horizontal: pantalla flotante 16:9 */
#pantalla{position:absolute;left:50%;top:1000px;width:1000px;height:562px;margin:-281px 0 0 -500px;border-radius:18px;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.55);display:none;transform-origin:50% 50%}
#pantalla .vid{position:absolute;inset:0;transform-origin:20% 88%}
#pantalla img.cuadro{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.franjas{position:absolute;inset:0;display:none}
.franjas div{position:absolute;left:0;right:0;overflow:hidden}
.franjas img{position:absolute;left:0;width:100%}
/* metraje vertical: marco alto y celular */
#alto{position:absolute;left:50%;top:1080px;width:720px;height:1280px;margin:-640px 0 0 -360px;border-radius:30px;overflow:hidden;display:none;
  box-shadow:0 40px 120px rgba(0,0,0,.85),0 0 0 2px rgba(201,168,76,.55)}
#alto img{position:absolute;inset:0;width:100%;height:100%}
#celu{position:absolute;left:50%;top:1100px;width:600px;height:1200px;margin:-600px 0 0 -300px;border-radius:78px;padding:20px;display:none;
  background:linear-gradient(160deg,#2a2620,#0d0b08);box-shadow:0 0 0 3px #3a342a,0 50px 140px rgba(0,0,0,.9)}
#celu .pant{position:relative;width:100%;height:100%;border-radius:60px;overflow:hidden;background:#000}
#celu .pant img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#celu .isla{position:absolute;left:50%;top:22px;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#000;z-index:2}
#celu .anillo{position:absolute;inset:-14px;border-radius:92px;background:conic-gradient(from 0deg,#f58529,#dd2a7b,#8134af,#515bd4,#f58529);z-index:-1;filter:blur(18px);opacity:.65}
/* plataformas */
#plat{position:absolute;left:0;right:0;top:640px;display:none}
.pl{position:absolute;width:420px;height:300px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(180deg,rgba(28,24,17,.92),rgba(10,9,7,.92));border:2px solid rgba(201,168,76,.35)}
.pl svg{width:120px;height:120px}
.pl b{font:400 66px/1 'Bebas Neue';letter-spacing:.04em}
/* tipografía */
.txt{position:absolute;left:0;right:0;text-align:center;z-index:6}
.palabra{display:inline-block;font:400 168px/.92 'Bebas Neue';letter-spacing:.01em;margin:0 .12em}
.oro{color:var(--gold)}
.brilla{background:linear-gradient(100deg,var(--gold) 0%,var(--gold) 40%,#FFF6D8 50%,var(--gold) 60%,var(--gold) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#gancho{top:600px}
#cab{top:150px}
#cab .k{display:inline-block;font:700 30px 'JetBrains Mono';letter-spacing:.3em;color:var(--gold);margin-bottom:14px}
#cab .t{font:400 150px/.9 'Bebas Neue'}
#cab .t span{display:inline-block}
#vivo{display:inline-flex;align-items:center;gap:14px;font:700 30px 'JetBrains Mono';letter-spacing:.3em}
#vivo i{width:22px;height:22px;border-radius:50%;background:var(--rojo);box-shadow:0 0 24px var(--rojo)}
#mismo{top:1420px}
/* cierre */
#escudo{position:absolute;left:50%;top:560px;width:520px;margin-left:-260px;display:none;z-index:6;filter:drop-shadow(0 0 60px rgba(201,168,76,.45)) drop-shadow(0 40px 60px rgba(0,0,0,.8))}
#barrido{position:absolute;left:50%;top:560px;width:520px;height:520px;margin-left:-260px;display:none;z-index:7;-webkit-mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mix-blend-mode:screen}
#t4{top:1110px}
#t4 b{display:block;font:400 230px/.85 'Bebas Neue'}
#fecha{top:1360px}
#fecha div{display:inline-block;padding:20px 40px;border:2px solid var(--gold);font:800 50px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;background:rgba(7,6,5,.6)}
#canales{top:1530px;display:flex;justify-content:center;gap:34px}
#canales div{display:flex;flex-direction:column;align-items:center;gap:10px;font:700 22px 'JetBrains Mono';letter-spacing:.06em;color:var(--text2)}
#canales svg{width:64px;height:64px}
/* subtítulos */
#subs{position:absolute;left:70px;right:70px;top:1700px;text-align:center;z-index:8;font:800 54px/1.12 'Barlow Condensed';text-transform:uppercase;letter-spacing:.01em;
  text-shadow:0 4px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9)}
#subs span{opacity:.25;transition:none}
#subs span.on{opacity:1}
#subs span.ya{opacity:1;color:var(--text)}
#subs span.on{color:var(--gold2)}
#vineta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(75% 60% at 50% 48%,transparent 55%,rgba(0,0,0,.72))}
#tinte{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;background:#FFF7E0;opacity:0;pointer-events:none}
#negro{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="lienzo">
  <div id="cam">
    <div id="fondo"></div>
    <canvas id="grano" width="540" height="1020"></canvas>
    <div id="rayos"></div><div id="halo"></div>
    <div id="numero"></div>
    <div id="plat"></div>
    <div id="pantalla"><div class="vid"><img class="cuadro"><div class="franjas"></div></div></div>
    <div id="alto"><img></div>
    <div id="celu"><div class="anillo"></div><div class="pant"><img></div><div class="isla"></div></div>
    <div id="onda"></div>
    <img id="escudo"><div id="barrido"></div>
    <canvas id="particulas" width="1200" height="2040"></canvas>
  </div>
  <div id="tinte"></div>
  <div id="vineta"></div>
  <div class="txt" id="gancho"></div>
  <div class="txt" id="cab"><div class="k"></div><div class="t"></div></div>
  <div class="txt" id="mismo"></div>
  <div class="txt" id="t4"><b></b></div>
  <div class="txt" id="fecha"><div></div></div>
  <div id="canales" class="txt"></div>
  <div id="subs"></div>
  <div id="flash"></div>
  <div id="negro"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eOut = p => 1 - Math.pow(1 - clamp(p), 3);
const eOutBack = p => { p = clamp(p); const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const eInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const ICON = {
  twitch: { c: '#9146FF', n: 'TWITCH', p: '<path fill="#9146FF" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>', h: 'twitch.tv/topsecretfc' },
  kick: { c: '#53FC18', n: 'KICK', p: '<path fill="#53FC18" d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/>', h: 'kick.com/topsecretfc' },
  youtube: { c: '#FF0033', n: 'YOUTUBE', p: '<path fill="#FF0033" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>', h: '@TOPSecretFC' },
  instagram: { c: '#E1306C', n: 'INSTAGRAM', p: '<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58529"/><stop offset=".5" stop-color="#dd2a7b"/><stop offset="1" stop-color="#515bd4"/></linearGradient></defs><path fill="url(#ig)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>', h: '@fctopsecret' },
};
const ORDEN = ['twitch', 'kick', 'youtube', 'instagram'];
let D, B, BAR, T;
const N_FR = 12;

function pintar(datos) {
  D = datos; B = 60 / D.bpm; BAR = 4 * B;
  const d1 = D.drop1, d2 = D.drop2;
  // Línea de tiempo (segundos del video), anclada a los dos drops del tema
  T = { titulo: d1 - 2 * BAR + 0.0, build: d1 - 1.05 * BAR, plat: d1, gol: d1 + 3 * BAR, contra: d1 + 6 * BAR, final: d1 + 9 * BAR,
    pausa: d1 + 12 * BAR, ig: d2 - 2 * BAR, cierre: d2, fin: D.fin };
  $('#plat').innerHTML = ORDEN.map((k, i) => `<div class="pl" data-k="${k}" style="left:${i % 2 ? 560 : 100}px;top:${i < 2 ? 0 : 340}px"><svg viewBox="0 0 24 24">${ICON[k].p}</svg><b>${ICON[k].n}</b></div>`).join('');
  $('#canales').innerHTML = ORDEN.map(k => `<div><svg viewBox="0 0 24 24">${ICON[k].p}</svg>${ICON[k].h}</div>`).join('');
  $('#pantalla .franjas').innerHTML = Array.from({ length: N_FR }, (_, k) => `<div style="top:${k * 100 / N_FR}%;height:${100 / N_FR + .3}%"><img></div>`).join('');
  $('#escudo').src = D.escudo;
  $('#barrido').style.webkitMaskImage = `url("${D.escudo}")`;
  return 1;
}

function grano(t) {
  const c = $('#grano'), g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
  let s = Math.floor(t * 24) * 9973 + 1;
  for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s & 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}
// Chispas: estallidos en los momentos clave (centro en x,y del lienzo de la cámara) + polvo dorado en el cierre
function particulas(t, estallidos, polvo) {
  const c = $('#particulas'), g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  for (const [t0, cx, cy, color, n] of estallidos) {
    const dt = t - t0; if (dt < 0 || dt > 2.4) continue;
    for (let k = 0; k < n; k++) {
      const ang = rnd(k + t0 * 7) * Math.PI * 2, vel = 600 + rnd(k + 500 + t0) * 1400, vida = 0.8 + rnd(k + 900) * 1.2;
      if (dt > vida) continue;
      const x = cx + Math.cos(ang) * vel * dt * (1 - dt / (vida * 2)), y = cy + Math.sin(ang) * vel * dt * (1 - dt / (vida * 2)) + 420 * dt * dt;
      const a = 1 - dt / vida, r = 2 + rnd(k + 77) * 5;
      g.fillStyle = color.replace('A', a.toFixed(3));
      g.beginPath(); g.ellipse(x, y, r * 2.4, r, ang, 0, Math.PI * 2); g.fill();
    }
  }
  if (polvo > 0) for (let k = 0; k < 80; k++) {
    const x = rnd(k + 2000) * c.width, base = rnd(k + 3000) * c.height, y = (base - t * (40 + rnd(k + 4000) * 80)) % c.height;
    g.fillStyle = `rgba(241,220,151,${polvo * (0.25 + 0.5 * rnd(k + 5000)) * (0.6 + 0.4 * Math.sin(t * 2 + k))})`;
    g.beginPath(); g.arc(x, (y + c.height) % c.height, 1.5 + rnd(k + 6000) * 2.5, 0, Math.PI * 2); g.fill();
  }
}
const cromatico = (el, px) => { el.style.filter = px > 0.3 ? `drop-shadow(${px}px 0 0 rgba(255,40,60,.7)) drop-shadow(${-px}px 0 0 rgba(40,220,255,.7))` : ''; };
const cuadroDe = (clip, lt, vel = 1) => `${clip.dir}/${String(clamp(1 + Math.floor(lt * 30 * vel), 1, clip.n)).padStart(4, '0')}.jpg`;
function glitch(src, fuerza, semilla) {
  const f = $('#pantalla .franjas');
  if (fuerza <= 0.01) { f.style.display = 'none'; return; }
  f.style.display = 'block';
  [...f.children].forEach((d, k) => {
    const img = d.firstChild; if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    img.style.top = `${-k * 100}%`; img.style.height = `${N_FR * 100}%`;
    img.style.transform = `translateX(${(rnd(k * 13 + semilla) - .5) * 2 * fuerza * 160}px)`;
  });
}
// Título de sección: kicker + dos líneas que entran palabra por palabra al pulso
function cabecera(t, t0, kicker, lineas, oro) {
  const cab = $('#cab'), lt = t - t0;
  cab.style.display = 'block';
  cab.querySelector('.k').textContent = kicker;
  const html = lineas.map((l, i) => `<span data-i="${i}" class="${i === oro ? 'oro' : ''}">${l}</span>`).join('<br>');
  if (cab.querySelector('.t').dataset.h !== html) { cab.querySelector('.t').innerHTML = html; cab.querySelector('.t').dataset.h = html; }
  cab.querySelector('.k').style.opacity = eOut(lt / 0.25);
  cab.querySelector('.k').style.letterSpacing = `${0.8 - 0.5 * eOut(lt / 0.5)}em`;
  [...cab.querySelectorAll('.t span')].forEach((s, i) => {
    const q = (lt - 0.12 - i * B) / 0.22;
    s.style.opacity = q < 0 ? 0 : 1;
    s.style.transform = `scale(${q < 0 ? 2.6 : 2.6 - 1.6 * eOut(q)})`;
    s.style.filter = q < 1 ? `blur(${(1 - clamp(q)) * 12}px)` : '';
  });
}
function subtitulos(t) {
  const el = $('#subs');
  const f = D.voz.find(v => t >= v.en - 0.05 && t < v.en + v.dur + 0.35);
  if (!f) { el.innerHTML = ''; return; }
  const lt = t - f.en;
  const html = f.palabras.map((p, i) => `<span class="${lt >= p.t + p.d ? 'ya' : lt >= p.t ? 'on' : ''}">${p.w}</span>`).join(' ');
  if (el.innerHTML !== html) el.innerHTML = html;
  el.style.top = (t >= T.pausa && t < T.ig) ? '1748px' : t >= T.cierre ? '1790px' : '1700px';
}

function mostrar(n, t = 0) {
  grano(t);
  let cam = { s: 1, x: 0, y: 0, r: 0 }, flash = 0, negro = 0, numero = '', tinte = 'transparent', polvo = 0;
  const est = [];
  const temblor = (k, sem) => { cam.x += (rnd(Math.floor(t * 60) + sem) - .5) * k; cam.y += (rnd(Math.floor(t * 60) + sem + 9) - .5) * k; };
  ['#gancho', '#cab', '#mismo', '#t4', '#fecha', '#canales', '#plat', '#pantalla', '#alto', '#celu', '#escudo', '#barrido'].forEach(s => { $(s).style.display = 'none'; });
  $('#rayos').style.opacity = 0; $('#halo').style.opacity = 0; $('#onda').style.opacity = 0;

  // ── APERTURA: el gancho palabra por palabra con la voz, flashes del vivo, título y aceleración al drop
  if (t < T.plat) {
    const v = D.voz[0];
    if (t < T.titulo) {
      const g = $('#gancho'); g.style.display = 'block';
      const lineas = [['NUNCA', 'VISTE'], ['UN', 'PARTIDO'], ['DE', 'TOP', 'SECRET'], ['ASÍ.']];
      if (!g.dataset.ok) { g.innerHTML = lineas.map(l => l.map(w => `<span class="palabra ${/TOP|SECRET|ASÍ/.test(w) ? 'oro' : ''}">${w}</span>`).join('')).join('<br>'); g.dataset.ok = 1; }
      const pal = [...g.querySelectorAll('.palabra')];
      pal.forEach((p, i) => {
        const tw = v.en + (v.palabras[Math.min(i, v.palabras.length - 1)]?.t ?? i * 0.3);
        const q = (t - tw) / 0.2;
        p.style.opacity = q < 0 ? 0 : 1; p.style.transform = `scale(${q < 0 ? 3 : 3 - 2 * eOut(q)})`; p.style.filter = q < 1 ? `blur(${(1 - clamp(q)) * 14}px)` : '';
        if (q >= 0 && q < 1.2) temblor((1 - q / 1.2) * 16, i);
      });
      // flashes de glitch del vivo entre palabras, cada vez más seguidos
      const fl = [1.25, 2.05, 2.75, 3.3, 3.65];
      for (const [i, f0] of fl.entries()) if (t >= f0 && t < f0 + 0.09) {
        $('#pantalla').style.display = 'block';
        const clip = D.clips[['gol', 'pausa', 'contra', 'final', 'ig'][i]] ;
        const img = $('#pantalla img.cuadro'); img.src = cuadroDe(clip, 3 + i);
        $('#pantalla').style.transform = `scale(${1.05 + i * .04}) rotate(${(i % 2 ? 1 : -1) * 2}deg)`; $('#pantalla').style.opacity = 0.85;
        glitch(img.src, 0.8, i * 31); cromatico($('#pantalla'), 10);
      }
      const sal = (t - (T.titulo - 0.15)) / 0.15;
      g.style.transform = sal > 0 ? `scaleX(${1 + sal * .4})` : ''; g.style.opacity = sal > 0 ? 1 - sal : 1;
    } else {
      // título "LAS NUEVAS / TRANSMISIONES" con brillo y luego build: estroboscopio de metraje + zoom + rayos
      const lt = t - T.titulo, cab = $('#cab');
      cabecera(t, T.titulo, 'TOP SECRET FC', ['LAS NUEVAS', 'TRANSMISIONES'], 1);
      cab.style.top = '640px';
      const oro = cab.querySelector('.t span[data-i="1"]'); oro.className = 'brilla'; oro.style.backgroundPosition = `${100 - ((lt * 60) % 200)}% 0`;
      cab.querySelector('.t').style.fontSize = '';
      numero = 'EN VIVO';
      if (t >= T.build) {
        const p = (t - T.build) / (T.plat - T.build), per = 0.18 - 0.13 * p, k = Math.floor((t - T.build) / per) % 5;
        if (p < 0.93) {
          $('#pantalla').style.display = 'block'; $('#pantalla').style.opacity = 0.55 + p * 0.4;
          const clip = D.clips[['gol', 'contra', 'final', 'pausa', 'ig'][k]]; const img = $('#pantalla img.cuadro'); img.src = cuadroDe(clip, 2 + k * 0.7);
          $('#pantalla').style.transform = `translateY(${360}px) scale(${0.8 + p * 0.35})`; cromatico($('#pantalla'), 4 + p * 14); glitch(img.src, p * 0.5, Math.floor(t * 60));
        } else negro = 1;
        cam.s *= 1 + p * 0.14; temblor(p * 24, 3);
        $('#rayos').style.opacity = p * 0.4;
        cab.style.opacity = 1 - clamp((p - 0.85) / 0.1);
      } else cab.style.opacity = 1;
    }
  }

  // ── PLATAFORMAS (drop 1): destello, onda, 4 logos al pulso y "AL MISMO TIEMPO"
  if (t >= T.plat && t < T.gol) {
    const dt = t - T.plat;
    flash = Math.max(flash, 1 - dt / 0.35); cam.s *= 1 + Math.max(0, 0.1 - dt * 0.25); if (dt < 0.45) temblor((1 - dt / 0.45) * 34, 5);
    const o = $('#onda'); o.style.opacity = clamp(1 - dt / 0.7); o.style.transform = `scale(${1 + eOut(dt / 0.7) * 9})`;
    est.push([T.plat, 600, 920, 'rgba(241,215,140,A)', 150]);
    $('#rayos').style.opacity = 0.7; $('#rayos').style.transform = `rotate(${dt * 10}deg)`;
    const cab = $('#cab'); cabecera(t, T.plat + 0.05, '● EN VIVO · EN TODAS', ['CUATRO', 'PLATAFORMAS'], 0); cab.style.top = '150px'; cab.style.opacity = 1;
    $('#plat').style.display = 'block';
    [...document.querySelectorAll('.pl')].forEach((el, i) => {
      const q = (dt - (0.35 + i * 2 * B)) / 0.3, k = el.dataset.k;
      el.style.opacity = q < 0 ? 0 : 1;
      el.style.transform = `scale(${q < 0 ? 0.3 : 0.3 + 0.7 * eOutBack(q)}) rotate(${(1 - eOut(q)) * (i % 2 ? 8 : -8)}deg)`;
      const pulso = Math.pow(1 - (((t - T.plat) % B) / B), 3);
      el.style.boxShadow = q >= 0 ? `0 0 ${40 + pulso * 50}px ${ICON[k].c}55, inset 0 0 0 2px ${ICON[k].c}88` : 'none';
      if (q >= 0 && q < 0.5) temblor((1 - q / 0.5) * 18, i + 20);
      if (q >= 0 && q < 0.08) flash = Math.max(flash, 0.25);
    });
    const m = $('#mismo'), qm = (dt - (0.35 + 8 * B)) / 0.25;
    if (qm > 0) { m.style.display = 'block'; m.innerHTML = '<span class="palabra brilla" style="font-size:150px">AL MISMO TIEMPO</span>';
      m.firstChild.style.backgroundPosition = `${100 - ((dt * 60) % 200)}% 0`;
      m.style.transform = `scale(${2.2 - 1.2 * eOut(qm)})`; m.style.filter = qm < 1 ? `blur(${(1 - clamp(qm)) * 12}px)` : ''; if (qm < 1) temblor((1 - qm) * 20, 40); }
    const sal = (t - (T.gol - 0.14)) / 0.14; if (sal > 0) negro = Math.max(negro, sal);
  }

  // ── MOMENTOS (metraje horizontal real): gol nuestro, gol en contra, final
  const MOM = [
    { t0: T.gol, k: 'gol', kicker: '01 · GOL NUESTRO', l: ['CADA GOL', 'SE GRITA'], oro: 1, ev: D.eventoEn.gol, color: 'rgba(241,215,140,A)', tinte: 'rgba(201,168,76,.10)' },
    { t0: T.contra, k: 'contra', kicker: '02 · GOL EN CONTRA', l: ['SE SUFRE', 'EN EQUIPO'], oro: 1, ev: D.eventoEn.contra, color: null, tinte: 'rgba(160,20,30,.16)' },
    { t0: T.final, k: 'final', kicker: '03 · FINAL DEL PARTIDO', l: ['EL VESTUARIO', 'REACCIONA'], oro: 1, ev: D.eventoEn.final, color: 'rgba(241,215,140,A)', tinte: 'rgba(201,168,76,.08)' },
  ];
  for (const [i, m] of MOM.entries()) {
    const t1 = i < 2 ? MOM[i + 1].t0 : T.pausa;
    if (t < m.t0 || t >= t1) continue;
    const lt = t - m.t0, cab = $('#cab');
    cabecera(t, m.t0, m.kicker, m.l, m.oro); cab.style.top = '150px'; cab.style.opacity = 1;
    const p = $('#pantalla'); p.style.display = 'block'; p.style.opacity = 1;
    const img = $('#pantalla img.cuadro'); img.src = cuadroDe(D.clips[m.k], lt);
    // entrada 3D + glitch; después acercamiento lento al palco (abajo a la izquierda o a la derecha según el tramo)
    const e = eOutBack(lt / 0.45);
    p.style.transform = `perspective(1600px) translateY(${(1 - eOut(lt / 0.5)) * 220}px) rotateX(${(1 - eOut(lt / 0.6)) * 22}deg) rotateY(${(1 - eOut(lt / 0.6)) * (i % 2 ? -14 : 14)}deg) scale(${0.82 + 0.18 * e})`;
    glitch(img.src, Math.max(0, 1 - lt / 0.25), Math.floor(t * 30)); cromatico(p, Math.max(0, 8 - lt * 30));
    const zoom = 1 + 0.32 * eInOut((lt - 1.2) / ((t1 - m.t0) - 1.6));
    p.querySelector('.vid').style.transformOrigin = D.palcoLado[m.k] === 'der' ? '82% 80%' : '18% 80%';
    p.querySelector('.vid').style.transform = `scale(${zoom})`;
    numero = String(i + 1).padStart(2, '0');
    tinte = m.tinte;
    // el momento del evento en el metraje: golpe sincronizado
    const de = lt - m.ev;
    if (de >= 0 && de < 0.6) {
      if (m.color) { flash = Math.max(flash, (1 - de / 0.3) * 0.55); est.push([m.t0 + m.ev, 600, 1060, m.color, 120]); temblor((1 - de / 0.6) * 26, 50 + i); }
      else { temblor((1 - de / 0.6) * 40, 70); tinte = `rgba(200,20,30,${0.32 * (1 - de / 0.6) + 0.16})`; }
    }
    if (lt < 0.06) flash = Math.max(flash, 0.3);
    const sal = (t - (t1 - 0.12)) / 0.12; if (sal > 0) negro = Math.max(negro, sal * 0.9);
  }

  // ── LAS ESPERAS (modo pausa, metraje vertical)
  if (t >= T.pausa && t < T.ig) {
    const lt = t - T.pausa, cab = $('#cab');
    cabecera(t, T.pausa, '04 · LAS ESPERAS', ['LA PANTALLA', 'ES NUESTRA'], 1); cab.style.top = '90px'; cab.style.opacity = 1;
    cab.querySelector('.t').style.fontSize = '';
    const a = $('#alto'); a.style.display = 'block';
    a.querySelector('img').src = cuadroDe(D.clips.pausa, lt);
    a.style.transform = `perspective(1600px) translateY(${(1 - eOut(lt / 0.5)) * 300 + 70}px) rotateY(${(1 - eOut(lt / 0.7)) * -18}deg) scale(${0.88 + 0.12 * eOutBack(lt / 0.5) + lt * 0.004})`;
    cromatico(a, Math.max(0, 8 - lt * 30));
    numero = '04'; tinte = 'rgba(201,168,76,.06)';
    if (lt < 0.06) flash = Math.max(flash, 0.3);
    const sal = (t - (T.ig - 0.12)) / 0.12; if (sal > 0) negro = Math.max(negro, sal * 0.9);
  }

  // ── INSTAGRAM (build hacia el drop 2): celular con la vertical + aceleración
  if (t >= T.ig && t < T.cierre) {
    const lt = t - T.ig, dur = T.cierre - T.ig, p = lt / dur, cab = $('#cab');
    cabecera(t, T.ig, '05 · INSTAGRAM', ['EN VERTICAL'], 0); cab.style.top = '110px'; cab.style.opacity = 1 - clamp((p - 0.9) / 0.08);
    const c = $('#celu'); c.style.display = p < 0.95 ? 'block' : 'none';
    c.querySelector('.pant img').src = cuadroDe(D.clips.ig, lt);
    c.style.transform = `perspective(1800px) translateY(${(1 - eOut(lt / 0.5)) * 320 + 120}px) rotateY(${(1 - eOut(lt / 0.8)) * 24 - 6 + p * 6}deg) rotateZ(${-3 + p * 3}deg) scale(${0.92 + p * 0.16})`;
    c.querySelector('.anillo').style.opacity = 0.5 + 0.3 * Math.sin(lt * 6);
    cam.s *= 1 + p * 0.1; if (p > 0.6) temblor((p - 0.6) * 40, 80);
    $('#rayos').style.opacity = p * 0.45; numero = '05';
    if (p > 0.95) negro = 1;
  }

  // ── CIERRE (drop 2): escudo con destello, onda, rayos, chispas, barrido de luz; Temporada 4, fecha y canales
  if (t >= T.cierre) {
    const dt = t - T.cierre;
    flash = Math.max(flash, 1 - dt / 0.4); cam.s *= 1 + Math.max(0, 0.12 - dt * 0.3); if (dt < 0.5) temblor((1 - dt / 0.5) * 38, 90);
    const o = $('#onda'); o.style.opacity = clamp(1 - dt / 0.8); o.style.transform = `scale(${1 + eOut(dt / 0.8) * 10})`; o.style.top = '41%';
    est.push([T.cierre, 600, 880, 'rgba(241,215,140,A)', 190]);
    $('#rayos').style.opacity = 0.9; $('#rayos').style.transform = `rotate(${dt * 12}deg)`; $('#rayos').style.top = '41%';
    const pulso = Math.pow(1 - ((dt % B) / B), 4) * 0.02;
    $('#halo').style.opacity = 0.7 + pulso * 10; $('#halo').style.top = '41%';
    const es = $('#escudo'); es.style.display = 'block';
    es.style.transform = `scale(${1.4 - 0.4 * eOutBack(dt / 0.55) + pulso}) rotate(${(1 - eOut(dt / 0.6)) * -14}deg)`;
    const br = $('#barrido'); br.style.display = 'block'; br.style.transform = es.style.transform;
    const fase = ((dt - 0.6) % (4 * B)) / 0.8;
    br.style.background = `linear-gradient(105deg,transparent ${fase * 140 - 40}%,rgba(255,240,200,.8) ${fase * 140 - 25}%,transparent ${fase * 140 - 10}%)`;
    const t4 = $('#t4'), q4 = (dt - 2 * B) / 0.3;
    t4.style.display = q4 > 0 ? 'block' : 'none';
    t4.querySelector('b').textContent = 'TEMPORADA 4'; t4.querySelector('b').className = 'brilla';
    t4.querySelector('b').style.backgroundPosition = `${100 - ((dt * 40) % 200)}% 0`;
    t4.style.transform = `scale(${1.5 - 0.5 * eOutBack(q4)})`; t4.style.filter = q4 < 1 ? `blur(${(1 - clamp(q4)) * 10}px)` : '';
    const f = $('#fecha'), qf = (dt - 4 * B) / 0.35;
    f.style.display = qf > 0 ? 'block' : 'none'; f.querySelector('div').textContent = 'Martes 20/10 · Espacio Gamer';
    f.style.transform = `translateY(${(1 - eOutBack(qf)) * 120}px)`; f.style.opacity = eOut(qf);
    const ca = $('#canales'), qc = (dt - 7 * B);
    ca.style.display = qc > 0 ? 'flex' : 'none';
    [...ca.children].forEach((c, i) => { const q = (qc - i * B * 0.5) / 0.3; c.style.opacity = eOut(q); c.style.transform = `translateY(${(1 - eOutBack(q)) * 60}px)`; });
    polvo = clamp(dt / 1.2);
    const fin = clamp((t - (T.fin - 0.9)) / 0.9); if (fin > 0) negro = Math.max(negro, fin);
  }

  particulas(t, est, polvo);
  subtitulos(t);
  const nu = $('#numero'); nu.textContent = numero; nu.style.transform = `translate(calc(-50% + ${Math.sin(t * 0.7) * 40}px), -50%)`;
  $('#tinte').style.background = tinte;
  $('#flash').style.opacity = clamp(flash);
  $('#negro').style.opacity = clamp(negro);
  $('#cam').style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s}) rotate(${cam.r}deg)`;
}
</script>
