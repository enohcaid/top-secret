<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- "Decidí en 3 segundos": tres jugadas reales del vivo. Cada una corre, se congela justo antes de la decisión (desaturado +
     zoom lento al que tiene la pelota), tres botones y una cuenta de 3 s; al llegar a cero los botones se traban y la jugada
     sigue: se marca lo que hizo nuestro jugador y el resultado. Cierre: "¿Cuántas acertaste?".
     Escenas: 3*j + 0 previa · 3*j + 1 cuenta · 3*j + 2 revelación (j = 0..2) · 9 cierre. Todo sale de t (determinístico).
     Coordenadas en píxeles del video original (1280x720); los cuadros en disco van a D.K veces ese tamaño.
     Franja de arriba (0-170) libre: ahí va el rótulo del tema. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--gold:#C9A84C;--gold2:#E6CF85;--text:#F7F2E4;--win:#3ecf8e;--loss:#e5484d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Barlow,sans-serif}
canvas{position:absolute;inset:0;width:1080px;height:1920px}
.capa{position:absolute;left:0;right:0;text-align:center;will-change:transform,opacity}
#kicker{top:200px;font:800 40px/1 'Barlow Condensed';letter-spacing:.16em;color:var(--gold2);text-shadow:0 3px 18px rgba(0,0,0,.8)}
#titulo{top:262px;font-family:'Bebas Neue';font-size:128px;line-height:.9;text-shadow:0 8px 40px rgba(0,0,0,.7)}
#titulo em{font-style:normal;color:var(--gold2)}
#pregunta{top:262px;padding:0 50px;font:800 82px/1 'Barlow Condensed';text-shadow:0 4px 24px rgba(0,0,0,.8)}
#autor{top:258px;font:800 104px/1 'Barlow Condensed';text-shadow:0 6px 30px rgba(0,0,0,.8)}
#hizo{top:1380px;font-family:'Bebas Neue';font-size:96px;line-height:1;color:var(--text);text-shadow:0 6px 30px rgba(0,0,0,.9)}
#sub{top:1528px;font:800 40px/1 'Barlow Condensed';letter-spacing:.08em;color:var(--text);opacity:.8}
#gol{top:960px;font-family:'Bebas Neue';font-size:230px;line-height:.86;color:var(--gold2);text-shadow:0 10px 60px rgba(0,0,0,.85)}
#gol small{display:block;font-size:84px;color:var(--text)}
#gol small.gt{font:800 76px/1.1 'Barlow Condensed'}   /* gamertag tal cual: Bebas no tiene minúsculas */
#reloj{position:absolute;left:440px;top:1420px;width:200px;height:200px;will-change:transform}
#reloj b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-weight:400;font-size:150px;line-height:1;padding-top:12px}
#botones{position:absolute;left:44px;right:44px;top:1662px;display:flex;gap:24px}
.boton{flex:1;height:180px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(12,12,12,.82);box-shadow:inset 0 0 0 4px rgba(247,242,228,.55);will-change:transform,opacity}
.boton b{font-family:'Bebas Neue';font-weight:400;font-size:92px;line-height:1;padding-top:8px;color:var(--text)}
.boton.traba{box-shadow:inset 0 0 0 4px var(--gold2)}
.boton.bien{background:var(--win);box-shadow:inset 0 0 0 4px var(--win)}
.boton.bien b{color:#06140d}
#tiempo{top:1540px;font-family:'Bebas Neue';font-size:110px;line-height:1;color:var(--gold2);text-shadow:0 6px 30px rgba(0,0,0,.9)}
#cierre{position:absolute;inset:0}
#c1{top:600px;font-family:'Bebas Neue';font-size:220px;line-height:.9;text-shadow:0 10px 60px rgba(0,0,0,.8)}
#c2{top:1060px;padding:0 90px;font:800 76px/1.1 'Barlow Condensed';color:var(--gold2)}
#esc{position:absolute;left:50%;top:1330px;height:250px;margin-left:-112px;will-change:transform,opacity}
#destello{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="lienzo">
  <canvas id="fondo" width="1080" height="1920"></canvas>
  <canvas id="marcas" width="1080" height="1920"></canvas>
  <div id="kicker" class="capa"></div>
  <div id="titulo" class="capa"></div>
  <div id="pregunta" class="capa"></div>
  <div id="autor" class="capa"></div>
  <div id="gol" class="capa"></div>
  <div id="hizo" class="capa"></div>
  <div id="sub" class="capa"></div>
  <div id="tiempo" class="capa"></div>
  <div id="reloj"><canvas id="aro" width="200" height="200" style="width:200px;height:200px"></canvas><b></b></div>
  <div id="botones"><div class="boton"><b></b></div><div class="boton"><b></b></div><div class="boton"><b></b></div></div>
  <div id="cierre"><div id="c1" class="capa"></div><div id="c2" class="capa"></div><img id="esc"></div>
  <div id="destello"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eOut = p => 1 - Math.pow(1 - clamp(p), 3);
const eIO = p => { p = clamp(p); return p * p * (3 - 2 * p); };
const lerp = (a, b, p) => a + (b - a) * p;
const W = 1080, H = 1920;
const fondo = $('#fondo').getContext('2d'), marcas = $('#marcas').getContext('2d'), aro = $('#aro').getContext('2d');
fondo.imageSmoothingQuality = 'high';
const dorado = t => t.replace(/\*(.+?)\*/g, '<em>$1</em>');
let D, cache = new Map();

async function img(src) {
  if (cache.has(src)) return cache.get(src);
  const i = new Image(); i.src = src; await i.decode();
  if (cache.size > 16) cache.delete(cache.keys().next().value);
  cache.set(src, i);
  return i;
}
function tabla(k, x, col = 1) {
  if (x <= k[0][0]) return k[0][col];
  for (let i = 1; i < k.length; i++) if (x <= k[i][0]) return lerp(k[i - 1][col], k[i][col], eIO((x - k[i - 1][0]) / (k[i][0] - k[i - 1][0])));
  return k[k.length - 1][col];
}
// Cuadro del tramo en el segundo `seg` del video original (mezcla los dos cuadros vecinos: cámara lenta sin saltos)
async function cuadro(tr, seg) {
  const f = clamp((seg - tr.desde) * D.fps, 0, tr.n - 1), a = Math.floor(f), b = Math.min(tr.n - 1, a + 1);
  const nom = k => `${tr.dir}/${String(k + 1).padStart(4, '0')}.jpg`;
  return { a: await img(nom(a)), b: await img(nom(b)), m: f - a };
}
function ventana(ctx, c, cx, cy, ancho, r, filtro = 'none') {
  const alto = ancho * r[3] / r[2], K = D.K;
  const x = clamp(cx - ancho / 2, 0, 1280 - ancho), y = clamp(cy - alto / 2, 0, 720 - alto);
  ctx.save(); ctx.filter = filtro;
  ctx.drawImage(c.a, x * K, y * K, ancho * K, alto * K, r[0], r[1], r[2], r[3]);
  if (c.m > .02) { ctx.globalAlpha = c.m; ctx.drawImage(c.b, x * K, y * K, ancho * K, alto * K, r[0], r[1], r[2], r[3]); }
  ctx.restore();
  return { x, y, ancho, alto };
}
// Franja principal (sin el overlay de la transmisión ni el HUD de abajo) sobre el mismo cuadro esmerilado
const BANDA = [0, 420, 1080, 1100], ANCHO = 1080 * 616 / 1100;
function franja(c, cam, filtro = 'none', oscuro = .34) {
  ventana(fondo, c, cam.cx, 360, 405, [0, 0, W, H], `blur(26px) brightness(${oscuro})${filtro === 'none' ? '' : ' ' + filtro}`);
  const v = ventana(fondo, c, cam.cx, cam.cy, cam.ancho, BANDA, filtro);
  for (const [y, dir] of [[BANDA[1], 1], [BANDA[1] + BANDA[3], -1]]) {
    const g = fondo.createLinearGradient(0, y, 0, y + dir * 90);
    g.addColorStop(0, 'rgba(5,5,5,.85)'); g.addColorStop(1, 'rgba(5,5,5,0)');
    fondo.fillStyle = g; fondo.fillRect(0, Math.min(y, y + dir * 90), W, 90);
  }
  return v;
}
// del video original a la pantalla, según la ventana dibujada
const aPantalla = (v, x, y) => [BANDA[0] + (x - v.x) / v.ancho * BANDA[2], BANDA[1] + (y - v.y) / v.alto * BANDA[3]];
const camNormal = (J, seg) => ({ cx: tabla(J.cam, seg), cy: J.cy ?? 368, ancho: J.ancho ?? ANCHO });   // cy/ancho propios si hay que esquivar el HUD
function camCongelada(J, p) {
  const n = camNormal(J, J.congela), z = eIO(p);
  return { cx: lerp(n.cx, J.foco[0], z), cy: lerp(n.cy, J.foco[1], z), ancho: lerp(n.ancho, J.zoom, z) };
}
function golpe(el, t, en, de = 1.5, dur = .24) { const p = eOut((t - en) / dur); el.style.transform = `scale(${lerp(de, 1, p)})`; el.style.opacity = clamp((t - en) / .07); }
function entra(el, t, en, de = 40) { const p = eOut((t - en) / .3); el.style.opacity = clamp((t - en) / .1); el.style.transform = `translateY(${(1 - p) * de}px)`; }
function ver(sel, on = true) { $(sel).style.display = on ? '' : 'none'; }

async function pintar(datos) {
  D = datos;
  $('#esc').src = D.escudo;
  await document.fonts.ready;
  await Promise.all(["800 34px 'Barlow Condensed'", "60px 'Bebas Neue'", "700 36px Barlow"].map(f => document.fonts.load(f)));
  return 10;
}
function ocultarTodo() {
  for (const s of ['#kicker', '#titulo', '#pregunta', '#autor', '#gol', '#hizo', '#sub', '#tiempo', '#reloj', '#botones', '#cierre']) ver(s, false);
  $('#destello').style.opacity = 0;
  marcas.clearRect(0, 0, W, H);
  fondo.fillStyle = '#050505'; fondo.fillRect(0, 0, W, H);
}
// Los tres botones: estado 'entra' (aparecen), 'cuenta' (laten con cada segundo), 'traba' (cero), 'revela' (el correcto)
function botones(J, t, estado, tl = 0) {
  ver('#botones');
  [...document.querySelectorAll('.boton')].forEach((b, i) => {
    b.querySelector('b').textContent = J.opciones[i];
    b.className = 'boton' + (estado === 'traba' ? ' traba' : '') + (estado === 'revela' && i === J.correcta ? ' bien' : '');
    if (estado === 'revela') {
      const p = eOut(tl / .3), ok = i === J.correcta;
      b.style.opacity = ok ? 1 : lerp(1, .22, p);
      b.style.transform = ok ? `scale(${1 + .1 * Math.sin(Math.PI * clamp(tl / .35))})` : `scale(${lerp(1, .92, p)})`;
      return;
    }
    const p = eOut((t - i * .07) / .3), f = t % 1;
    b.style.opacity = clamp((t - i * .07) / .12);
    b.style.transform = `translateY(${(1 - p) * 110}px) scale(${estado === 'traba' ? 1 - .05 * Math.max(0, 1 - (t - 3 + .2) / .15) : 1 + .03 * Math.max(0, 1 - f / .2)})`;
  });
}
// Anillo dorado alrededor del que tiene la pelota (late con la cuenta)
function anillo(x, y, t, alfa) {
  const m = marcas, r = 74 + 8 * Math.max(0, 1 - (t % 1) / .3);
  m.save(); m.globalAlpha = alfa; m.strokeStyle = '#E6CF85'; m.lineWidth = 7; m.shadowColor = 'rgba(0,0,0,.6)'; m.shadowBlur = 16;
  m.beginPath(); m.arc(x, y, r, 0, 7); m.stroke();
  m.lineWidth = 3; m.globalAlpha = alfa * .45; m.beginPath(); m.arc(x, y, r + 22, 0, 7); m.stroke();
  m.restore();
}

// 3j+0 · La jugada a velocidad normal hasta el instante de la decisión
async function previa(j, t, o) {
  const J = D.jugadas[j], seg = J.desde + t, c = await cuadro(J, seg);
  franja(c, camNormal(J, seg));
  $('#destello').style.opacity = clamp(1 - t / .14) * (j ? .35 : .2);
  if (o?.sinTexto) return;
  ver('#kicker'); $('#kicker').innerHTML = J.kicker; entra($('#kicker'), t, .05, -20);
  if (j === 0) { ver('#titulo'); $('#titulo').innerHTML = dorado(D.textos.titulo); golpe($('#titulo'), t, 0, 1.35); }
  else { ver('#pregunta'); $('#pregunta').innerHTML = J.pregunta; entra($('#pregunta'), t, .1, 30); }
  ver('#sub'); $('#sub').innerHTML = j === 0 ? D.textos.gancho : J.contexto; entra($('#sub'), t, .3, 20);
}

// 3j+1 · Congelado: desaturado, zoom lento al jugador, tres botones y la cuenta de 3
async function cuenta(j, t) {
  const J = D.jugadas[j], c = await cuadro(J, J.congela), p = clamp(t / 3);
  const gris = lerp(1, .12, eOut(t / .35));
  const v = franja(c, camCongelada(J, p), `saturate(${gris}) contrast(${lerp(1, 1.1, eOut(t / .35))})`, .26);
  $('#destello').style.opacity = clamp(1 - t / .1) * .5;
  const [ax, ay] = aPantalla(v, J.foco[0], J.foco[1] + J.anilloDy);
  anillo(ax, ay, t, clamp((t - .15) / .2));
  ver('#kicker'); $('#kicker').innerHTML = J.kicker; $('#kicker').style.opacity = 1; $('#kicker').style.transform = '';
  ver('#pregunta'); $('#pregunta').innerHTML = J.pregunta; $('#pregunta').style.opacity = 1; $('#pregunta').style.transform = `scale(${lerp(1.12, 1, eOut(t / .25))})`;
  // reloj: número + arco que se vacía
  ver('#reloj'); const n = Math.max(1, 3 - Math.floor(t)), f = t % 1;
  $('#reloj b').textContent = t >= 2.9 ? '0' : n; $('#reloj b').style.color = n === 1 ? '#E6CF85' : '#F7F2E4';
  $('#reloj').style.transform = `scale(${1 + .22 * Math.max(0, 1 - f / .25)})`;
  aro.clearRect(0, 0, 200, 200);
  aro.fillStyle = 'rgba(8,8,8,.85)'; aro.beginPath(); aro.arc(100, 100, 92, 0, 7); aro.fill();
  aro.lineWidth = 10; aro.strokeStyle = 'rgba(247,242,228,.18)'; aro.beginPath(); aro.arc(100, 100, 86, 0, 7); aro.stroke();
  aro.strokeStyle = '#E6CF85'; aro.lineCap = 'round'; aro.beginPath(); aro.arc(100, 100, 86, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * (1 - p)); aro.stroke();
  botones(J, t, t >= 2.85 ? 'traba' : 'cuenta');
  if (t >= 2.85) { ver('#reloj', false); ver('#tiempo'); $('#tiempo').textContent = '¡TIEMPO!'; golpe($('#tiempo'), t, 2.85, 1.6, .15); }
}

// Segundo del video durante la revelación: normal hasta lento[0], a la mitad hasta lento[1], normal después
function segRevela(J, t) {
  const [a, b] = J.lento, t1 = a - J.congela, t2 = t1 + 2 * (b - a);
  if (t < t1) return J.congela + t;
  if (t < t2) return a + (t - t1) / 2;
  return b + (t - t2);
}
// 3j+2 · La jugada sigue: se marca lo que hizo y el resultado
async function revela(j, t, o) {
  const J = D.jugadas[j], seg = segRevela(J, t), c = await cuadro(J, seg);
  const vuelve = eOut(t / .45), z = camCongelada(J, 1), nrm = camNormal(J, seg);
  const lento = seg >= J.lento[0] && seg < J.lento[1];
  franja(c, { cx: lerp(z.cx, nrm.cx, vuelve), cy: lerp(z.cy, nrm.cy, vuelve), ancho: lerp(z.ancho, nrm.ancho, vuelve) }, `saturate(${lerp(.12, lento ? .9 : 1, vuelve)})`);
  const g = seg - J.golEn;
  $('#destello').style.opacity = Math.max(clamp(1 - t / .12) * .4, g > 0 ? clamp(1 - g / .16) * .5 : 0);
  if (o?.sinTexto) return;
  ver('#kicker'); $('#kicker').innerHTML = 'LO QUE HIZO'; entra($('#kicker'), t, 0, -20);
  ver('#autor'); $('#autor').textContent = J.autor; entra($('#autor'), t, .08, 30);
  botones(J, t, 'revela', t);
  ver('#hizo'); $('#hizo').innerHTML = J.hizo; entra($('#hizo'), t, .2, 30);
  ver('#sub'); $('#sub').innerHTML = J.contexto; $('#sub').style.opacity = .8; $('#sub').style.transform = '';
  if (g > 0) { ver('#gol'); $('#gol').innerHTML = J.gol; golpe($('#gol'), g, 0, 1.6); }
}

// 9 · Cierre
async function cierre(t) {
  const J = D.jugadas[2], c = await cuadro(J, J.golEn + .4);
  ventana(fondo, c, tabla(J.cam, J.golEn), 360, 405 - t * 18, [0, 0, W, H], 'blur(12px) brightness(.36)');
  ver('#cierre');
  ver('#c1'); $('#c1').innerHTML = D.textos.cierre[0]; golpe($('#c1'), t, .05, 1.4);
  ver('#c2'); $('#c2').innerHTML = D.textos.cierre[1]; entra($('#c2'), t, .55, 30);
  entra($('#esc'), t, .9, 20);
}

async function mostrar(n, t, o) {
  ocultarTodo();
  if (n === 9) return cierre(t);
  const j = Math.floor(n / 3), k = n % 3;
  if (k === 0) return previa(j, t, o);
  if (k === 1) return cuenta(j, t);
  return revela(j, t, o);
}
</script>
</body>
</html>
