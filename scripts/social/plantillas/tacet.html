<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}#lienzo{display:block;width:1080px;height:1920px}</style></head>
<body><canvas id="lienzo" width="1080" height="1920"></canvas>
<script>
// "Tacet": presentación de Tacet Sin desde el club. Silencio y pentagrama; 23 franjas (una por tema) que se mueven con el
// espectro real de la canción y dejan ver momentos del club; se abren al disco justo en "No sound came out".
// Todo es función de t (determinístico). Tiempos en D.T, calculados en el script de la pieza.
const W = 1080, H = 1920, N = 23;
const c = document.getElementById('lienzo'), x = c.getContext('2d');
let D, tiras = [], ruido = [], img = {};
const sat = v => Math.max(0, Math.min(1, v));
const suave = v => { v = sat(v); return v * v * (3 - 2 * v); };
const sale = v => 1 - Math.pow(1 - sat(v), 3);
const tramo = (t, a, b, ent = .4, sal = .4) => sat((t - a) / ent) * sat((b - t) / sal);
const carga = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

function azar(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

async function pintar(d) {
  D = d;
  await Promise.all(["700 190px 'Barlow Condensed'", "600 40px 'Barlow Condensed'", "500 30px 'Barlow Condensed'", "italic 500 170px 'Cormorant Garamond'"].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  // Franjas de ancho desigual, como en la portada del disco
  const r = azar(23);
  const anchos = Array.from({ length: N }, () => 18 + r() * 54);
  const hueco = 7, escala = (W - 56 - hueco * (N - 1)) / anchos.reduce((a, b) => a + b, 0);
  let px = 28;
  const orden = Array.from({ length: N }, (_, i) => i).sort(() => r() - .5);
  tiras = anchos.map((a, i) => { const w = a * escala, o = { x: px, w, dy: (r() - .5) * 300, orden: orden.indexOf(i) }; px += w + hueco; return o; });
  for (let k = 0; k < 3; k++) {
    const n = document.createElement('canvas'); n.width = 540; n.height = 960;
    const g = n.getContext('2d'), id = g.createImageData(540, 960), q = azar(77 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = q() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); ruido.push(n);
  }
  const lote = async (lista) => { const out = []; for (let i = 0; i < lista.length; i += 24) out.push(...await Promise.all(lista.slice(i, i + 24).map(carga))); return out; };
  img.clips = {}; for (const [k, v] of Object.entries(d.clips)) img.clips[k] = await lote(v);
  img.disco = await lote(d.disco);
  img.temas = await lote(d.temas.map(t => t.img));
  img.grupal = await carga(d.grupal); img.escudo = await carga(d.escudo);
  img.tapa1 = await carga(d.tapa1); img.tapa2 = await carga(d.tapa2);
  return 1;
}

const banda = (t, i) => {
  const f = (t - D.T.suena) * 30, a = Math.floor(f), u = f - a, b = D.bandas;
  if (a < 0) return 0;
  const p = b[Math.min(a, b.length - 1)], q = b[Math.min(a + 1, b.length - 1)];
  return p[i] * (1 - u) + q[i] * u;
};

// Texto con separación animada
function texto(s, px, y, { peso = 600, fam = "'Barlow Condensed'", color = '#fff', alfa = 1, sep = 0, it = false } = {}) {
  if (alfa <= 0) return;
  x.save(); x.globalAlpha = alfa; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = `${it ? 'italic ' : ''}${peso} ${px}px ${fam}`; x.letterSpacing = `${sep}px`;
  x.shadowColor = 'rgba(0,0,0,.75)'; x.shadowBlur = 26;
  x.fillText(s, W / 2 + sep / 2, y); x.restore();
}

function cuadroDe(t, fuente, desde) {
  const lista = img.clips[fuente], i = Math.floor((t - desde) * 30);
  return lista[Math.max(0, Math.min(lista.length - 1, i))];
}
// Qué se ve a través de las franjas en este instante
function fuentes(t) {
  const out = [];
  for (const f of D.tramos) {
    const a = tramo(t, f.desde, f.hasta, .5, .5);
    if (a > 0) out.push({ a, f });
  }
  return out;
}
function dibujarTira(o, y, h, a, f, t) {
  let im, sx = o.x, sy = y, sw = o.w, sh = h, iw, ih;
  if (f.clip) { im = cuadroDe(t, f.clip, f.desde); if (!im) return; iw = im.naturalWidth; ih = im.naturalHeight; const e = Math.max(W / iw, H / ih), ox = (W - iw * e) / 2, oy = (H - ih * e) / 2; sx = (o.x - ox) / e; sy = (y - oy) / e; sw = o.w / e; sh = h / e; }
  else { im = img.grupal; iw = im.naturalWidth; ih = im.naturalHeight; const e = H / ih * 1.12, av = (t - f.desde) / (f.hasta - f.desde), ox = (W - iw * e) * (.42 + av * .16), oy = (H - ih * e) / 2; sx = (o.x - ox) / e; sy = (y - oy) / e; sw = o.w / e; sh = h / e; }
  x.globalAlpha = a; x.drawImage(im, sx, sy, sw, sh, o.x, y, o.w, h);
}

function sombra(a, b, alfa) {
  if (alfa <= 0) return;
  const g = x.createLinearGradient(0, a - 130, 0, b + 130);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.3, `rgba(0,0,0,${alfa})`); g.addColorStop(.7, `rgba(0,0,0,${alfa})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.globalAlpha = 1; x.fillStyle = g; x.fillRect(0, a - 130, W, b - a + 260);
}

function pentagrama(t) {
  const a = tramo(t, 0, D.T.suena, .5, .45);
  x.save(); x.strokeStyle = '#d8c7a0'; x.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const y = 820 + i * 34, av = sale((t - i * .08) / .9);
    x.globalAlpha = a * .42; x.beginPath(); x.moveTo(W / 2 - 430 * av, y); x.lineTo(W / 2 + 430 * av, y); x.stroke();
  }
  x.restore();
  texto('Tacet', 170, 945, { peso: 500, fam: "'Cormorant Garamond'", it: true, color: '#f4ead2', alfa: a * sat((t - .5) / .8) });
  texto('En una partitura: la orden de no sonar.', 44, 1100, { peso: 500, color: '#cfc4ab', alfa: a * sat((t - 1.35) / .6), sep: 1 });
  // Una sola franja que empieza a encenderse, a punto de romper el silencio
  const u = sat((t - 2.5) / .7);
  if (u > 0) { const o = tiras[11], h = H * .5 * u; const g = x.createLinearGradient(0, H / 2 - h, 0, H / 2 + h); g.addColorStop(0, 'rgba(255,180,70,0)'); g.addColorStop(.5, 'rgba(255,205,120,.95)'); g.addColorStop(1, 'rgba(255,180,70,0)'); x.fillStyle = g; x.fillRect(o.x + o.w / 2 - 1.5, H / 2 - h, 3, h * 2); }
}

function franjasClub(t) {
  const T = D.T, cierra = suave((t - T.cierra) / 1.05);
  for (const { a, f } of fuentes(t)) for (let i = 0; i < N; i++) {
    const o = tiras[i], abre = sale((t - T.suena - o.orden * .1) / .55);
    if (abre <= 0) continue;
    const b = banda(t, i), h = H * abre * (.2 + .8 * b) * (1 - cierra * .985);
    dibujarTira(o, H / 2 - h / 2 + o.dy * abre * (1 - cierra), h, a * (.72 + .28 * b) * (1 - suave((t - T.cierra - .35) / .6)), f, t);
  }
  x.globalAlpha = 1;
}

function disco(t) {
  const T = D.T, u = t - T.rompe, n = img.disco.length;
  const k = Math.floor(u * 30) % (2 * n - 2), im = img.disco[k < n ? k : 2 * n - 2 - k];
  if (!im) return;
  const z = 1920 * (1.07 - .07 * sat(u / 8)), ox = (W - z) / 2, oy = (H - z) / 2;
  if (u < .36) {   // las franjas se abren hasta llenar la pantalla
    const e = sale(u / .36);
    x.save(); x.beginPath();
    for (let i = 0; i < N; i++) { const o = tiras[i], w = o.w + (W / N * 2.6 - o.w) * e, h = H * (.12 + .88 * e); x.rect(o.x + o.w / 2 - w / 2, H / 2 - h / 2, w, h); }
    x.clip(); x.drawImage(im, ox, oy, z, z); x.restore();
  } else x.drawImage(im, ox, oy, z, z);
  const g = x.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1200); g.addColorStop(0, 'rgba(0,0,0,.28)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const fl = 1 - sat(u / .35); if (fl > 0) { x.fillStyle = `rgba(255,226,170,${fl * .34})`; x.fillRect(0, 0, W, H); }
}

function muro(t) {
  const T = D.T, m = W / N, final = suave((t - T.cierre) / 1);
  for (let i = 0; i < N; i++) {
    const im = img.temas[i]; if (!im) continue;
    const e = sale((t - T.muro - i * .1) / .5); if (e <= 0) continue;
    const b = banda(t, i), h = H * e * (.42 + .58 * b) * (1 - final * .9);
    const iw = im.naturalWidth, ih = im.naturalHeight, s = H / ih, sw = (m - 2) / s, sx = ((i + .5) / N) * (iw - sw), sy = (H - h) / 2 / s;
    const activo = temaActivo(t) === i;
    x.globalAlpha = (activo ? 1 : .86) * (1 - final * .6);
    x.drawImage(im, sx, sy, sw, h / s, i * m + 1, (H - h) / 2, m - 2, h);
  }
  x.globalAlpha = 1;
}
const temaActivo = t => Math.floor((t - T_muro()) / D.T.porTema);
const T_muro = () => D.T.muro;

function letra(t, y, px, op = 1) {
  for (const l of D.letra) {
    const a = tramo(t, l.ini, Math.max(l.fin, l.ini + .9) + .15, .16, .22);
    if (a > 0) texto(l.texto, px, y, { peso: 500, color: '#f2e6cc', alfa: a * op, sep: .5 });
  }
}

function suena(t) {   // qué tema suena: compacto, con ecualizador real
  const a = sat((t - D.T.suena - .3) / .5) * (1 - sat((t - D.T.fin + .4) / .4));
  if (a <= 0) return;
  x.save(); x.globalAlpha = a * .92; x.fillStyle = '#e8d3a2';
  for (let i = 0; i < 5; i++) { const h = 8 + 28 * banda(t, i * 4 + 2); x.fillRect(60 + i * 9, 138 - h, 5, h); }
  x.textAlign = 'left'; x.font = "600 34px 'Barlow Condensed'"; x.letterSpacing = '1px'; x.shadowColor = 'rgba(0,0,0,.8)'; x.shadowBlur = 16;
  x.fillStyle = '#fff'; x.fillText(`${D.tema} — Tacet Sin`, 120, 136); x.restore();
}

function mostrar(n, t, o = {}) {
  const T = D.T;
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.fillStyle = '#040302'; x.fillRect(0, 0, W, H);
  if (o.portada) {
    disco(T.rompe + 1.6);
    const g = x.createLinearGradient(0, 560, 0, 1320); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.66)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.globalAlpha = 1; x.drawImage(img.escudo, W / 2 - 42, 690, 84, 84 * img.escudo.naturalHeight / img.escudo.naturalWidth);
    texto('TOP SECRET PRESENTA', 42, 852, { peso: 600, sep: 9, color: '#e7d3a3' });
    texto('TACET SIN', 210, 1030, { peso: 700, sep: 10 });
    texto('The Shorts, completo en YouTube', 50, 1125, { peso: 500, color: '#f2e6cc', sep: 1 });
  } else {
    if (t < T.suena) pentagrama(t);
    else if (t < T.rompe) {
      franjasClub(t);
      sombra(790, 1020, .62 * Math.max(tramo(t, T.frase1, T.frase2 - .1), tramo(t, T.frase2, T.cierra - .1)));
      texto('Detrás de nuestros videos,', 62, 880, { alfa: tramo(t, T.frase1, T.frase2 - .1), sep: .5 });
      texto('algo suena.', 62, 960, { alfa: tramo(t, T.frase1 + .55, T.frase2 - .1), sep: .5 });
      texto('Ya lo escuchaste.', 72, 930, { alfa: tramo(t, T.frase2, T.cierra - .1), sep: .5 });
      const a = tramo(t, T.cierra + .15, T.rompe + .02, .5, .08);
      if (a > 0) { x.globalAlpha = a; x.drawImage(img.escudo, W / 2 - 50, 790, 100, 100 * img.escudo.naturalHeight / img.escudo.naturalWidth); x.globalAlpha = 1; texto('TOP SECRET PRESENTA', 46, 985, { peso: 600, sep: 10, color: '#e7d3a3', alfa: a }); }
    } else if (t < T.muro) {
      disco(t);
      const u = t - T.rompe, s = 26 * (1 - sale(u / 1.8)) + 10;
      sombra(800, 1120, .42 * sat(u / .3) * (1 - sat((t - T.muro + .45) / .4)));
      texto('TACET SIN', 210, 960, { peso: 700, sep: s, alfa: sat((u - .1) / .35) * (1 - sat((t - T.muro + .45) / .4)) });
      letra(t, 1070, 46, 1 - sat((t - T.muro + .4) / .35));
      const f = sat((t - T.muro + .5) / .5); if (f > 0) { x.fillStyle = `rgba(4,3,2,${f})`; x.fillRect(0, 0, W, H); }
    } else {
      muro(t);
      const g = x.createLinearGradient(0, 560, 0, 1300); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.28, 'rgba(0,0,0,.5)'); g.addColorStop(.72, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.globalAlpha = 1; x.fillRect(0, 0, W, H);
      if (t < T.cierre) {
        const u = t - T.muro, sal = 1 - sat((t - T.cierre + .35) / .35);
        texto('THE SHORTS', 146, 860, { peso: 700, sep: 8, alfa: sat(u / .5) * sal });
        texto('23 temas. Cada uno, un momento.', 48, 945, { peso: 500, color: '#f2e6cc', alfa: sat((u - .4) / .5) * sal, sep: .5 });
        letra(t, 1060, 38, sal * .9);
        const i = temaActivo(t);
        if (D.temas[i]) texto(D.temas[i].titulo.toUpperCase(), 60, 1165, { peso: 700, sep: 3, color: '#e9c67a', alfa: sal });
      } else {
        const u = t - T.cierre, e = sale((u - .25) / .7), tam = 410;
        x.globalAlpha = e;
        x.drawImage(img.tapa1, W / 2 - tam - 14, 470 + (1 - e) * 40, tam, tam);
        x.drawImage(img.tapa2, W / 2 + 14, 470 - (1 - e) * 40, tam, tam);
        x.globalAlpha = 1;
        texto('The Shorts', 56, 1000, { peso: 500, color: '#e7d3a3', sep: 3, alfa: sat((u - .5) / .5) });
        texto('COMPLETO EN YOUTUBE', 106, 1118, { peso: 700, sep: 2, alfa: sat((u - .7) / .5) });
        texto('youtube.com/@tacetsin', 66, 1208, { peso: 600, color: '#e9c67a', sep: 1, alfa: sat((u - 1.05) / .5) });
        const a = sat((u - 1.5) / .5);
        if (a > 0) { x.globalAlpha = a; x.drawImage(img.escudo, W / 2 - 34, 1290, 68, 68 * img.escudo.naturalHeight / img.escudo.naturalWidth); x.globalAlpha = 1; }
      }
    }
    if (t >= T.suena) suena(t);
  }
  // Grano y viñeta: la materia del disco en toda la pieza
  x.save(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .13;
  x.drawImage(ruido[Math.floor(t * 24) % 3], -(Math.floor(t * 24) * 37 % 40), 0, W + 40, H); x.restore();
  const v = x.createRadialGradient(W / 2, H / 2, 620, W / 2, H / 2, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.5)');
  x.globalAlpha = 1; x.fillStyle = v; x.fillRect(0, 0, W, H);
  if (!o.portada) { const f = Math.max(sat((t - T.fin + .35) / .35)); if (f > 0) { x.fillStyle = `rgba(0,0,0,${f})`; x.fillRect(0, 0, W, H); } }
}
</script></body></html>
