<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Carrusel de psicología del deporte (habla el club): portada con gancho, un error por placa con
     "Qué pasa" / "Qué hacer", la prueba real del club y el cierre para guardar y compartir.
     pintar(D, 'post') / mostrar(n, t). -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0907;--card:#15120B;--gold:#C9A84C;--gold2:#E6CF85;--text:#F4EFE0;--text2:rgba(244,239,224,.66);--line:rgba(201,168,76,.26);--loss:#E0645A;--win:#3ECF8E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Barlow,sans-serif}
.escena{position:absolute;inset:0;display:none}
.escena.ver{display:block}
.fondo{position:absolute;inset:0;background:radial-gradient(110% 60% at 85% 0%,rgba(201,168,76,.15),transparent 60%),var(--bg)}
.marca{position:absolute;top:56px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;font:700 22px 'Barlow Condensed';letter-spacing:.24em;text-transform:uppercase;color:var(--text2)}
.marca img{height:56px}
.pie{position:absolute;bottom:54px;left:72px;right:72px;display:flex;justify-content:space-between;font:700 20px 'Barlow Condensed';letter-spacing:.2em;text-transform:uppercase;color:var(--text2)}
.pie b{color:var(--gold)}
.cont{position:absolute;left:72px;right:72px;top:170px}
.kicker{font:800 26px 'Barlow Condensed';letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.t{font:400 128px/.88 'Bebas Neue';margin-top:14px}
.t em{font-style:normal;color:var(--gold)}
.num{position:absolute;right:40px;top:110px;font:400 420px/.8 'Bebas Neue';color:rgba(201,168,76,.10)}
.bloque{margin-top:52px;padding:34px 36px;background:var(--card);border-left:4px solid var(--line);border-radius:4px}
.bloque.hacer{border-left-color:var(--gold)}
.bloque h4{font:800 22px 'Barlow Condensed';letter-spacing:.24em;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.bloque.hacer h4{color:var(--gold)}
.bloque p{font:500 40px/1.34 Barlow}
.bloque p strong{color:var(--gold2);font-weight:700}
.jug{position:absolute;bottom:-30px;right:-90px;height:900px;opacity:.95;filter:drop-shadow(0 0 40px rgba(201,168,76,.18))}
.sombra{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,var(--bg) 85%)}
.marcador{display:flex;flex-direction:column;gap:22px;margin-top:46px}
.marcador div{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);font:800 38px 'Barlow Condensed';text-transform:uppercase}
.marcador b{font:400 84px/1 'Bebas Neue'}
.marcador .D b{color:var(--loss)} .marcador .V b{color:var(--win)}
.cta{margin-top:60px;font:600 40px/1.35 Barlow;max-width:600px}
.cta b{color:var(--gold)}
</style>
</head>
<body>
<div id="lienzo"></div>
<script>
let ESC = [];
function pintar(D) {
  const L = document.getElementById('lienzo'); L.innerHTML = '';
  const total = D.errores.length + 3;
  const marca = `<div class="marca"><span>${D.serie}</span><img src="${D.escudo}"></div>`;
  const pie = i => `<div class="pie"><span>Top Secret FC</span><span><b>${String(i + 1).padStart(2, '0')}</b> / ${String(total).padStart(2, '0')}</span></div>`;
  const h = [];
  h.push(`<section class="escena"><div class="fondo"></div><img class="jug" src="${D.portada.img}" style="height:1240px;right:-250px;bottom:-60px"><div class="sombra" style="height:30%"></div>${marca}
    <div class="cont" style="top:auto;bottom:150px;right:auto;max-width:620px"><div class="kicker">${D.portada.kicker}</div><div class="t" style="font-size:150px;text-shadow:0 6px 30px rgba(0,0,0,.8)">${D.portada.titulo}</div></div>${pie(0)}</section>`);
  D.errores.forEach((e, i) => h.push(`<section class="escena"><div class="fondo"></div><div class="num">0${i + 1}</div>${marca}
    <div class="cont"><div class="kicker">Error ${i + 1}</div><div class="t">${e.titulo}</div>
      <div class="bloque"><h4>Qué pasa</h4><p>${e.pasa}</p></div>
      <div class="bloque hacer"><h4>Qué hacer</h4><p>${e.hacer}</p></div></div>${pie(i + 1)}</section>`));
  h.push(`<section class="escena"><div class="fondo"></div>${marca}
    <div class="cont"><div class="kicker">${D.prueba.kicker}</div><div class="t">${D.prueba.titulo}</div>
      <div class="marcador">${D.prueba.partidos.map(p => `<div class="${p.res}"><span>${p.rival}</span><b>${p.score}</b></div>`).join('')}</div>
      <div class="cta" style="margin-top:44px;font-size:34px;color:var(--text2)">${D.prueba.texto}</div></div>${pie(total - 2)}</section>`);
  h.push(`<section class="escena"><div class="fondo"></div><img class="jug" src="${D.cierre.img}" style="right:-140px;opacity:.55"><div class="sombra"></div>${marca}
    <div class="cont"><div class="kicker">${D.cierre.kicker}</div><div class="t">${D.cierre.titulo}</div><div class="cta">${D.cierre.texto}</div></div>${pie(total - 1)}</section>`);
  L.innerHTML = h.join('');
  ESC = [...L.querySelectorAll('.escena')];
  return ESC.length;
}
function mostrar(n) { ESC.forEach((e, i) => e.classList.toggle('ver', i === n)); }
</script>
</body>
</html>
