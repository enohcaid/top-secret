<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- "Mismo jugador, 4 temporadas" con números: las 4 versiones del jugador en fila; cada una pasa al frente con sus
     estadísticas reales de esa temporada (contador que sube) y el fondo toma el color de su kit; después se revela
     la mejor temporada y cierra con la votación 1-2-3-4. Distinto del antes y después de cortes (Juan, 2026-10-15:
     "que tenga cosas diferentes, si es todo igual no llama la atención").
     datos = { jugador, gancho, versiones: [{ img, n, color, stats: [[k, v, dec]] }], mejor, mejorTxt, pregunta, escudo,
     tiempos: { fila, pasos: [t…], mejor, fin } }. mostrar(0, t) → tl.seek(t). -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800&family=Barlow+Condensed:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="../../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{--bg:#0A0907;--gold:#C9A84C;--gold2:#F1DC97;--text:#F4EFE0;--text2:rgba(244,239,224,.7)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);overflow:hidden}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text)}
#fondo{position:absolute;inset:0}
#fondo div{position:absolute;inset:0;opacity:0}
#grano{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 60%,transparent 40%,rgba(0,0,0,.75))}
#gancho{position:absolute;left:70px;right:70px;top:170px;z-index:6;font:400 128px/.92 'Bebas Neue'}
#gancho span{color:var(--gold)}
#fila{position:absolute;left:0;right:0;bottom:200px;height:980px;z-index:3}
.v{position:absolute;bottom:0;width:250px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transform-origin:50% 100%}
.v img{height:840px;width:auto;max-width:none;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.v b{font:400 84px/1 'Bebas Neue';color:var(--gold);margin-top:10px;text-shadow:0 4px 20px #000}
#ficha{position:absolute;left:70px;right:70px;top:430px;z-index:7;opacity:0}
#ficha h3{font:800 38px 'Barlow Condensed';letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
#ficha .st{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
#ficha .st div{background:rgba(10,9,7,.82);border-top:5px solid var(--gold);padding:16px 10px 12px;text-align:center}
#ficha .st i{display:block;font:normal 400 96px/1 'Bebas Neue'}
#ficha .st small{font:800 26px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
#corona{position:absolute;z-index:8;font:400 70px/1 'Bebas Neue';color:#0A0907;background:var(--gold);padding:10px 22px 4px;opacity:0;white-space:nowrap;transform:translateX(-50%)}
#mejor{position:absolute;left:70px;right:70px;top:430px;z-index:7;opacity:0}
#mejor p{font:800 58px/1.2 Barlow}
#mejor p b{color:var(--gold2)}
#pregunta{position:absolute;left:60px;right:60px;top:200px;z-index:9;text-align:center;opacity:0}
#pregunta h2{font:400 150px/.9 'Bebas Neue'}
#pregunta p{font:800 46px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:18px}
#escudo{position:absolute;right:56px;top:60px;height:80px;z-index:9}
#flash{position:absolute;inset:0;background:#FFF5DA;opacity:0;z-index:20}
</style>
</head>
<body>
<div id="lienzo">
  <div id="fondo"></div><div id="grano"></div>
  <img id="escudo">
  <div id="gancho"></div>
  <div id="fila"></div>
  <div id="ficha"><h3></h3><div class="st"></div></div>
  <div id="corona">La mejor</div>
  <div id="mejor"><p></p></div>
  <div id="pregunta"><h2></h2><p></p></div>
  <div id="flash"></div>
</div>
<script>
const $ = s => document.querySelector(s);
let D, tl, X = [], paso;
async function pintar(datos) {
  D = datos;
  await document.fonts.ready;
  const T = D.tiempos;
  paso = T.pasos[1] - T.pasos[0];
  $('#escudo').src = D.escudo;
  $('#gancho').innerHTML = D.gancho;
  $('#mejor p').innerHTML = D.mejorTxt;
  $('#pregunta h2').innerHTML = D.pregunta; $('#pregunta p').textContent = '1 · 2 · 3 · 4 — comentalo';
  $('#fondo').innerHTML = D.versiones.map(v => `<div style="background:radial-gradient(85% 60% at 50% 60%,${v.color} 0%,${v.color}66 38%,#0A0907 78%)"></div>`).join('');
  $('#fila').innerHTML = D.versiones.map(v => `<div class="v"><img src="${v.img}"><b>${v.n}</b></div>`).join('');
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const vs = [...document.querySelectorAll('.v')], fondos = [...document.querySelectorAll('#fondo div')];
  X = vs.map((el, i) => { const x = 30 + i * 255; el.style.left = x + 'px'; return x; });
  tl = gsap.timeline({ paused: true });
  // gancho y fila
  tl.from('#gancho', { y: 60, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.1);
  vs.forEach((el, i) => tl.from(el, { y: 1100, duration: 0.55, ease: 'back.out(1.3)' }, T.fila + i * 0.12));
  tl.to('#gancho', { opacity: 0, y: -40, duration: 0.35 }, T.pasos[0] - 0.3);
  // una por una al frente con sus números
  D.versiones.forEach((v, i) => {
    const t = T.pasos[i], fin = t + paso;
    tl.fromTo(fondos[i], { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, t);
    if (i) tl.to(fondos[i - 1], { opacity: 0, duration: 0.4 }, t);
    vs.forEach((o, k) => { if (k !== i) tl.to(o, { opacity: 0.25, scale: 0.92, filter: 'grayscale(1)', duration: 0.3 }, t); });
    tl.to(vs[i], { opacity: 1, scale: 1.18, filter: 'grayscale(0)', x: 540 - (X[i] + 125), duration: 0.45, ease: 'expo.out' }, t);
    tl.fromTo('#flash', { opacity: 0.25 }, { opacity: 0, duration: 0.3, immediateRender: false }, t);
    tl.fromTo('#ficha', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out', immediateRender: false }, t + 0.15);
    tl.to('#ficha', { opacity: 0, duration: 0.2 }, fin - 0.25);
    tl.to(vs[i], { scale: 1, x: 0, duration: 0.35, ease: 'power2.inOut' }, fin - 0.3);
  });
  // la mejor
  const m = D.mejor - 1;
  tl.to(fondos[D.versiones.length - 1], { opacity: 0, duration: 0.3 }, T.mejor);
  tl.to(fondos[m], { opacity: 1, duration: 0.4 }, T.mejor);
  vs.forEach((o, k) => tl.to(o, { opacity: k === m ? 1 : 0.3, scale: k === m ? 1.12 : 0.95, filter: k === m ? 'grayscale(0)' : 'grayscale(1)', duration: 0.4 }, T.mejor));
  tl.set('#corona', { left: X[m] + 125, top: 1920 - 200 - 980 * 0.93 - 40 }, T.mejor);
  tl.fromTo('#corona', { opacity: 0, y: -60, scale: 1.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(2)', immediateRender: false }, T.mejor + 0.2);
  tl.fromTo('#flash', { opacity: 0.5 }, { opacity: 0, duration: 0.4, immediateRender: false }, T.mejor + 0.2);
  tl.fromTo('#mejor', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, T.mejor + 0.5);
  tl.to('#mejor, #corona', { opacity: 0, duration: 0.3 }, T.fin - 0.3);
  // votación
  vs.forEach(o => tl.to(o, { opacity: 1, scale: 1, filter: 'grayscale(0)', duration: 0.4 }, T.fin));
  tl.to(fondos[m], { opacity: 0.5, duration: 0.4 }, T.fin);
  tl.fromTo('#pregunta', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out', immediateRender: false }, T.fin + 0.1);
  vs.forEach((o, k) => tl.fromTo(o.querySelector('b'), { scale: 1 }, { scale: 1.5, duration: 0.18, yoyo: true, repeat: 1, immediateRender: false }, T.fin + 0.7 + k * 0.25));
  return 1;
}
// Ficha de la temporada al frente (con contadores que suben)
function ficha(t) {
  const T = D.tiempos, i = T.pasos.findIndex((p, k) => t >= p && t < p + paso);
  if (i < 0) return;
  const v = D.versiones[i], f = Math.min(1, (t - T.pasos[i] - 0.15) / 0.9), e = 1 - Math.pow(1 - Math.max(0, f), 3);
  $('#ficha h3').textContent = `Temporada ${v.n}`;
  $('#ficha .st').innerHTML = v.stats.map(([k, val, dec]) => `<div><i>${(val * e).toFixed(dec || 0)}</i><small>${k}</small></div>`).join('');
}
async function mostrar(n, t = 0) { tl.seek(t, true); ficha(t); }
</script>
</body>
</html>
