<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Overlay vivo</title>
<!-- Overlay del vivo (fuente de navegador de OBS, 1920×1080, fondo transparente).
     Mismo lenguaje que el compilado de goles (scripts/goles/compilado.cjs), pero en vivo:
     - arriba a la izquierda queda el marcador de FC27 a la vista, con el torneo al lado;
     - arriba a la derecha tapa el panel fijo de quien transmite (club + canales);
     - abajo NO se tapa nada: las dos barras de FC27 dicen qué jugador de cada equipo tiene la pelota
       (la nuestra va a la izquierda o a la derecha según quién es local y el tiempo);
     - el "palco" (clip de un jugador + placa) aparece a la derecha, justo encima de la barra, solo mientras dura el clip.
     Parámetros: ?torneo=…&rival=…&escudo=<url>  ·  ?demo=clip|gol (vistas fijas para revisar) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;500;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--oro:#C8A84B;--fondo:#0B0A07;--fondo2:#17140d;--texto:#F2EEE0;--texto2:rgba(242,238,224,.62);--borde:rgba(200,168,75,.35);--rojo:#E5484D}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Barlow,sans-serif;color:var(--texto)}
.p{position:absolute;background:linear-gradient(180deg,var(--fondo2),var(--fondo));border:1px solid var(--borde);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mono{font-family:'JetBrains Mono';font-weight:700;letter-spacing:.18em;color:var(--oro)}

/* Torneo, al lado del marcador de FC27 (que termina en x≈300 a 1080p) */
.torneo{left:318px;top:52px;height:84px;padding:0 22px 0 16px;display:flex;align-items:center;gap:16px;border-radius:14px}
.torneo img{height:52px;width:52px;object-fit:contain}
.torneo .k{font-size:14px}.torneo .r{font-weight:800;font-size:27px;line-height:1.05;margin-top:3px;white-space:nowrap}

/* Club, tapando el panel de quien transmite */
.club{left:1377px;top:27px;width:516px;height:144px;display:flex;align-items:center;gap:20px;padding:0 26px}
.club img{height:92px}
.club .a{font-weight:900;font-size:32px;letter-spacing:.05em}
.club .vivo{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--texto);margin-top:8px}
.club .vivo i{width:11px;height:11px;border-radius:50%;background:var(--rojo);animation:late 1.6s ease-in-out infinite}
.club .canales{font-family:'JetBrains Mono';font-size:13px;letter-spacing:.12em;color:var(--texto2);margin-top:6px}
@keyframes late{50%{opacity:.25}}

/* Palco: clip del jugador que asoma por detrás de una placa, encima de la barra derecha de FC27 (y≈960) */
.palco{position:absolute;left:1400px;top:500px;width:490px;height:428px}
.palco .vid{position:absolute;left:50%;bottom:70px;width:560px;height:560px;transform:translate(-50%,0);opacity:0;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
.palco.on .vid{opacity:1}
.palco:not(.on) .vid{transform:translate(-50%,40px)}
.palco video{width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.palco .placa{left:0;right:0;bottom:0;height:110px;display:flex;align-items:center;gap:18px;padding:0 26px;opacity:0;transform:translateY(16px);transition:opacity .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.palco.on .placa{opacity:1;transform:none}
.palco .placa img{height:74px}
.palco .num{font-family:'Bebas Neue';font-size:76px;line-height:.85;color:var(--oro)}
.palco .gt{font-weight:900;font-size:34px;letter-spacing:-.02em;line-height:1}
.palco .dice{font-size:15px;margin-top:6px}
.palco .jug{display:flex;align-items:center;gap:18px}

/* Gol: franja que cruza la pantalla en el tercio de abajo (sin tapar la barra de posesión) */
.gol{position:absolute;left:0;right:0;top:700px;height:190px;display:flex;align-items:center;justify-content:center;gap:40px;
  background:linear-gradient(90deg,transparent,rgba(11,10,7,.92) 18%,rgba(11,10,7,.92) 82%,transparent);border-block:2px solid var(--oro);
  clip-path:inset(0 50% 0 50%);transition:clip-path .45s cubic-bezier(.7,0,.2,1)}
.gol.on{clip-path:inset(0 0 0 0)}
.gol img{height:130px}
.gol .t{font-family:'Bebas Neue';font-size:168px;line-height:.8;letter-spacing:.02em;color:var(--oro)}
.gol .s{font-family:'JetBrains Mono';font-weight:700;font-size:22px;letter-spacing:.3em;margin-top:8px}
</style></head><body>

<div class="p torneo" id="torneo" hidden>
  <img id="escudo" alt="">
  <div><div class="mono k" id="torneoTxt"></div><div class="r" id="rivalTxt"></div></div>
</div>

<div class="p club">
  <img src="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/badge-metal.webp" alt="">
  <div><div class="a">TOP SECRET FC</div><div class="vivo"><i></i>EN VIVO</div><div class="canales">TWITCH · KICK · YOUTUBE</div></div>
</div>

<div class="palco" id="palco">
  <div class="vid"><video id="video" muted playsinline></video></div>
  <div class="p placa">
    <div class="jug"><span class="num" id="num"></span><div><div class="gt" id="gt"></div><div class="mono dice" id="dice"></div></div></div>
  </div>
</div>

<div class="gol" id="gol">
  <img src="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/clean-dorado.webp" alt="">
  <div><div class="t">GOOOL</div><div class="s">DE TOP SECRET FC</div></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const CLIPS = q.get('clips') || '../../fuentes/stream/clips/';
const DICE = { gol: 'GRITO DE GOL', festejo: 'FESTEJA', frustrado: 'SE LAMENTA', triste: 'SE LAMENTA', habla: 'HABLA', aliento: 'ALIENTA' };

if (q.get('torneo')) {
  torneo.hidden = false; torneoTxt.textContent = q.get('torneo'); rivalTxt.textContent = q.get('rival') ? 'vs ' + q.get('rival') : '';
  if (q.get('escudo')) escudo.src = q.get('escudo'); else escudo.remove();
}

// Muestra un clip en el palco: {gt, num, emocion}
function clip({ gt, num, emocion }) {
  return new Promise(ok => {
    document.getElementById('gt').textContent = gt; document.getElementById('num').textContent = num || '';
    dice.textContent = DICE[emocion] || '';
    video.src = `${CLIPS}${gt}/${emocion}.webm`;
    video.onended = () => { palco.classList.remove('on'); setTimeout(ok, 500); };
    video.onerror = () => ok();
    video.play().then(() => palco.classList.add('on')).catch(() => ok());
  });
}
function gol(ms = 6000) { document.getElementById('gol').classList.add('on'); setTimeout(() => document.getElementById('gol').classList.remove('on'), ms); }
window.overlay = { clip, gol };

// Vistas fijas para revisar el diseño
if (q.get('demo') === 'clip') { palco.classList.add('on'); document.getElementById('gt').textContent = q.get('gt') || 'Juan_Martinez4'; num.textContent = q.get('num') || '6'; dice.textContent = DICE[q.get('emocion') || 'gol'];
  video.src = `${CLIPS}${document.getElementById('gt').textContent}/${q.get('emocion') || 'gol'}.webm`; video.currentTime = +(q.get('t') || 2.5); if (q.has('sinvideo')) video.style.visibility = 'hidden'; }
if (q.get('demo') === 'gol') document.getElementById('gol').classList.add('on');
</script>
</body></html>
