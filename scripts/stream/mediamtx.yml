# Servidor RTMP local para el vivo con overlay: OBS publica en rtmp://127.0.0.1:1935/live/ts y
# retransmitir.mjs lo toma de ahí y lo reparte (Twitch topsecretfc, Kick, YouTube). Solo escucha en la PC.
logLevel: warn
# Cola por lector: si la subida se traba unos segundos, ffmpeg (lector) se atrasa; con la default (512) MediaMTX
# lo cortaba cada 20-40 s (2026-10-19). Potencia de 2.
writeQueueSize: 8192
# Si ffmpeg deja de leer (una red se traba al subir), MediaMTX lo cortaba a los 10 s (default) aunque la cola tuviera
# lugar: cortes de la salida cada 4-10 min el 2026-10-19 con OBS transmitiendo sin problemas. 30 s absorbe los bajones.
writeTimeout: 30s
rtsp: no
rtmp: yes
rtmpAddress: 127.0.0.1:1935
hls: no
webrtc: no
srt: no
api: no
moq: no
paths:
  all_others:
