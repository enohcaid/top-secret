<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacet Sin · Music</title>
<!-- Música propia del club (pedido de Juan, 2026-10-23: "subí los temas a una página en nuestro dominio, /music").
     GitHub Pages sirve topsecret.ar/music desde este archivo. Los datos salen del catálogo público que arma
     scripts/beats/cantar.mjs (R2 musica/catalogo.json): título, concepto, tempo, tonalidad, letra (inglés),
     versión con voz e instrumental. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Top Secret FC">
<meta property="og:title" content="Tacet Sin · Top Secret FC">
<meta property="og:description" content="Tacet Sin, el proyecto musical de Top Secret FC: The Shorts y Thrive.">
<meta property="og:url" content="https://topsecret.ar/music">
<link rel="icon" type="image/png" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/favicon-64.png">
<link rel="apple-touch-icon" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/rebrand/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A07; --card:#16130B; --card2:#1D1910;
  --gold:#C9A84C; --gold2:#E8C97A;
  --text:#F2EEE0; --text2:rgba(242,238,224,.66); --mid:rgba(242,238,224,.44); --border:rgba(242,238,224,.08);
  --topbar:64px; --gutter:clamp(16px,3vw,40px); --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Barlow,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:calc(var(--topbar) + 56px) var(--gutter) 90px}
.kicker{font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.24em;color:var(--gold)}
h1{font-weight:900;font-size:clamp(3.2rem,9vw,6.4rem);line-height:.92;letter-spacing:-.04em;margin-top:14px}
/* encabezado de artista, como un perfil de Spotify: foto circular + "Artista" + nombre */
.artista{display:flex;align-items:center;gap:clamp(18px,3.5vw,40px);margin-top:20px}
.artista-foto{width:clamp(120px,20vw,220px);height:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.artista-tipo{font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.22em;color:var(--text2);text-transform:uppercase}
.artista h1{margin-top:6px}
.lead{max-width:640px;margin-top:18px;font-size:1.12rem;line-height:1.55;color:var(--text2)}
.lista{margin-top:48px;display:flex;flex-direction:column;gap:14px}
.album{border-top:1px solid var(--border);padding-top:28px;margin-top:28px}
.album:first-child{margin-top:0}
.album-cab{display:grid;grid-template-columns:clamp(140px,22vw,220px) 1fr;gap:clamp(18px,3vw,34px);align-items:end}
.album-toggle{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.album-toggle > span:first-child > span{display:block}
.album-toggle:focus-visible,.tapa:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:14px}
.flecha{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;color:var(--text2);align-self:center;transition:transform .25s ease,border-color .2s ease,color .2s ease}
.flecha svg{width:18px;height:18px}
.album-toggle:hover .flecha{border-color:var(--gold);color:var(--gold)}
.album.abierto .flecha{transform:rotate(180deg)}
.album .temas{display:none}
.album.abierto .temas{display:flex;margin-top:22px}
.tapa{aspect-ratio:1;width:100%;border:0;padding:0;border-radius:14px;background:var(--card2) center/cover no-repeat;box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:zoom-in;transition:transform .2s ease}
.tapa:hover{transform:scale(1.02)}
/* tapa en grande */
.visor{position:fixed;inset:0;z-index:2000;background:rgba(5,4,2,.92);display:none;place-items:center;padding:24px;cursor:zoom-out}
.visor.on{display:grid}
.visor img{max-width:min(92vw,1400px);max-height:84vh;width:auto;height:auto;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.visor figcaption{margin-top:14px;text-align:center;font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:var(--text2);text-transform:uppercase}
.visor button{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:1.4rem;cursor:pointer}
.album-tipo{font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.album-titulo{font-weight:900;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:.95;letter-spacing:-.035em;margin-top:8px}
.album-titulo small{display:block;font-size:.38em;letter-spacing:.02em;color:var(--text2);font-weight:700;margin-top:6px}
.album-desc{margin-top:12px;color:var(--text2);line-height:1.5;max-width:560px}
.album-meta{margin-top:10px;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.temas{display:flex;flex-direction:column;gap:12px}
.pista{font-family:var(--mono);font-weight:700;color:var(--mid);margin-right:10px;font-size:.9rem}
.tema{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;transition:border-color .2s ease,background-color .2s ease}
.tema.sonando{border-color:rgba(201,168,76,.55);background:var(--card2)}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);color:#0B0A07;display:grid;place-items:center;cursor:pointer;transition:transform .15s ease}
.play:hover{transform:scale(1.06)}
.play[disabled]{opacity:.3;cursor:default;transform:none}
.play svg{width:24px;height:24px}
.info{min-width:0}
.titulo{font-weight:900;font-size:1.6rem;letter-spacing:-.02em;line-height:1.05}
.meta{margin-top:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.meta b{color:var(--gold2);font-weight:700}
.concepto{margin-top:8px;color:var(--text2);font-size:.98rem;line-height:1.45}
.acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--border);background:transparent;color:var(--text2);font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.16em;padding:9px 14px;border-radius:999px;cursor:pointer;text-transform:uppercase;transition:border-color .2s ease,color .2s ease}
.chip:hover,.chip.on{border-color:var(--gold);color:var(--gold)}
.chip[disabled]{opacity:.35;cursor:default}
.barra{grid-column:1/-1;height:4px;border-radius:4px;background:rgba(242,238,224,.08);overflow:hidden;cursor:pointer;display:none}
.tema.sonando .barra{display:block}
.barra i{display:block;height:100%;width:0;background:var(--gold)}
.letra{grid-column:1/-1;display:none;white-space:pre-line;font-size:1.02rem;line-height:1.7;color:var(--text);padding:6px 0 4px 84px;columns:2 300px;column-gap:40px}
.letra .sec{font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.22em;color:var(--gold);display:block;margin-top:14px;break-after:avoid}
.tema.con-letra .letra{display:block}
.pend{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
.vacio{margin-top:40px;color:var(--mid)}
@media (max-width:700px){
  .tema{grid-template-columns:52px 1fr;gap:14px;padding:18px}
  .play{width:52px;height:52px}
  .acciones{grid-column:1/-1;justify-content:flex-start}
  .letra{padding-left:0;columns:1}
  .titulo{font-size:1.35rem}
  .album-cab{grid-template-columns:96px 1fr;gap:14px;align-items:center}
  .album-toggle{align-items:center}
  .album-toggle > span:first-child > .album-desc{display:none}
  .flecha{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">TOP SECRET FC · MUSIC</div>
  <div class="artista">
    <img class="artista-foto" src="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/musica/artista/perfil-web.webp" alt="Tacet Sin" width="600" height="600">
    <div>
      <div class="artista-tipo">Artista</div>
      <h1 id="artista">Tacet Sin</h1>
    </div>
  </div>
  <p class="lead">El proyecto musical de Top Secret. Cada tema nace de algo que cualquiera vivió alguna vez: lo que nos empuja, lo que nos duele y lo que no podemos dejar de querer.</p>
  <div class="lista" id="lista"><div class="vacio">Cargando…</div></div>
</div>
<audio id="audio" preload="none"></audio>
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Portada"><figure><img id="visor-img" alt=""><figcaption id="visor-txt"></figcaption></figure><button type="button" aria-label="Cerrar">×</button></div>
<script>
const CATALOGO = 'https://top-secret-proxy.juan-c-m-1985.workers.dev/media/musica/catalogo.json';
const PLAY = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>';
const PAUSA = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const audio = document.getElementById('audio');
const FLECHA = '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M6 9l6 6 6-6"/></svg>';
let temas = [], albumes = [], actual = null, artista = 'Tacet Sin';
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// etiquetas de sección: [verse], [chorus - male &amp; female]… (en Thrive dicen quién canta)
const QUIEN = { 'male': 'él', 'female': 'ella', 'male & female': 'los dos', 'female & male': 'los dos', 'both': 'los dos' };
const letraHtml = l => esc(l).replace(/^\[(verse|chorus|intro|outro|pre-chorus|bridge)(?:\s*-\s*([^\]]+))?\][ \t]*\r?\n?/gim, (_, s, q) => {
  const quien = q && (QUIEN[q.replace(/&amp;/g, '&').trim().toLowerCase()] || q.trim());
  return `<span class="sec">${s.toUpperCase()}${quien ? ' · ' + quien.toUpperCase() : ''}</span>`;
}).replace(/\n{2,}/g, '\n');
// Solo se publica la versión final (con voz): las instrumentales dejaron de estar disponibles (Juan, 2026-10-26)
const fuente = t => t.voz;
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fechaLarga = f => { const [y, m, d] = f.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
const claveAlbum = al => al.id + (al.volumen ? '-' + al.volumen : '');
// álbumes abiertos: preferencia de cada visitante (si el navegador no deja guardar, arrancan cerrados)
const abiertos = new Set((() => { try { return JSON.parse(localStorage.getItem('music-abiertos') || '[]'); } catch { return []; } })());
const guardarAbiertos = () => { try { localStorage.setItem('music-abiertos', JSON.stringify([...abiertos])); } catch {} };

const mmss = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';
const temaHtml = t => `
    <div class="tema" id="t-${t.slug}">
      <button class="play" aria-label="Reproducir ${esc(t.titulo)}" data-play="${t.slug}"${t.voz ? '' : ' disabled title="Audio en camino"'}>${PLAY}</button>
      <div class="info">
        <div class="titulo"><span class="pista">${String(t.pista || '').padStart(2, '0')}</span>${esc(t.titulo)}</div>
        <div class="meta">${[t.fecha, t.bpm && `<b>${t.bpm}</b> BPM`, t.tonalidad, mmss(t.duracion)].filter(Boolean).join(' · ')}</div>
        <div class="concepto">${esc(t.concepto)}</div>
      </div>
      <div class="acciones">
        ${t.voz ? '' : '<span class="pend">Audio en camino</span>'}
        ${t.letra ? `<button class="chip" data-letra="${t.slug}">Letra</button>` : ''}
      </div>
      <div class="barra" data-barra="${t.slug}"><i></i></div>
      ${t.letra ? `<div class="letra">${letraHtml(t.letra)}</div>` : ''}
    </div>`;

function pintar() {
  const lista = document.getElementById('lista');
  if (!temas.length) { lista.innerHTML = '<div class="vacio">Pronto.</div>'; return; }
  lista.innerHTML = albumes.map(al => {
    const ts = temasDe(al), clave = claveAlbum(al);
    const vol = al.volumen ? `<small>Vol. ${al.volumen}</small>` : '';
    const meta = [al.lanzamiento && `Lanzamiento ${fechaLarga(al.lanzamiento)}`, ts.length ? `${ts.length} tema${ts.length > 1 ? 's' : ''}` : 'El primer tema llega esta noche'].filter(Boolean).join(' · ');
    return `
    <section class="album${abiertos.has(clave) ? ' abierto' : ''}" id="a-${clave}">
      <div class="album-cab">
        <button class="tapa" data-tapa="${esc(al.portada)}" data-titulo="${esc(al.titulo + (al.volumen ? ' · Vol. ' + al.volumen : ''))}" aria-label="Ver la portada de ${esc(al.titulo)} en grande" style="background-image:url('${esc(al.portada)}')"></button>
        <button class="album-toggle" data-album="${clave}" aria-expanded="${abiertos.has(clave)}" aria-controls="temas-${clave}">
          <span>
            <span class="album-tipo">Álbum · ${esc(artista)}</span>
            <span class="album-titulo" role="heading" aria-level="2">${esc(al.titulo)}${vol}</span>
            <span class="album-desc">${esc(al.descripcion)}</span>
            <span class="album-meta">${meta}</span>
          </span>
          <span class="flecha" aria-hidden="true">${FLECHA}</span>
        </button>
      </div>
      <div class="temas" id="temas-${clave}">${ts.map(temaHtml).join('')}</div>
    </section>`;
  }).join('');
}
// tapa en grande: clic en la portada; se cierra con clic, Esc o la ×
let tapaOrigen = null;
function verTapa(b) {
  tapaOrigen = b;
  document.getElementById('visor-img').src = b.dataset.tapa;
  document.getElementById('visor-img').alt = 'Portada de ' + b.dataset.titulo;
  document.getElementById('visor-txt').textContent = artista + ' · ' + b.dataset.titulo;
  document.getElementById('visor').classList.add('on');
  document.querySelector('#visor button').focus();
}
function cerrarTapa() { document.getElementById('visor').classList.remove('on'); tapaOrigen?.focus(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarTapa(); });
const temasDe = al => temas.filter(t => t.album === al.id && (al.volumen == null || t.volumen === al.volumen));
function abrir(clave, abierto) {
  const el = document.getElementById('a-' + clave); if (!el) return;
  el.classList.toggle('abierto', abierto);
  el.querySelector('.album-toggle').setAttribute('aria-expanded', abierto);
  abierto ? abiertos.add(clave) : abiertos.delete(clave); guardarAbiertos();
}

function tocar(slug) {
  const t = temas.find(x => x.slug === slug); if (!t) return;
  const src = fuente(t); if (!src) return;
  if (actual === slug && !audio.paused) { audio.pause(); return; }
  if (actual !== slug || !audio.src.endsWith(src.split('/').pop())) { audio.src = src; }
  actual = slug; audio.play().catch(() => {});
  const al = albumes.find(a => a.id === t.album && (a.volumen == null || a.volumen === t.volumen));
  if (al) abrir(claveAlbum(al), true);       // al pasar al tema siguiente de otro disco, ese disco se despliega
}
function marcar() {
  document.querySelectorAll('.tema').forEach(el => {
    const s = el.id.slice(2), on = s === actual;
    el.classList.toggle('sonando', on);
    el.querySelector('.play').innerHTML = on && !audio.paused ? PAUSA : PLAY;
  });
}
audio.addEventListener('play', marcar); audio.addEventListener('pause', marcar);
audio.addEventListener('ended', () => {                   // sigue con el próximo tema
  const i = temas.findIndex(t => t.slug === actual);
  if (i >= 0 && i < temas.length - 1) tocar(temas[i + 1].slug); else marcar();
});
audio.addEventListener('timeupdate', () => {
  const b = actual && document.querySelector(`[data-barra="${actual}"] i`);
  if (b && audio.duration) b.style.width = (audio.currentTime / audio.duration * 100) + '%';
});
document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]'); if (p) return tocar(p.dataset.play);
  const tp = e.target.closest('[data-tapa]');
  if (tp) return verTapa(tp);
  if (e.target.closest('#visor')) return cerrarTapa();
  const a = e.target.closest('[data-album]');
  if (a) return abrir(a.dataset.album, !a.closest('.album').classList.contains('abierto'));
  const l = e.target.closest('[data-letra]');
  if (l) { const el = document.getElementById('t-' + l.dataset.letra); el.classList.toggle('con-letra'); l.classList.toggle('on'); return; }
  const b = e.target.closest('[data-barra]');
  if (b && b.dataset.barra === actual && audio.duration) { const r = b.getBoundingClientRect(); audio.currentTime = (e.clientX - r.left) / r.width * audio.duration; }
});

fetch(CATALOGO + '?' + Date.now()).then(r => r.json()).then(c => {
  albumes = c.albumes || [{ id: null, titulo: 'Temas', descripcion: '' }];
  artista = c.artista || artista;
  temas = (c.temas || []).map(t => c.albumes ? t : { ...t, album: null });
  // discos por orden de lanzamiento (la fecha del primer tema de cada uno); uno sin temas todavía va al final
  for (const al of albumes) al.lanzamiento = temasDe(al).map(t => t.fecha).filter(Boolean).sort()[0] || null;
  albumes.sort((a, b) => (a.lanzamiento || '9999') .localeCompare(b.lanzamiento || '9999'));
  // orden de reproducción = orden en pantalla: disco por disco, pista por pista
  const orden = t => albumes.findIndex(a => a.id === t.album && (a.volumen == null || a.volumen === t.volumen));
  temas.sort((a, b) => orden(a) - orden(b) || (a.pista || 0) - (b.pista || 0));
  pintar();
}).catch(() => { document.getElementById('lista').innerHTML = '<div class="vacio">No se pudo cargar la música. Probá de nuevo en un rato.</div>'; });
</script>
<script src="layout.js?v=25"></script>
</body>
</html>
