<link rel="preload" as="image" href="https://top-secret-proxy.juan-c-m-1985.workers.dev/media/logos/plantel-t4-mva70vd6.webp">
<style>
:root{
  --bg:#0B0A07;--card:#16130B;--card2:#1D1910;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.05);
  --text:#F2EEE0;--muted:rgba(242,238,224,.5);--muted2:rgba(242,238,224,.32);
  --gold:#C8A84B;--gold2:#E0C979;--gold-dim:rgba(200,168,75,.12);
  --win:#22C55E;--draw:#F59E0B;--loss:#EF4444;
  --vpn:#F5C518;--vpug:#3ECF8E;--e11:#4A9EFF;
  --ts-g:clamp(16px,3vw,40px);
}
/* derivados del tema activo (layout.js redefine los de arriba por tema) */
:root{
  --line:color-mix(in srgb,var(--text) 11%,transparent);
  --line2:color-mix(in srgb,var(--text) 6%,transparent);
  --track:color-mix(in srgb,var(--text) 9%,transparent);
  --ink2:color-mix(in srgb,var(--text) 62%,transparent);
  --bar-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:calc(64px + var(--bar-h) + 12px);}
html.panel-open{overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
img{display:block;max-width:100%;}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--ts-g);}
.c-win{color:var(--win)!important}.c-draw{color:var(--draw)!important}.c-loss{color:var(--loss)!important}.c-gold{color:var(--gold)!important}.c-vpug{color:var(--vpug)!important}
.muted{color:var(--muted);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
[data-count]{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px;}

/* ── controles ── */
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--gold);color:var(--bg);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:background-color .2s,color .2s,transform .2s;}
.pill:hover{background:var(--gold2);transform:translateY(-1px);}
.pill.ghost{background:none;color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}
.pill.ghost:hover{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold);}
.seg-group,#stSeasons{display:inline-flex;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);}
.seg{position:relative;padding:7px 15px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted);transition:color .2s,background-color .2s;white-space:nowrap;}
.seg:hover{color:var(--text);}
.seg.on{background:var(--gold);color:var(--bg);}
.seg .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 0 var(--win);animation:pulse 2s infinite;}
.seg.on .live{background:var(--bg);animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--win) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:999px;font-size:.74rem;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);transition:color .2s,box-shadow .2s,background-color .2s;white-space:nowrap;}
.chip:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--muted2);}
.chip.on{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--gold-dim);}
.chip.vpug.on{color:var(--vpug);box-shadow:inset 0 0 0 1px var(--vpug);background:color-mix(in srgb,var(--vpug) 10%,transparent);}
.chip.vpn.on{color:var(--vpn);box-shadow:inset 0 0 0 1px var(--vpn);background:color-mix(in srgb,var(--vpn) 10%,transparent);}
.chip.e11.on{color:var(--e11);box-shadow:inset 0 0 0 1px var(--e11);background:color-mix(in srgb,var(--e11) 10%,transparent);}
.lg{font-weight:700;letter-spacing:.04em;}
.lg.vpug{color:var(--vpug)}.lg.vpn{color:var(--vpn)}.lg.e11{color:var(--e11)}.lg.otro{color:var(--muted)}
.score{font-family:'Barlow Condensed',sans-serif;font-weight:800;}
.score.win{color:var(--win)}.score.draw{color:var(--draw)}.score.loss{color:var(--loss)}
.rpill{display:inline-block;min-width:36px;text-align:center;padding:2px 7px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;}
.rpill.r-hi{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win);}
.rpill.r-mid{background:var(--gold-dim);color:var(--gold);}
.rpill.r-lo{background:color-mix(in srgb,var(--loss) 15%,transparent);color:var(--loss);}
b.r-hi{color:var(--win)}b.r-mid{color:var(--gold)}b.r-lo{color:var(--loss)}
.ph{position:relative;display:block;overflow:hidden;background:radial-gradient(circle at 50% 35%,var(--gold-dim),transparent 70%);}
.ph::before{content:attr(data-ini);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;color:var(--muted2);}
.ph img{position:relative;width:100%;height:100%;object-fit:contain;}
.crest{width:34px;height:34px;object-fit:contain;flex-shrink:0;}
.mono{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.72rem;color:var(--muted);}
.empty{padding:40px 0;color:var(--muted);font-size:.95rem;}
.mini-h{font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin:22px 0 12px;}
.spinner{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 1 · MARCADOR ── */
.st-hero{position:relative;min-height:min(860px,calc(100svh - var(--bar-h)));display:flex;align-items:flex-end;overflow:hidden;padding-top:64px;isolation:isolate;}
.st-hero-bg{position:absolute;inset:0;z-index:-1;}
.st-hero-bg img{position:absolute;left:50%;bottom:-2%;width:max(1280px,118%);max-width:none;transform:translateX(-50%);opacity:.5;filter:saturate(.9);}
.st-hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 45%,transparent) 28%,color-mix(in srgb,var(--bg) 35%,transparent) 55%,var(--bg) 96%),radial-gradient(ellipse at 50% 100%,transparent 30%,color-mix(in srgb,var(--bg) 70%,transparent) 80%);}
.st-hero-in{width:100%;padding-bottom:clamp(28px,5vh,56px);}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);}
.st-title{font-weight:900;font-size:clamp(3rem,9vw,8.4rem);line-height:.86;letter-spacing:-.05em;margin:14px 0 14px;}
.st-title em{font-style:normal;color:var(--gold);}
.st-sub{font-size:clamp(.92rem,1.3vw,1.05rem);color:var(--ink2);}
.st-score{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:clamp(18px,4vw,64px);margin-top:clamp(26px,5vh,48px);padding-top:22px;border-top:1px solid var(--line);}
.hs{display:flex;flex-direction:column;gap:8px;min-width:0;}
.hs-n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2.6rem,6.4vw,5.6rem);line-height:.85;letter-spacing:-.02em;white-space:nowrap;}
.hs-n i{font-style:normal;color:var(--muted2);margin:0 .12em;font-weight:500;}
.hs-l .short{display:none;}
@media(max-width:560px){.hs-l .short{display:inline;}}
.hs-l{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.st-form{display:flex;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap;}
.hf-l{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-right:6px;}
.hf-m{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);transition:box-shadow .2s,transform .2s;}
.hf-m:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--muted2);}
.hf-crest{width:26px;height:26px;object-fit:contain;}
.hf-crest.mono{font-size:.6rem;}
.hf-s{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;}
.hf-c{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.72rem;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;}
.hf-m.win .hf-c{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win);}
.hf-m.draw .hf-c{background:color-mix(in srgb,var(--draw) 18%,transparent);color:var(--draw);}
.hf-m.loss .hf-c{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss);}

/* ── barra fija ── */
.st-bar{position:sticky;top:64px;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2);}
.st-bar .wrap{display:flex;align-items:center;gap:16px;min-height:var(--bar-h);}
#stComps{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
#stComps::-webkit-scrollbar{display:none;}
#stAnchors{display:flex;gap:2px;margin-left:auto;}
#stAnchors a{padding:7px 11px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--muted);text-decoration:none;transition:color .2s,background-color .2s;white-space:nowrap;}
#stAnchors a:hover{color:var(--text);}
#stAnchors a.on{color:var(--text);background:var(--line2);}

/* ── secciones ── */
.st-sec{padding:clamp(64px,10vh,120px) 0 0;}
.sec-head{display:grid;grid-template-columns:auto 1fr;column-gap:18px;align-items:baseline;margin-bottom:clamp(28px,4vw,48px);padding-top:18px;border-top:1px solid var(--line);}
.sec-n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;color:var(--gold);letter-spacing:.1em;}
.sec-head h2{font-weight:900;font-size:clamp(2rem,4.6vw,3.8rem);line-height:.95;letter-spacing:-.04em;}
.sec-head p{grid-column:2;margin-top:12px;color:var(--muted);font-size:.95rem;max-width:560px;}

/* ── 2 · PROTAGONISTAS: cuatro líderes con su top 5 ── */
.leads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,3vw,44px);}
.lead{display:flex;flex-direction:column;padding-top:16px;border-top:2px solid var(--gold);}
.lead-kicker{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
.lead-kicker span{letter-spacing:.04em;text-transform:none;font-weight:600;color:var(--muted2);}
.lead-top{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:end;margin:16px 0 18px;}
.lead-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(3rem,4.6vw,4.4rem);line-height:.82;letter-spacing:-.02em;white-space:nowrap;}
.lead-num small{display:block;margin-top:8px;font-family:'Barlow',sans-serif;font-size:.76rem;font-weight:600;letter-spacing:.02em;color:var(--muted);}
.lead-name{display:block;margin-top:12px;font-weight:800;font-size:1.08rem;text-align:left;overflow-wrap:anywhere;line-height:1.15;transition:color .2s;}
.lead-name:hover{color:var(--gold);}
.lead-sub{margin-top:4px;font-size:.78rem;color:var(--muted);}
.lead-photo{display:block;width:84px;height:104px;border-radius:14px;overflow:hidden;}
.lead-ph{width:100%;height:100%;}
.lead-ph img{position:absolute;width:250%;height:auto;left:-75%;top:-3%;max-width:none;object-fit:initial;transition:transform .4s;}
.lead-photo:hover .lead-ph img{transform:scale(1.06);}
.lead-list{list-style:none;}
.lead-list li{display:grid;grid-template-columns:16px minmax(0,1fr) 48px 52px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:.82rem;}
.ll-pos{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted2);}
.ll-name{text-align:left;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s;}
.ll-name:hover{color:var(--text);}
.ll-bar{height:3px;border-radius:3px;background:var(--track);overflow:hidden;}
.ll-bar i{display:block;height:100%;border-radius:3px;background:var(--muted2);}
.ll-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;text-align:right;color:var(--ink2);white-space:nowrap;}
.lead-list li.first .ll-name,.lead-list li.first .ll-val{color:var(--text);}
.lead-list li.first .ll-bar i{background:var(--gold);}

/* ── 3 · JUEGO ── */
.juego-top{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:clamp(20px,3vw,48px);align-items:center;}
.arc-fig{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;}
.arc-fig figcaption{font-size:.88rem;color:var(--ink2);max-width:220px;}
.g-arc{width:100%;max-width:180px;height:auto;}
.g-arc-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:2.6rem;fill:var(--text);}
.g-arc-sub{font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;fill:var(--muted);}
.radar-fig{display:flex;flex-direction:column;align-items:center;gap:14px;}
.g-grid polygon,.g-grid line{fill:none;stroke:var(--line);stroke-width:1;}
.g-radar-shape{fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c);stroke-width:2;stroke-linejoin:round;}
.g-radar-cmp{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;}
.g-radar-lbl{font-size:12px;font-weight:700;fill:var(--ink2);}
.g-radar-d{font-size:11px;font-weight:600;fill:var(--muted2);}
.radar-modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.juego-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:clamp(40px,6vw,72px) 0 clamp(28px,4vw,44px);padding-top:24px;border-top:1px solid var(--line2);}
.jn{display:flex;flex-direction:column;gap:8px;}
.jn-n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2.4rem,4.6vw,3.8rem);line-height:.9;}
.jn-l{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.juego-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px clamp(24px,5vw,72px);}
.g-bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:14px;}
.g-bar-lbl{font-size:.84rem;color:var(--ink2);}
.g-bar-track{height:3px;border-radius:3px;background:var(--track);overflow:hidden;}
.g-bar-fill{display:block;height:100%;border-radius:3px;}
.g-bar-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;text-align:right;}
.statement{margin-top:clamp(40px,6vw,64px);font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:700;line-height:1.25;letter-spacing:-.02em;max-width:900px;color:var(--ink2);}
.statement b{color:var(--text);}

/* ── 4 · PARTIDOS ── */
.line-wrap{width:100%;overflow:hidden;}
.g-line .g-grid line{stroke:var(--line2);}
.g-line .g-grid text,.g-axis{font-size:11px;fill:var(--muted2);font-weight:600;}
.g-path{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.g-dot circle{fill:var(--bg);stroke:var(--gold);stroke-width:2.5;transition:r .2s;}
.g-dot.win circle{stroke:var(--win)}.g-dot.loss circle{stroke:var(--loss)}.g-dot.draw circle{stroke:var(--draw)}
.g-dot:hover circle{r:7;}
.g-dot-v{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;fill:var(--ink2);}
.ribbon-wrap{position:relative;margin-top:28px;}
.ribbon{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
.mt{flex:0 0 188px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:14px 14px 12px;text-align:left;border-top:2px solid var(--line);transition:background-color .2s,border-color .2s,transform .2s;border-radius:0 0 12px 12px;}
.mt:hover{background:var(--line2);transform:translateY(-3px);}
.mt.win{border-top-color:var(--win)}.mt.draw{border-top-color:var(--draw)}.mt.loss{border-top-color:var(--loss)}
.mt-top{display:flex;align-items:center;justify-content:space-between;}
.mt-score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.9rem;line-height:1;}
.mt-rival{font-weight:700;font-size:.92rem;line-height:1.2;}
.mt-meta{font-size:.72rem;color:var(--muted);}
.mt-note{font-size:.68rem;color:var(--muted2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rb-nav{position:absolute;top:30%;z-index:2;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--bg) 85%,transparent);box-shadow:inset 0 0 0 1px var(--line);font-size:1.3rem;color:var(--text);transition:box-shadow .2s;}
.rb-nav:hover{box-shadow:inset 0 0 0 1px var(--gold);}
.rb-nav.prev{left:-6px}.rb-nav.next{right:-6px}

/* ── 5 · PLANTEL ── */
.pl-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
.pl-grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 18px;}
.pl-item.is-hidden{display:none;}
.pl-btn{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto auto;column-gap:14px;align-items:center;width:100%;padding:14px 4px;text-align:left;border-top:1px solid var(--line2);transition:background-color .2s;border-radius:0 0 12px 12px;}
.pl-btn:hover{background:var(--line2);}
.pl-btn:hover .pl-photo img{transform:scale(1.06);}
.pl-photo{grid-row:1/4;width:64px;height:76px;border-radius:12px;}
.pl-photo img{position:absolute;width:250%;height:auto;left:-75%;top:-3%;max-width:none;object-fit:initial;transition:transform .4s;}
.pl-photo::before{font-size:1.1rem;}
.pl-name{font-weight:800;font-size:.98rem;overflow-wrap:anywhere;line-height:1.15;}
.pl-meta{font-size:.72rem;color:var(--muted);margin-top:2px;}
.pl-nums{display:flex;gap:12px;margin-top:8px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);}
.pl-nums span{display:flex;flex-direction:column;}
.pl-nums b{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;letter-spacing:0;color:var(--text);}
.pl-nodata{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted);}
.pl-nodata span{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-right:6px;}
.pl-nodata i{font-style:normal;padding:3px 10px;border-radius:999px;background:var(--line2);}

/* ── 6 · CARA A CARA ── */
.cmp{display:grid;grid-template-columns:1fr minmax(0,1.6fr) 1fr;gap:clamp(12px,3vw,40px);align-items:end;}
.cmp-side{display:flex;flex-direction:column;align-items:center;gap:14px;}
.cmp-ph{display:block;width:100%;height:clamp(240px,34vw,420px);}
.cmp-img{width:100%;height:100%;background:none;}
.cmp-img img{object-position:50% 100%;}
.cmp-img::before{font-size:3rem;}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;color:var(--text);font:800 1rem 'Barlow',sans-serif;padding:10px 34px 10px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);border:0;cursor:pointer;max-width:100%;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;}
.sel select option{background:var(--bg);color:var(--text);}
.cmp-rows{display:flex;flex-direction:column;}
.cmp-row{display:grid;grid-template-columns:68px 1fr auto 1fr 68px;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line2);}
.cmp-l{font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;min-width:120px;}
.cmp-v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.25rem;color:var(--muted);white-space:nowrap;}
.cmp-v.a{text-align:left}.cmp-v.b{text-align:right}
.cmp-b{height:4px;background:var(--track);border-radius:4px;display:flex;overflow:hidden;}
.cmp-b.a{justify-content:flex-end;}
.cmp-b i{display:block;height:100%;width:0;border-radius:4px;background:var(--muted2);}
.cmp-row.win-a .cmp-v.a,.cmp-row.win-b .cmp-v.b{color:var(--text);}
.cmp-row.win-a .cmp-b.a i{background:var(--gold);}
.cmp-row.win-b .cmp-b.b i{background:var(--e11);}

/* ── 7 · CLUB EA ── */
.ea-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;}
.ea-kpi{display:flex;flex-direction:column;gap:8px;}
.ea-kpi .big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2.2rem,4vw,3.4rem);line-height:.9;}
.ea-kpi .lbl{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.ea-wdl{display:flex;gap:3px;height:6px;border-radius:6px;overflow:hidden;margin:26px 0 36px;}
.ea-wdl .win{background:var(--win)}.ea-wdl .draw{background:var(--draw)}.ea-wdl .loss{background:var(--loss)}
.ea-cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);}
.ea-dl{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
.ea-dl div,.pp-dl div,.pm-stats div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line2);}
.ea-dl dt,.pp-dl dt,.pm-stats dt{font-size:.84rem;color:var(--ink2);}
.ea-dl dd,.pp-dl dd,.pm-stats dd{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.15rem;text-align:right;}
.pp-dl dd small{font-family:'Barlow',sans-serif;font-weight:600;color:var(--muted);font-size:.72rem;}
.form-row{display:flex;gap:5px;flex-wrap:wrap;}
.form-chip{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.85rem;}
.form-chip.win{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win);}
.form-chip.draw{background:color-mix(in srgb,var(--draw) 16%,transparent);color:var(--draw);}
.form-chip.loss{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss);}
.ea-last{list-style:none;}
.ea-last li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line2);align-items:baseline;}
.ea-m-date{font-size:.76rem;color:var(--muted);}
.ea-m-rival{font-weight:600;}
.ea-last .score{font-size:1.2rem;}
.ea-note{font-size:.82rem;color:var(--muted);line-height:1.6;margin:20px 0;}
.ea-loading,.ea-error{padding:40px 0;color:var(--muted);}
.ea-error-t{font-weight:800;font-size:1.2rem;color:var(--text);}
.ea-error-s{margin:8px 0 18px;max-width:520px;}
.ea-error details{margin-bottom:16px;font-size:.75rem;}
.ea-error pre{white-space:pre-wrap;word-break:break-all;margin-top:8px;color:var(--muted2);}
.ea-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ── paneles ── */
.panel{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.62);display:flex;justify-content:flex-end;}
.panel[hidden]{display:none;}
.panel-box{position:relative;width:min(640px,100%);height:100%;overflow-y:auto;background:var(--bg);box-shadow:-30px 0 80px rgba(0,0,0,.5);padding:clamp(24px,4vw,44px);overscroll-behavior:contain;}
.panel-close{position:absolute;top:16px;right:16px;z-index:3;width:42px;height:42px;border-radius:50%;font-size:1.6rem;line-height:1;color:var(--text);box-shadow:inset 0 0 0 1px var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);transition:box-shadow .2s,transform .2s;}
.panel-close:hover{box-shadow:inset 0 0 0 1px var(--gold);transform:rotate(90deg);}
.pm-kicker{font-size:.76rem;color:var(--muted);margin-top:6px;}
.pm-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:26px 0 18px;}
.pm-team{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:700;font-size:.9rem;}
.pm-team img,.pm-crest{width:64px;height:64px;object-fit:contain;}
.pm-crest.mono{font-size:1rem;}
.pm-res{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(3.4rem,10vw,5rem);line-height:1;}
.pm-res i{font-style:normal;color:var(--muted2);margin:0 .1em;}
.pm-res.win{color:var(--win)}.pm-res.loss{color:var(--loss)}.pm-res.draw{color:var(--draw)}
.pm-note{text-align:center;color:var(--ink2);font-size:.88rem;}
.pm-goals{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:12px;font-size:.82rem;color:var(--muted);}
.pm-goals b{color:var(--text);}
.pm-stats{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:26px 0;}
.pm-table{overflow-x:auto;}
.pm-table table{width:100%;border-collapse:collapse;font-size:.84rem;}
.pm-table th{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);text-align:right;padding:8px 6px;}
.pm-table th:first-child{text-align:left;}
.pm-table td{padding:9px 6px;border-top:1px solid var(--line2);text-align:right;color:var(--ink2);white-space:nowrap;}
.pm-table td.tp-name{text-align:left;color:var(--text);font-weight:700;}
.tp-pos{font-size:.62rem;font-weight:700;color:var(--muted2);margin-left:6px;}
/* perfil a pantalla completa */
#playerPanel{justify-content:center;}
#playerBox{width:100%;max-width:none;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);padding:0;box-shadow:none;}
.pp-media{position:sticky;top:0;height:100svh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 65%);}
.pp-img{position:relative;z-index:1;width:100%;height:92%;background:none;}
.pp-img img{object-position:50% 100%;}
.pp-img::before{font-size:6rem;}
.pp-num{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:min(42vh,30vw);line-height:1;color:color-mix(in srgb,var(--gold) 12%,transparent);}
.pp-body{padding:clamp(70px,9vh,110px) clamp(24px,4vw,64px) 60px;}
.pp-kicker{font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.pp-name{font-weight:900;font-size:clamp(2.2rem,5vw,4.4rem);line-height:.92;letter-spacing:-.04em;margin:12px 0 26px;overflow-wrap:anywhere;}
.pp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:18px;border-top:1px solid var(--line);}
.pp-kpis div{display:flex;flex-direction:column;gap:6px;}
.pp-kpis b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(2rem,3.6vw,3rem);line-height:.9;}
.pp-kpis div>span{font-size:.64rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.pp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin-top:30px;}
.pp-radar{display:flex;flex-direction:column;align-items:center;gap:10px;}
.pp-radar figcaption{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;}
.lg-sw{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--gold);}
.lg-sw.avg{background:none;border-top:2px dashed var(--muted);height:0;margin-left:8px;}
.pp-line svg{width:100%;height:auto;}
.pp-list{list-style:none;}
.pp-list li{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:.86rem;}
.pe-date{color:var(--muted);font-size:.76rem;}
.pe-rival{font-weight:600;}
.pe-rival .score{margin-left:6px;}
.pe-ga{font-size:.76rem;color:var(--muted);}
.pe-ga b{color:var(--text);}
.pp-body .pill{margin-top:28px;}

footer{padding:clamp(60px,10vh,110px) var(--ts-g) 36px;text-align:center;font-size:.78rem;color:var(--muted2);}
footer span{color:var(--gold);}

/* ── responsive ── */
@media(max-width:1100px){
  #stAnchors{display:none;}
  .leads{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:44px;}
  .juego-top{grid-template-columns:1fr 1fr;}
  .radar-fig{grid-column:1/-1;}
}
@media(max-width:899px){
  .st-score{grid-template-columns:1fr 1fr;row-gap:26px;}
  .juego-nums{grid-template-columns:1fr 1fr;row-gap:28px;}
  .juego-bars{grid-template-columns:1fr;}
  .ea-kpis{grid-template-columns:repeat(3,1fr);row-gap:26px;}
  .ea-cols{grid-template-columns:1fr;}
  .cmp{grid-template-columns:1fr 1fr;}
  .cmp-rows{grid-column:1/-1;order:3;}
  .cmp-ph{height:clamp(200px,56vw,320px);}
  #playerBox{grid-template-columns:1fr;}
  .pp-media{position:relative;height:52svh;}
  .pp-body{padding-top:20px;}
  .pp-row{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .hs-l .long{display:none;}
  .leads{grid-template-columns:1fr;}
  .st-bar .wrap{gap:10px;}
  .seg{padding:7px 11px;}
  .g-bar{grid-template-columns:118px 1fr 46px;gap:10px;}
  .pm-stats,.ea-dl{grid-template-columns:1fr;}
  .cmp-row{grid-template-columns:58px 1fr auto 1fr 58px;gap:6px;}
  .cmp-v{font-size:1.02rem;}
  .cmp-l{min-width:84px;font-size:.66rem;}
  .pl-grid{grid-template-columns:1fr 1fr;column-gap:12px;}
  .pl-btn{grid-template-columns:1fr;grid-template-rows:auto;row-gap:2px;}
  .pl-photo{grid-row:auto;width:100%;height:150px;}
  .pl-photo img{width:170%;left:-35%;}
  .pp-kpis{grid-template-columns:1fr 1fr;row-gap:20px;}
  .rb-nav{display:none;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  html{scroll-behavior:auto;}
}
/* View Transitions al cambiar de temporada/competencia */
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s;}
